# Investigation Tracker - Traveller Stephanus Campaign
# Centralized tracking for mission objectives, leads, and intelligence

# =============================================================================
# PRIMARY MISSION
# =============================================================================
primary_mission:
  name: "Recovery of the Ithian Death Mask"
  client: Jade Front
  contact: Kyle Newhouse
  assigned: Session 2
  status: active
  objective: |
    Recover the sacred Ithian death mask and return it to Ith. Success would
    provide the Jade Front a massive propaganda coup against the Quiru-Newhall
    alliance, potentially securing a political alliance with Ith.

# =============================================================================
# CHAIN OF CUSTODY (What we know about the mask's history)
# =============================================================================
chain_of_custody:
  - period: "~71 years ago (end of 2nd Agretic War)"
    event: "Mask found at—and subsequently stolen from—Mora antiquities market"
    source: Kyle Newhouse briefing (Session 2)

  - period: "Post-theft, unknown duration"
    event: "Mask appears in collection of Keith Sevont, a soldier from Newhall"
    source: Kyle Newhouse briefing (Session 2)

  - period: "After Sevont's death"
    event: "Descendants contact Ithian Cultural Ministry to arrange repatriation"
    source: Kyle Newhouse briefing (Session 2)

  - period: "Before transfer completed"
    event: "Mask disappears again"
    source: Kyle Newhouse briefing (Session 2)

  - period: "Recent (before campaign start)"
    event: "Journalist Choophong Thanatkha breaks story about the theft"
    source: Kyle Newhouse briefing (Session 2)

  - period: "Current"
    event: "Location unknown. Multiple factions racing to recover it."
    source: Party investigation

# =============================================================================
# ACTIVE LEADS
# =============================================================================
active_leads:

  - name: "Choophong Thanatkha (Choo)"
    priority: high
    status: in_progress
    description: |
      Stoybeni investigative journalist who broke the death mask story.
      Was working on Mora. Missing for 3+ months.
    action_required: "Find Choo or determine what happened to them. Investigate Pardeep Sarsar's disappearance."
    established: Session 2
    last_update: Session 6
    notes: |
      Session 5: Editor Doné Rivis worried about disappearance. Rivis has no knowledge
      of Choo's story or current whereabouts. Dispatch mainframe hack failed.
      Session 6: Rivis revealed Pardeep Sarsar as Choo's trusted lieutenant and courier.
      Sarsar is also missing — family has no sign or recent communication.
      Two missing people connected to the same story is a pattern.

  - name: "Iron Commerce 18 / al-Thani Connection"
    priority: medium
    status: stalled
    description: |
      300-ton tramp freighter with al-Thani crew (confirmed via psychic viewing).
      Falsified cargo manifest (claimed pharmaceuticals and manufacturing drones).
      Took on 20 tons fuel at Ith, did no trade, no one disembarked.
    action_required: "Track destination; investigate al-Thani involvement"
    established: Session 3
    notes: |
      Customs inspector Angus Graham (bribed by IC18 crew) said their "friends"
      were bound for "home." Crew wore typical Thane garb: all black, faces covered.
      Possible destination: al-Thani homeworld?

  - name: "Cooper-Akachi Operatives"
    priority: medium
    status: monitoring
    description: |
      Street-level intel indicates Cooper-Akachi dispatched an elite team
      of operatives to Mora in pursuit of the mask.
    action_required: "Monitor; avoid or neutralize if encountered"
    established: Session 3 (Petra's intel)
    notes: |
      Possible connection to al-Thani? Both headed toward Mora region.

  - name: "Rivis Job — Deliver Message to Kara Wiley on Thane"
    priority: medium
    status: deferred
    description: |
      Rivis offered 40k Cr up front, 80k Cr on completion to deliver an encrypted
      message to Kara Wiley, an undercover reporter embedded in a political family
      on Thane.
    action_required: "Return to this job — party went directly to Mowebe without stopping at Thane."
    established: Session 6
    notes: |
      Party bypassed Thane en route to Mowebe (Sessions 8–9). Job not accepted or declined —
      simply not pursued. Total payout: 120k Cr. Would need to revisit Thane to complete.

  - name: "Maitz Space Battle Investigation"
    priority: high
    status: in_progress
    description: |
      Border skirmishes reported in the outer bounds of Maitz between Quiru and Newhall
      (Campaign Week 12, per Faisal al-Amin's Thane debrief). The party arrived in Session 13.
    action_required: "Continue surveying wrecks. Decode battle logs / encrypted files. Locate Deepest Light. Board Revenant's Echo."
    established: Session 12
    last_update: Session 13
    notes: |
      Intel from Faisal al-Amin (Wk 12 report). Ship counts from the engagement:
      QUIRU — Big: 1, Medium: 3 (2 disabled), Small: 1 (1 disabled)
      NEWHALL — Big: 2 (1 disabled), Medium: 1, Small: 6 (2 disabled)
      Session 13: Arrived in Maitz. Surveyed 6 wrecks around the sole gas giant
      (2 are debris fields). Named hulls: Revenant's Echo (largest), Star of Carella
      (Newhall, looted), Adamant, Savage Intent, Deepest Light (Newhall scout, 100 dT).
      Star of Carella stripped: data slabs + 2x 10 dT shuttlecraft + 16 tons Rx, plus
      siphoned fuel. "Cry baby cry" diversion staged aboard. Revenant's Echo not yet boarded.

  - name: "Decode Star of Carella Encrypted Files"
    priority: high
    status: in_progress
    description: |
      Thousands of short, encrypted files recovered from Star of Carella storage crystals.
      Span an 8-hour window starting the minute Star of Carella arrived in Maitz, ending
      abruptly. Believed to be battle logs / comms traffic. Higher-grade encryption used.
    action_required: "Decrypt files. Identify content (battle logs? command traffic?)."
    established: Session 13
    notes: |
      Already decrypted: orders dispatching Star of Carella from Tivid to Maitz ASAP to
      "support operations" — capture or destroy the Newhall scout Deepest Light.
      Orders unsigned, Priority 1. Higher-grade security suggests command-level traffic.

  - name: "Locate the Deepest Light"
    priority: high
    status: in_progress
    description: |
      Newhall 100 dT scout ship that was the Priority 1 target of Star of Carella's
      capture-or-destroy orders. Newhall was hunting one of its own — likely a defector,
      whistleblower, or thief carrying high-value information.
    action_required: |
      Determine the Deepest Light's fate: did it escape Maitz, was it destroyed, or is
      it among the wrecks? If among the wrecks, board it. If it escaped, track it.
    established: Session 13
    notes: |
      A ship named Deepest Light is listed among the Maitz wrecks (size marker 5).
      Confirm whether this is the same ship or a coincidence/decoy.
      Whatever the Deepest Light was carrying is what Newhall command wanted silenced.

  - name: "Board Other Maitz Wrecks"
    priority: medium
    status: pending
    description: |
      Four named wrecks remain unboarded: Revenant's Echo (largest, primary intent),
      Adamant, Savage Intent, Deepest Light. Plus two debris fields too disintegrated to ID.
    action_required: "Board Revenant's Echo (party's stated intent). Then sweep the rest."
    established: Session 13
    notes: |
      "Cry baby cry" diversion left aboard Star of Carella — should buy time before any
      response party arrives.

  - name: "Missing Book from Star of Carella Captain's Bookshelf"
    priority: low
    status: open
    description: |
      Captain's stateroom search turned up only one anomaly: a missing book from the
      bookshelf. Nothing else out of the ordinary.
    action_required: "Note for follow-up. May indicate the captain (or someone) hid or removed something significant."
    established: Session 13
    notes: |
      Physical paper books in a captain's stateroom are unusual enough to be personally
      meaningful. The missing one could be: hidden, smuggled out, or used as a hollowed
      cache. No way to know what title without external info.

  - name: "Cooper-Akachi / Solal Connection"
    priority: medium
    status: in_progress
    description: |
      Jassem Solal's schedule contained a suspicious number of meetings with
      Cooper-Akachi Diversified Industries representatives.
    action_required: "Investigate the nature of Solal's business with Cooper-Akachi"
    established: Session 10
    notes: |
      Discovered via estate server hack (Session 10). Cooper-Akachi is already known
      to have dispatched elite operatives to Mora (Session 3 intel). The Solal connection
      may be relevant to the mask investigation — Cooper-Akachi's interest in Solal, a
      wealthy Thani noble, is unexplained.

  - name: "Rivis Job — Check on Choo's Wellbeing on Mora"
    priority: medium
    status: available
    description: |
      Rivis offered 10k Cr up front, 25k Cr on completion to check on Choophong
      Thanatkha's wellbeing on Mora.
    action_required: "Accept or decline. If accepted, travel to Mora and investigate."
    established: Session 6
    notes: |
      Aligns with party's existing Choo investigation lead. Total payout: 35k Cr.
      Mora is further afield — would require significant travel beyond current plans.

# =============================================================================
# RESOLVED LEADS
# =============================================================================
resolved_leads:

  - name: "JF Intelligence Operative (Faisal al-Amin)"
    priority: high
    status: resolved
    description: |
      Jade Front operative dispatched on intelligence-gathering circuit:
      Ith → Mowebe → Thane (2 months listening for Mora updates) → Mowebe
    action_required: null
    established: Session 4
    resolved: Session 12
    notes: |
      Traveling via middle passage tickets. Gathered intel filtering back from Mora.
      Session 12: Made contact at lunar JF depot. Identified as Faisal al-Amin.
      Full debriefing recorded under Key Intel — see "Coop-Ak commandos through Thane (Wk 10)"
      and "Quiru-Newhall border skirmish at Maitz (Wk 12)".

  - name: "Ugrik Weapons Delivery"
    priority: low
    status: resolved
    description: |
      JF station chief Isaiah Reed noted the Front needs weapons on Ugrik.
      Party currently has 16.5 tons of weapons cargo.
    action_required: null
    established: Session 5
    last_update: Session 6
    notes: |
      Weapons traded directly to Isaiah Reed on Stoyben (Session 6).

  - name: "JF Operation — O'Neill Cylinder (Torin's Hard Drive)"
    priority: high
    status: resolved_partial
    description: |
      Official Jade Front job from Isaiah Reed. JF agent "Alicia" (now burned) spent months
      grooming Civic Administrator Torin's wife Vondel to download Torin's work computer hard drive.
    action_required: null
    established: Session 7
    resolved: Session 8
    notes: |
      Session 8: Arvi murdered Torin to free Vondel from abuse. Party extracted Vondel and fled.
      Hard drive from Torin's work computer was NEVER obtained.
      Vondel's behavioral shift explained: she and Arvi had their own plan forming.
      Tevetz was genuinely helping Vondel in good faith (not scheming).
      Political fallout from Torin's murder was significant. Isaiah Reed paid more for Vondel's
      full-system exfiltration and cut the party's pay, but issued a positive letter of recommendation.

# =============================================================================
# DEAD ENDS (Leads ruled out)
# =============================================================================
dead_ends:

  - name: "Kelly Fitzpatrick"
    ruled_out: Session 5
    description: "Shift supervisor in Dispatch production/press department"
    reason: "Recently deceased but investigation found no connection to mask or Choo"

  - name: "Antonio Jose Cuevas"
    ruled_out: Session 5
    description: "JF informant, Marketing Account Manager at Dispatch"
    reason: "Has contacts but proved unhelpful when questioned. Entitled asshole."

  - name: "Doné Rivis (direct knowledge)"
    ruled_out: Session 5
    description: "Editor for Investigative Journalism at Dispatch"
    reason: |
      Victor's hypnosis confirmed he has no knowledge of the mask or Choo's story.
      Genuinely worried about Choo's disappearance.
    notes: |
      NOT fully ruled out as asset—party has unused blackmail material on him.
      Could be leveraged for access/favors if needed.

  - name: "Dispatch Mainframe (hack approach)"
    ruled_out: Session 5
    description: "Attempt to search for traces of Choo's filed/suppressed story"
    reason: |
      Baron Harrow failed both hack attempts. Firewall AI attempted reverse trace.
      Machine destroyed to prevent identification.

# =============================================================================
# OPEN QUESTIONS
# =============================================================================
open_questions:

  - question: "Who currently has the mask?"
    priority: critical
    notes: "Core mystery. No definitive intelligence yet."

  - question: "Where are Choophong Thanatkha and Pardeep Sarsar?"
    priority: high
    notes: |
      Both missing. Choo: 3+ months, last known on Mora. Sarsar: Choo's trusted
      lieutenant/courier, family has no sign or recent communication. Two connected
      disappearances suggest foul play rather than coincidence.

  - question: "Did Choo file a story that was suppressed?"
    priority: high
    notes: "If so, by whom? Hack attempt to find traces failed."

  - question: "Where is the Iron Commerce 18 headed?"
    priority: medium
    notes: "Graham said 'home'—al-Thani space? Specific destination unknown."

  - question: "What is the al-Thani interest in the mask?"
    priority: medium
    notes: "At least 2 confirmed al-Thani crew on IC18. Cultural? Political? Hired?"

  - question: "What is the connection between Cooper-Akachi and al-Thani?"
    priority: medium
    notes: "Both seem to be moving toward Mora. Coordinated? Competing?"

  - question: "What is IIP's interest in the party/mask?"
    priority: low
    notes: "IIP associates approached party discreetly (Session 2). No follow-up yet."

  - question: "Why did Vondel's behavior shift when she backed out of the exfiltration?"
    priority: low
    notes: |
      RESOLVED (Session 8): She and Arvi had their own plan forming — Arvi murdered Torin
      to free Vondel. Tevetz was genuinely helping her, not scheming. Behavioral shift was
      because she knew action was imminent.

  - question: "What intel did Faisal al-Amin bring back from Thane?"
    priority: high
    notes: |
      JF operative completed Ith→Mowebe→Thane→Mowebe circuit. Debriefed party at lunar
      JF depot (Session 12). Content of his intelligence not yet detailed in notes.

  - question: "What happened at Maitz? (Quiru-Newhall border skirmish)"
    priority: high
    notes: |
      Faisal al-Amin confirmed: Quiru and Newhall clashed in outer Maitz at Campaign Week 12.
      Ship loss data recorded in key_intel. Why are Quiru and Newhall fighting? What does this
      mean for the regional political situation? Party arrived Session 13 — surveying wrecks.

  - question: "Who within Newhall issued the Priority 1 order to take down the Deepest Light?"
    priority: high
    notes: |
      Orders were unsigned but Priority 1 — high-level command traffic, security buffered
      by deniability. Tivid appears to be the dispatching authority's location.

  - question: "What is the Deepest Light carrying — or who is aboard?"
    priority: high
    notes: |
      Newhall command considered the Deepest Light a high-priority target worth a
      capture-or-destroy order. The cargo or person aboard is the real prize.

  - question: "Is Cooper-Akachi involved at Maitz?"
    priority: medium
    notes: |
      William speculates Cooper-Akachi may have been here (consistent with the Coop-Ak
      commandos passing through Thane Wk 10). Not yet confirmed by any wreckage or intel.

  - question: "What was the missing book from Star of Carella's captain's bookshelf?"
    priority: low
    notes: |
      Only anomaly in the captain's stateroom search. Could indicate hidden message,
      smuggled item, or hollowed cache. Title unknown without more info.

  - question: "What is the Cooper-Akachi connection to Jassem Solal?"
    priority: medium
    notes: |
      Solal had a suspicious number of meetings with Cooper-Akachi Diversified Industries
      reps (discovered via estate server hack, Session 10). Cooper-Akachi already known
      to be pursuing the death mask. The Solal connection may be significant.

  - question: "Will the L3 bombing be traced back to the party?"
    priority: low
    notes: "Les Wrownand/Bravida framed. Sint propaganda approach successful."

# =============================================================================
# KEY INTELLIGENCE
#
# Each entry has a stable `id` so that other entries (lead notes, session
# recaps, NPC notes) can reference the specific intel by name. `category`
# groups related facts on the Investigation page render.
# =============================================================================
key_intel:

  # --- The Mask ---------------------------------------------------------------
  - id: factions-racing
    category: The Mask
    fact: "Multiple factions are racing to recover the mask"
    factions: ["Jade Front", "Cooper-Akachi", "al-Thani (suspected)", "IIP (interest unclear)"]
    source: Various (Sessions 2-5)

  - id: mask-value-to-ith
    category: The Mask
    fact: "The mask has significant cultural/political value to Ith"
    details: "Recovery would provide JF propaganda coup, potentially secure Ith alliance against Quiru-Newhall"
    source: Kyle Newhouse (Session 2)

  # --- Choo Investigation -----------------------------------------------------
  - id: choo-missing
    category: Choo Investigation
    fact: "Choo broke the story but has been missing 3+ months"
    details: "Last known on Mora. Even their editor doesn't know their status."
    source: Doné Rivis (Session 5)

  - id: choo-punctual
    category: Choo Investigation
    fact: "Choo is always punctual — prolonged silence is very out of character"
    details: "Makes the disappearance more alarming; not someone who would go silent voluntarily."
    source: Doné Rivis (Session 6)

  - id: sarsar-missing
    category: Choo Investigation
    fact: "Pardeep Sarsar (Choo's assistant/courier for filing stories) is also missing"
    details: "Family has no sign or recent communication. Nobody at Stoyben spaceport has seen him. Two disappearances linked to same story."
    source: Doné Rivis (Session 6)

  # --- al-Thani Movements -----------------------------------------------------
  - id: ic18-thani-crew
    category: al-Thani Movements
    fact: "Iron Commerce 18 crew confirmed al-Thani"
    details: "Psychic viewing confirmed at least 2 crew. Typical Thane garb: all black, faces covered."
    source: Party investigation (Session 3)

  # --- Cooper-Akachi Movements ------------------------------------------------
  - id: coop-ak-mora-operatives
    category: Cooper-Akachi Movements
    fact: "Cooper-Akachi has elite operatives en route to Mora"
    details: "Street-level rumor confirmed by Petra"
    source: Petra (Session 3)

  - id: coop-ak-thane-wk10
    category: Cooper-Akachi Movements
    fact: "Seven Coop-Ak commandos passed through Thane at Campaign Week 10 aboard the Star Home"
    details: |
      Traveled incognito on an old 400dt freighter called the Star Home, stopping to resupply
      at Thane. Met Ta-ka-ti diplomatic staff on the grounds of Morqash University for 10+ hours.
      Then visited the Coop-Ak orbital corporate station before departing. Filed flight plan for
      Newhall but departed from the anti-spinward (left) jump point — destination mismatch is suspicious.
    source: Faisal al-Amin debrief (Session 12)

  # --- Maitz Battle -----------------------------------------------------------
  - id: maitz-skirmish-wk12
    category: Maitz Battle
    fact: "Quiru-Newhall border skirmish in outer Maitz at Campaign Week 12"
    details: |
      Ship counts — QUIRU: Big 1, Medium 3 (2 disabled), Small 1 (1 disabled).
      NEWHALL: Big 2 (1 disabled), Medium 1, Small 6 (2 disabled).
      Format: deployed (disabled). Newhall outnumbered in big ships but deployed far more smalls.
    source: Faisal al-Amin debrief (Session 12)

  - id: maitz-wrecks
    category: Maitz Battle
    fact: "Six wrecks at Maitz around the sole gas giant"
    details: |
      Named hulls: Revenant's Echo (largest), Star of Carella (Newhall),
      Adamant, Savage Intent, Deepest Light (Newhall, 100 dT scout).
      Two of the six wrecks are debris fields too disintegrated to identify.
    source: Party survey (Session 13)

  - id: newhall-hunting-own
    category: Maitz Battle
    fact: "Newhall was hunting one of its own ships at Maitz"
    details: |
      Star of Carella (Newhall) was dispatched from Tivid to Maitz ASAP under
      unsigned Priority 1 orders to capture or destroy the Deepest Light, a
      Newhall 100 dT scout ship. Internal Newhall hunt — likely a defector,
      whistleblower, or thief carrying valuable cargo or intelligence.
    source: Decrypted Star of Carella orders (Session 13)

  - id: tivid-newhall-base
    category: Maitz Battle
    fact: "Star of Carella was based in Tivid"
    details: |
      Tivid appears to be a Newhall command/staging location. Star of Carella
      was redirected from Tivid to Maitz ASAP "to support operations."
    source: Decrypted Star of Carella data slabs (Session 13)

  - id: star-carella-encrypted-traffic
    category: Maitz Battle
    fact: "Star of Carella storage crystals contain 8 hours of dense encrypted traffic"
    details: |
      Thousands of short, encrypted files starting the minute Star of Carella
      arrived in Maitz and ending abruptly 8 hours later. Higher-grade
      encryption than typical ship traffic. Believed to be battle logs and/or
      command comms. Not yet decoded.
    source: Star of Carella loot (Session 13)

