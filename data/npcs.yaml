# NPC Registry - Traveller Stephanus Campaign
# Consolidated dictionary of all NPCs encountered

npcs:

  # ===========================================================================
  # JADE FRONT
  # ===========================================================================

  - name: Kyle Newhouse
    affiliation: Jade Front
    role: Recruiter / Party Contact
    location: Ith
    status: active
    first_appearance: Session 2
    description: |
      The party's primary Jade Front contact. Provided initial mission briefing
      about the Ithian death mask and 150k cr in encrypted credit chips.
    notes: |
      Established signal routines for arranging meetings with JF agents.

  - name: Petra
    affiliation: Jade Front
    role: Operative / Contact
    location: Aboard Voice of Liberation II
    status: active
    first_appearance: Session 3
    description: |
      JF contact who shared street-level intel about Cooper-Akachi dispatching
      elite operatives to Mora. Suggested traveling to Ith L3 station.
    notes: null

  - name: Samir
    affiliation: Jade Front
    role: Operative / Demolitions
    location: Aboard Voice of Liberation II
    status: active
    first_appearance: Session 3
    description: |
      JF contact traveling with the party. Crafted the bomb used in the
      Dylan Connell assassination (Session 4).
    notes: null

  - name: Oa Danel
    affiliation: Jade Front / Sint Motor Systems Tfd.
    role: Station Operative
    location: Ith L3 research station
    status: active
    first_appearance: Session 4
    description: |
      Ithian with polished demeanor. Operates through the cover R&D company
      "Sint Motor Systems Tfd." Provided pharmaceuticals and illicit arms.
    notes: |
      Won propaganda coup for Sint by distributing medicine after the bombing.
      Secured JF freedom of operation at L3 station.

  - name: Isaiah Reed
    affiliation: Jade Front (Stoyben station chief)
    role: Station Chief
    location: Stoyben
    status: active
    first_appearance: Session 5
    description: |
      JF leadership on Stoyben. Has no knowledge of the party's specific mission.
      Traded weapons for refined fuel (Session 6).
    notes: |
      Session 5: Expressed need for weapons on Ugrik if party travels that way.
      Session 6: Traded weapons for refined fuel.
      Session 7: Assigned official JF job - O'Neill cylinder operation involving
      Administrator Torin and his wife Vondel.
      Session 8: Cut party's pay after Arvi murdered Torin and Vondel had to flee
      the entire Stoyben system (more expensive than planned exfil). Still issued
      party a positive letter of recommendation.

  - name: Kikonye
    affiliation: Jade Front (Mowebe station chief)
    role: Station Chief
    location: Mowebe
    status: active
    first_appearance: Session 9
    description: |
      JF Mowebe station chief. Tall, chiseled, handsome. Early 50s. Dresses extremely sharp.
      Runs ops out of a luxury art gallery. Known to be extremely zealous and ruthless, even
      callous - will sacrifice agents if the mission demands it.
    notes: |
      Session 9: Offered sabotage job or Solal kidnapping; party chose kidnapping.
      Session 12: Rewarded party with 45k Cr, stealthsuit, 2 quantum weapons, and
      "lie detector" cybernetic implants for Baron Harrow.

  - name: '"Jake"'
    affiliation: Jade Front
    role: Operative (Solal op)
    location: Mowebe
    status: active
    first_appearance: Session 9
    description: |
      JF agent who had been working the Solal kidnapping operation on Mowebe before
      the party arrived. Provided timetables and satellite recon.
    notes: |
      Recruited Okomi as an asset (guard at Solal's estate).

  - name: '"Iké"'
    affiliation: Jade Front
    role: Operative (Solal op)
    location: Mowebe
    status: active
    first_appearance: Session 9
    description: |
      JF agent who had been working the Solal kidnapping operation alongside Jake.
    notes: null

  - name: Okomi
    affiliation: Jade Front (asset)
    role: Estate Guard / Asset
    location: Mowebe (Solal estate)
    status: active
    first_appearance: Session 9
    description: |
      Local asset recruited by Jake and Iké. Works as a guard at Jassem Solal's estate.
    notes: null

  - name: Jassem Solal
    affiliation: Thani nobility
    role: Target (kidnapping victim)
    location: Unknown (in JF custody, delivered to Ugrik rendezvous)
    status: captured
    first_appearance: Session 9
    description: |
      Wealthy Thani noble, mid-sixties. Owner of a large private estate on Mowebe.
      Accompanied by three wives, multiple children, mistresses, and extensive household staff.
      Secretly the father of his own majordomo, Hassan (illegitimate son).
      Had a suspicious number of meetings with Cooper-Akachi Diversified Industries reps.
    notes: |
      Kidnapped and extracted by the party (Sessions 10–12). Delivered to Jade Front.
      Jewelry and personal effects pocketed by party (105k Cr).
      Nanos in Solal's system attempted to neutralize sleeping poison during extraction.

  - name: Hassan
    affiliation: Jassem Solal's household
    role: Majordomo / Chief of Staff
    location: Mowebe (Solal estate)
    status: active
    first_appearance: Session 10
    description: |
      Solal's majordomo and chief of staff. Runs the estate with considerable authority.
      Secretly Jassem Solal's illegitimate son - Solal writes him tender personal letters
      and cares deeply for him, though this appears to be a closely kept secret.
    notes: |
      Corinne Page found the letters from Solal to Hassan during a break-in (Session 10).

  - name: Faisal al-Amin
    affiliation: Jade Front
    role: Intelligence Operative ("Agent #3")
    location: Traveling (arrives back Campaign Week 16)
    status: active
    first_appearance: Session 12
    description: |
      Thani drunkard. White-collar thief and embezzler. Cover identity: helionite-processing
      equipment salesman. Prone to violence - rumors he killed a former domestic partner.
      Has connections to Thani intelligence.
    notes: |
      Was the "JF intelligence operative" dispatched at the end of Session 4 on the
      Ith → Mowebe → Thane → Mowebe circuit. Designated "Agent #3" by JF.
      Debriefed party at lunar JF depot (Session 12). Returns Campaign Week 16.
      Key intel from debrief: see Investigation > Key Intel - "Coop-Ak commandos through
      Thane (Wk 10)" and "Quiru-Newhall border skirmish at Maitz (Wk 12)".

  - name: '"Alicia"'
    affiliation: Jade Front
    role: Operative (burned handler for Vondel)
    location: O'Neill cylinder two days from Stoyben
    status: active (burned)
    first_appearance: Session 7
    description: |
      JF agent who spent months grooming Administrator Torin's wife Vondel.
      Convinced Vondel to leave her abusive husband and download his work
      computer's hard drive as payment for protection. Now burned as Vondel's handler.
    notes: |
      Vondel got cold feet during exfiltration. Suspicious behavioral shift:
      months of being scared/anxious, then suddenly confident and determined
      when she backed out. Vondel does not know about "Alicia's" JF connection.

  # ===========================================================================
  # O'NEILL CYLINDER TARGETS (SESSION 7)
  # ===========================================================================

  - name: Torin
    affiliation: Government (O'Neill cylinder Civic Administrator)
    role: Civic Administrator
    location: O'Neill cylinder two days from Stoyben
    status: deceased
    first_appearance: Session 7
    description: |
      Civic Administrator governing an O'Neill cylinder colony two days from Stoyben.
      Similar to a governor of a large metro city. Distant and abusive to wife Vondel.
      Openly sleeping with Kenna. Secretly sleeping with Arvi, Vondel's sister.
    notes: |
      Has a personal brewing operation at his residence. Invited Baron Harrow
      to visit after being impressed by his noble status.
      JF wanted the hard drive from his work computer (never obtained).
      DECEASED: Murdered by Arvi in Session 8 to help Vondel escape the abuse.
      Murder caused a major political uproar on the cylinder.

  - name: Vondel
    affiliation: None (Civic Administrator Torin's wife)
    role: Torin's wife (widowed)
    location: Unknown (fled Stoyben system)
    status: exfiltrated
    first_appearance: Session 7
    description: |
      Wife of Civic Administrator Torin. Abused for years. Stopped acting afraid
      and pulled out from the JF plan to flee - behavioral shift explained by Arvi's
      own plan taking shape.
    notes: |
      Was groomed by JF agent "Alicia" to leave Torin and download his work
      computer hard drive. Initially agreed but got cold feet during exfiltration.
      Session 8: Arvi murdered Torin to free Vondel. Vondel urgently requested
      the party bundle her and flee on the ship. Forced to flee the entire Stoyben
      system due to the political fallout. Isaiah Reed paid more than expected for
      the exfiltration as a result.
      Hard drive from Torin's work computer: never obtained.

  - name: Tevetz
    affiliation: Wealthy business family
    role: Vondel's ally (confirmed)
    location: O'Neill cylinder two days from Stoyben
    status: active
    first_appearance: Session 7
    description: |
      Hot young scion of a wealthy business family. Was familiar with Vondel
      (Torin's wife). Appeared openly with her at a high-end fundraising banquet.
    notes: |
      Session 8: Confirmed to have been helping Vondel in genuine good faith.
      Was NOT working a family agenda as previously suspected. The behavioral
      shift in Vondel was explained by her own (and Arvi's) plan taking shape.

  - name: Arvi
    affiliation: None (Vondel's sister)
    role: Torin's former secret mistress; Vondel's protector
    location: Voice of Liberation II
    status: active (passenger)
    first_appearance: Session 7
    description: |
      Vondel's sister. Was secretly sleeping with Torin. Maintained a monthly
      rate at a local hotel where she met Torin.
    notes: |
      Finnegan planted audio/video recording devices in her hotel room.
      Devices captured Torin and Arvi together - blackmail material secured.
      Session 8: Arvi murdered Torin to help Vondel escape his abuse, then
      urgently requested the party bundle Vondel and flee with them. Boarded
      Voice of Liberation II during the exfiltration and remains aboard.

  - name: Kenna
    affiliation: None
    role: Torin's open mistress
    location: O'Neill cylinder two days from Stoyben
    status: active
    first_appearance: Session 7
    description: |
      Torin is openly sleeping with her.
    notes: null

  - name: Antonio Jose Cuevas
    affiliation: Jade Front (informant)
    role: Marketing Account Manager
    location: Stoyben Interstellar News Dispatch
    status: active
    first_appearance: Session 5
    description: |
      JF informant at the Dispatch. Has many contacts but proved unhelpful
      when shaken down by the party.
    notes: |
      A real, entitled asshole.

  # ===========================================================================
  # STOYBEN INTERSTELLAR NEWS DISPATCH
  # ===========================================================================

  - name: Tetzel
    affiliation: Station media
    role: Editor, Page 6 gossip rag
    location: O'Neill cylinder two days from Stoyben
    status: allied
    first_appearance: Session 7
    description: |
      Editor of the station's Page 6 gossip rag on an O'Neill cylinder.
      Contact arranged by Doné Rivis.
    notes: |
      Finnegan approached under guise of wanting a job investigating high society.
      Tetzel wants photos of Torin with a mistress.

  - name: Choophong Thanatkha
    aliases: ["Choo"]
    affiliation: Stoyben Interstellar News Dispatch
    role: Investigative Journalist
    location: Last known working on Mora
    status: missing (3+ months)
    first_appearance: Session 2 (mentioned)
    description: |
      Stoybeni investigative journalist who broke the story about the Ithian
      death mask being stolen from Keith Sevont's estate before repatriation.
      Always punctual - the prolonged silence is very out of character.
    notes: |
      Editor Doné Rivis is worried about Choo's 3-month disappearance.
      Party attempted to find traces of Choo's filed story in Dispatch systems.
      Session 6: Assistant Pardeep Sarsar also missing. Uses Sarsar as courier
      for filing stories. Rivis knows nothing about story content or mask connection.

  - name: Doné Rivis
    affiliation: Stoyben Interstellar News Dispatch
    role: Managing Editor of Investigative Reporting
    location: Stoyben
    status: allied (tentative)
    first_appearance: Session 5
    description: |
      Managing editor of investigative reporting at the Stoyben Interstellar
      News Dispatch. Slightly overweight, middle-aged family man (three children)
      who is secretly in a long-term, committed same-sex relationship.
      Choo's editor.
    notes: |
      Session 5: Victor's hypnosis confirmed blackmail material (the relationship).
      Party has blackmail material but declined to use it (for now).
      Worried that Choo hasn't surfaced in three months.
      Session 6: Party returned, apologized, shared investigation details
      (excluding JF connection). Amends made, slight levels of trust achieved.
      Revealed Pardeep Sarsar as Choo's trusted assistant/courier. Explained
      common document-intake process at the Dispatch. Checked in with Sarsar's
      family at party's request - no sign or recent communication.
      Offered two jobs:
        1. 40k/80k - deliver encrypted message to undercover reporter Kara Wiley on Thane
        2. 10k/25k - check on Choo's wellbeing on Mora

  - name: Kara Wiley
    affiliation: Stoyben Interstellar News Dispatch (undercover)
    role: Undercover Reporter
    location: Thane (embedded in a political family)
    status: active
    first_appearance: Session 6 (mentioned by Rivis)
    description: |
      Undercover reporter for the Dispatch, embedded in a political family on Thane.
      Rivis needs an encrypted message delivered to her.
    notes: |
      Party offered 40k up front, 80k on completion to make the delivery.

  - name: Pardeep Sarsar
    affiliation: Stoyben Interstellar News Dispatch
    role: Choo's trusted assistant and courier for filing stories
    location: Unknown
    status: missing
    first_appearance: Session 6
    description: |
      Choophong Thanatkha's trusted assistant and frequent courier for
      filing stories. Identified by Doné Rivis.
    notes: |
      Family reports no sign of Sarsar and no recent communication.
      Nobody at Stoyben spaceport has seen him either.
      Disappearance may be connected to Choo's disappearance.

  - name: Kelly Fitzpatrick
    affiliation: Stoyben Interstellar News Dispatch
    role: Shift Supervisor (Production/Press)
    location: Stoyben
    status: deceased (recent)
    first_appearance: Session 5
    description: |
      Recently deceased shift supervisor in the paper's production department.
    notes: |
      Soft ruled out as a lead by the party.

  # ===========================================================================
  # ITHIAN GOVERNMENT / INTELLIGENCE
  # ===========================================================================

  - name: Dylan Connell
    affiliation: Ithian Intelligence
    role: Intelligence Agent
    location: Ith L3 research station
    status: deceased
    first_appearance: Session 4
    description: |
      Ithian intelligence agent and "true believer" who was surveilling
      Jade Front operations at the L3 station.
    notes: |
      Assassinated by party along with two deputies via bomb.
      False report implicated Les Wrownand/Bravida in the attack.

  - name: Angus Graham
    affiliation: Ithian Customs (corrupt)
    role: Licensed Customs Inspector
    location: I'ith
    status: active
    first_appearance: Session 3
    description: |
      Corrupt customs inspector who can be bribed to falsify documentation.
      Was previously paid off by the Iron Commerce 18 crew.
    notes: |
      Bribed by party (2,500 cr) to falsify destination as Stoyben and
      cargo as light construction vehicles.

  # ===========================================================================
  # CRIMINAL / BRAVIDA
  # ===========================================================================

  - name: Les Wrownand
    affiliation: Bravida (Kath affiliate)
    role: Local Criminal Contact
    location: Kath / Ith L3 area
    status: active (framed)
    first_appearance: Session 4
    description: |
      Local Bravida affiliate from Kath used as scapegoat in the
      Dylan Connell assassination.
    notes: |
      Victor filed false report implicating Wrownand in a plan to
      "move on the station."

  # ===========================================================================
  # HISTORICAL / DECEASED
  # ===========================================================================

  - name: "Vincentio Saviolo"
    affiliation: Party (PC)
    role: Noble Operative / Swordsman
    location: Mowebe (KIA)
    status: deceased
    first_appearance: Session 1
    description: |
      Noble career veteran (5 terms, rank 3). Outstanding swordsman (Blades-4).
      Party member throughout the campaign.
    notes: |
      KILLED Session 11: During the Solal extraction at Nbangu Dikila Nature Preserve,
      Mowebe. A power-armor bodyguard with a jetpack smashed Vicentio from the air.
      Vicentio's monomolecular unikatana broke open the guard's helmet. Vicentio charged
      with broken ribs; the guard panic-fired all anti-personnel cluster rockets at point
      blank range, killing both men instantly.

  - name: Keith Sevont
    affiliation: None (soldier, retired)
    role: Former Mask Owner
    location: Newhall (deceased)
    status: deceased (historical)
    first_appearance: Session 2 (mentioned)
    description: |
      "Nobody soldier from Newhall" whose collection contained the Ithian
      death mask. After his death, descendants attempted repatriation to Ith
      but the mask disappeared again.
    notes: |
      Acquired mask ~71 years ago at end of 2nd Agretic War.

  # ===========================================================================
  # MAITZ BATTLE - PERSONS OF INTEREST
  # ===========================================================================

  - name: Bunny
    aliases: []
    affiliation: Unknown (carried aboard the Newhall scout Deepest Light)
    role: Mission objective - high-value person
    location: Unknown (presumed Quiru custody as of the Maitz engagement)
    status: captured (by Quiru)
    first_appearance: Session 14
    description: |
      A person - not a ship or cargo - extracted from the Newhall scout
      Deepest Light by Quiru space marines off the Savage Intent during
      the Maitz engagement. Appeared human in the sensor record reviewed
      via Victor's hindsight. "Bunny" is consistently in scare-quotes in
      the Newhall logs - almost certainly a codename, not a real name.
    notes: |
      Newhall and Quiru (publicly allies) fought a fleet-scale engagement
      over Bunny at Maitz. Newhall ordered first capture, then destroy,
      then full retreat once Bunny was extracted ("taken and lost"). The
      Star of Carella's Session 13 Priority 1 capture-or-destroy orders
      against the Deepest Light are now understood as part of the same
      operation: Bunny was the Deepest Light's payload. True identity,
      origin, and reason for the manhunt remain unknown.

