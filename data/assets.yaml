# RECOVERED INTELLIGENCE / DATA
# =============================================================================
recovered_data:
  - source: "Star of Carella (Newhall) — Session 13"
    items:
      - description: "Decrypted orders: Tivid → Maitz, Priority 1, capture or destroy Newhall scout Deepest Light"
        status: decoded
        notes: "Unsigned. Higher-grade encryption used. Suggests command-level traffic with deniability."
      - description: "Thousands of short, encrypted files spanning 8 hours from Star of Carella's Maitz arrival"
        status: pending
        notes: "Suspected to be battle logs and/or comms traffic. Higher-grade encryption."
      - description: "Captain's stateroom search — only anomaly was a missing book from a bookshelf"
        status: open
        notes: "Physical paper books are unusual. Missing one may be hidden, smuggled, or a hollowed cache."

