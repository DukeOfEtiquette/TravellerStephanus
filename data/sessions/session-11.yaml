session:
  number: 11
  date: 2026-04-03
  recap: |
    The hunting party was poisoned and quickly became incapacitated. Vicentio and Petra provided
    overwatch from two anchored yachts, while van Leeuwen and Bobby dispatched guards on the
    perimeter.

    Nanos in Solal and his bodyguards quickly began to neutralize the poison. Vicentio secured
    his yacht, then crashed it into the shore, while Petra secured hers and took up overwatch.
    Bobby and van Leeuwen were injured in a firefight but dispatched the four bodyguards.

    Then a bodyguard in power armor and a jetpack intervened. He smashed into Vicentio from the
    air, but Vicentio's monomolecular unikatana broke open his helmet. When Vicentio charged him,
    broken ribs and all, the guard panic-fired all his anti-personnel cluster rockets at point
    blank range — killing both men instantly.

    Vincentio Saviolo is dead.

    Samir finally arrived with one of the shuttles. As the wounded survivors fled with Solal,
    Samir announced that two radar clicks were closing fast…

    Day: 14.6
    Kitty: 73,750 Cr

