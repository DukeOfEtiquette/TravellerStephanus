# Shared Party Assets - Traveller Stephanus Campaign
# Tracks ships, party funds, shared equipment, and cargo

# =============================================================================
# PARTY FUNDS
# =============================================================================
party_kitty:
  balance: 93850  # Cr, as of Session 15
  last_updated: "Session 15"
  notes: |
    Started with 150,000 Cr from Kyle Newhouse (encrypted Ithian credit chips).
    Spent 200 Cr on expenses during Session 2.
    Spent 2,500 Cr bribing Customs Inspector Angus Graham during Session 3.
    Session 4: Kitty at 124,600 Cr after L3 operations.
    Session 5: Ship refit (fuel tanks), Dispatch investigation costs. Kitty at 21,100 Cr.
    Session 6: Kitty at 21,000 Cr. Weapons traded to Isaiah Reed for refined fuel.
    Session 7: Kitty at 26,200 Cr. Ship retrofit (jump fuel pods) completed.
    Session 8: Cylinder op concluded. Isaiah Reed cut pay (Vondel forced to flee entire system).
    Session 9: Electronics + chemicals sold at Mowebe manufactories (breaking even). Kitty 97,010 Cr.
    Session 10: Op expenses (sleeping drugs, infiltration costs). Kitty 73,750 Cr.
    Session 12: Kikonye reward +45,000 Cr. Solal jewelry/personal effects +105,000 Cr.
               Missile resupply and other expenses deducted. Kitty 109,950 Cr.
    Session 13: Pre-jump kit-out and resupply at Mowebe before jump to Maitz.
               Kitty 93,850 Cr (-16,100 Cr).
    Session 14: No expenditures or income. Balance unchanged at 93,850 Cr.
    Session 15: No expenditures or income. Balance unchanged at 93,850 Cr.

