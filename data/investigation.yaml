  - name: "Antonio Jose Cuevas"
    ruled_out: Session 5
    description: "JF informant, Marketing Account Manager at Dispatch"
    reason: "Has contacts but proved unhelpful when questioned. Entitled asshole."

  - name: "Doné Rivis (direct knowledge)"
    ruled_out: Session 5
    description: "Editor for Investigative Journalism at Dispatch"
    reason: |
      Victor's hypnosis confirmed he has no knowledge of the mask or Choo's story.
      Genuinely worried about Choo's disappearance.
    notes: |
      NOT fully ruled out as asset-party has unused blackmail material on him.
      Could be leveraged for access/favors if needed.

  - name: "Dispatch Mainframe (hack approach)"
    ruled_out: Session 5
    description: "Attempt to search for traces of Choo's filed/suppressed story"
    reason: |
      Baron Harrow failed both hack attempts. Firewall AI attempted reverse trace.
      Machine destroyed to prevent identification.

# =============================================================================
# OPEN QUESTIONS
# =============================================================================
open_questions:

  - question: "Who currently has the mask?"
    priority: critical
    notes: "Core mystery. No definitive intelligence yet."

  - question: "Where are Choophong Thanatkha and Pardeep Sarsar?"
    priority: high
    notes: |
      Both missing. Choo: 3+ months, last known on Mora. Sarsar: Choo's trusted
      lieutenant/courier, family has no sign or recent communication. Two connected
      disappearances suggest foul play rather than coincidence.

  - question: "Did Choo file a story that was suppressed?"
    priority: high
    notes: "If so, by whom? Hack attempt to find traces failed."

  - question: "Where is the Iron Commerce 18 headed?"
    priority: medium
    notes: "Graham said 'home'-al-Thani space? Specific destination unknown."

  - question: "What is the al-Thani interest in the mask?"
    priority: medium
    notes: "At least 2 confirmed al-Thani crew on IC18. Cultural? Political? Hired?"

  - question: "What is the connection between Cooper-Akachi and al-Thani?"
    priority: medium
    notes: "Both seem to be moving toward Mora. Coordinated? Competing?"

  - question: "What is IIP's interest in the party/mask?"
    priority: low
    notes: "IIP associates approached party discreetly (Session 2). No follow-up yet."

  - question: "Why did Vondel's behavior shift when she backed out of the exfiltration?"
    priority: low
    notes: |
      RESOLVED (Session 8): She and Arvi had their own plan forming - Arvi murdered Torin
      to free Vondel. Tevetz was genuinely helping her, not scheming. Behavioral shift was
      because she knew action was imminent.

  - question: "What intel did Faisal al-Amin bring back from Thane?"
    priority: high
    notes: |
      JF operative completed Ith→Mowebe→Thane→Mowebe circuit. Debriefed party at lunar
      JF depot (Session 12). Content of his intelligence not yet detailed in notes.

  - question: "What happened at Maitz? (Quiru-Newhall border skirmish)"
    priority: high
    notes: |
      Faisal al-Amin confirmed: Quiru and Newhall clashed in outer Maitz at Campaign Week 12.
      Ship loss data recorded in key_intel. Why are Quiru and Newhall fighting? What does this
      mean for the regional political situation? Party arrived Session 13 - surveying wrecks.

  - question: "Who within Newhall issued the Priority 1 order to take down the Deepest Light?"
    priority: high
    notes: |
      Orders were unsigned but Priority 1 - high-level command traffic, security buffered
      by deniability. Tivid appears to be the dispatching authority's location.

  - question: "What is the Deepest Light carrying - or who is aboard?"
    priority: high
    notes: |
      RESOLVED (Session 14): A person, codename Bunny. Extracted from the Deepest
      Light by Quiru marines off the Savage Intent. See key_intel:bunny-is-a-person
      and the "Recover Bunny" active lead.

  - question: "Is Cooper-Akachi involved at Maitz?"
    priority: medium
    notes: |
      RESOLVED (Session 14): Yes. High-end Cooper-Akachi parts were used in the
      Savage Intent's jump-drive bomb (disarmed by Samir). Direct material evidence.
      See key_intel:coop-ak-parts-on-bomb and the "Cooper-Akachi Involvement at
      Maitz" active lead.

  - question: "Who or what is Bunny? Why so valuable?"
    priority: critical
    notes: |
      Bunny is a person (Session 14 hindsight confirmed). True identity, origin,
      and reason for value are unknown. Both Newhall and Quiru went to a fleet
      engagement over them. "Bunny" appears to be a codename.

  - question: "Where did Quiru take Bunny - and the Deepest Light - after Maitz?"
    priority: critical
    notes: |
      Quiru extracted Bunny from the Deepest Light during the battle, then both
      Bunny and the Deepest Light left Maitz before the party's arrival. Current
      location unknown.

  - question: "Why are Newhall and Quiru fighting in secret?"
    priority: high
    notes: |
      They are publicly allied yet fought a fleet-scale engagement over Bunny at a
      sparse, low-witness system, and both sides appear to want it kept quiet.
      The rift's nature may be the regional storyline.

  - question: "Who placed the Cooper-Akachi bomb in the Savage Intent's jump drive?"
    priority: high
    notes: |
      Savage Intent's crew evacuated in good order - bomb could be internal
      Quiru-side sabotage, OR third-party cleanup after the evacuation. Either
      reading carries large implications.

  - question: "Why was the Savage Intent's computer destroyed but the black box left intact?"
    priority: medium
    notes: |
      Surgical destruction of the main computer while the black box remained
      readable. Could be hasty sabotage, an oversight, or a deliberate choice
      to leave a specific narrative behind.

  - question: "Who on Maitz received the Cooper-Akachi buoy's directional radio burst?"
    priority: high
    notes: |
      Directional burst toward planet Maitz containing VoL II's transponder
      code and physical description. Most likely recipient: a Cooper-Akachi
      contact/station on Maitz. Identifying them would tell us how soon the
      party's ship signature spreads, and where it spreads first.

  - question: "What was in the Revenant's Echo captain's-quarters safe?"
    priority: medium
    notes: |
      Victor was actively cracking the safe when the squid attack interrupted
      him. The safe was abandoned during the retreat; contents unknown. The
      Revenant's Echo's status as the Newhall flagship at Maitz makes its
      captain's personal safe a high-curiosity item.

  - question: "What are the vacuum-adapted squids? Where did they come from?"
    priority: low
    notes: |
      Encountered at the Revenant's Echo power core. Attracted to heat;
      capable of breaching helmet glass. Unknown origin - native to wreckage
      ecologies? Engineered? Predators that arrived after the battle?

  - question: "What was the missing book from Star of Carella's captain's bookshelf?"
    priority: low
    notes: |
      Only anomaly in the captain's stateroom search. Could indicate hidden message,
      smuggled item, or hollowed cache. Title unknown without more info.

  - question: "What is the Cooper-Akachi connection to Jassem Solal?"
    priority: medium
    notes: |
      Solal had a suspicious number of meetings with Cooper-Akachi Diversified Industries
      reps (discovered via estate server hack, Session 10). Cooper-Akachi already known
      to be pursuing the death mask. The Solal connection may be significant.

  - question: "Will the L3 bombing be traced back to the party?"
    priority: low
    notes: "Les Wrownand/Bravida framed. Sint propaganda approach successful."

# =============================================================================
# KEY INTELLIGENCE
#
# Each entry has a stable `id` so that other entries (lead notes, session
# recaps, NPC notes) can reference the specific intel by name. `category`
# groups related facts on the Investigation page render.
# =============================================================================
key_intel:

  # --- The Mask ---------------------------------------------------------------
  - id: factions-racing
    category: The Mask
    fact: "Multiple factions are racing to recover the mask"
    factions: ["Jade Front", "Cooper-Akachi", "al-Thani (suspected)", "IIP (interest unclear)"]
    source: Various (Sessions 2-5)

  - id: mask-value-to-ith
    category: The Mask
    fact: "The mask has significant cultural/political value to Ith"
    details: "Recovery would provide JF propaganda coup, potentially secure Ith alliance against Quiru-Newhall"
    source: Kyle Newhouse (Session 2)

  # --- Choo Investigation -----------------------------------------------------
  - id: choo-missing
    category: Choo Investigation
    fact: "Choo broke the story but has been missing 3+ months"
    details: "Last known on Mora. Even their editor doesn't know their status."
    source: Doné Rivis (Session 5)

  - id: choo-punctual
    category: Choo Investigation
    fact: "Choo is always punctual - prolonged silence is very out of character"
    details: "Makes the disappearance more alarming; not someone who would go silent voluntarily."
    source: Doné Rivis (Session 6)

  - id: sarsar-missing
    category: Choo Investigation
    fact: "Pardeep Sarsar (Choo's assistant/courier for filing stories) is also missing"
    details: "Family has no sign or recent communication. Nobody at Stoyben spaceport has seen him. Two disappearances linked to same story."
    source: Doné Rivis (Session 6)

  # --- al-Thani Movements -----------------------------------------------------
  - id: ic18-thani-crew
    category: al-Thani Movements
    fact: "Iron Commerce 18 crew confirmed al-Thani"
    details: "Psychic viewing confirmed at least 2 crew. Typical Thane garb: all black, faces covered."
    source: Party investigation (Session 3)

  # --- Cooper-Akachi Movements ------------------------------------------------
  - id: coop-ak-mora-operatives
    category: Cooper-Akachi Movements
    fact: "Cooper-Akachi has elite operatives en route to Mora"
    details: "Street-level rumor confirmed by Petra"
    source: Petra (Session 3)

  - id: coop-ak-thane-wk10
    category: Cooper-Akachi Movements
    fact: "Seven Coop-Ak commandos passed through Thane at Campaign Week 10 aboard the Star Home"
    details: |
      Traveled incognito on an old 400dt freighter called the Star Home, stopping to resupply
      at Thane. Met Ta-ka-ti diplomatic staff on the grounds of Morqash University for 10+ hours.
      Then visited the Coop-Ak orbital corporate station before departing. Filed flight plan for
      Newhall but departed from the anti-spinward (left) jump point - destination mismatch is suspicious.
    source: Faisal al-Amin debrief (Session 12)

  # --- Maitz Battle -----------------------------------------------------------
  - id: maitz-skirmish-wk12
    category: Maitz Battle
    fact: "Quiru-Newhall border skirmish in outer Maitz at Campaign Week 12"
    details: |
      Ship counts - QUIRU: Big 1, Medium 3 (2 disabled), Small 1 (1 disabled).
      NEWHALL: Big 2 (1 disabled), Medium 1, Small 6 (2 disabled).
      Format: deployed (disabled). Newhall outnumbered in big ships but deployed far more smalls.
    source: Faisal al-Amin debrief (Session 12)

  - id: maitz-wrecks
    category: Maitz Battle
    fact: "Six wrecks at Maitz around the sole gas giant"
    details: |
      Named hulls: Revenant's Echo (largest), Star of Carella (Newhall),
      Adamant, Savage Intent, Deepest Light (Newhall, 100 dT scout).
      Two of the six wrecks are debris fields too disintegrated to identify.
    source: Party survey (Session 13)

  - id: newhall-hunting-own
    category: Maitz Battle
    fact: "Newhall was hunting one of its own ships at Maitz"
    details: |
      Star of Carella (Newhall) was dispatched from Tivid to Maitz ASAP under
      unsigned Priority 1 orders to capture or destroy the Deepest Light, a
      Newhall 100 dT scout ship. Internal Newhall hunt - likely a defector,
      whistleblower, or thief carrying valuable cargo or intelligence.
    source: Decrypted Star of Carella orders (Session 13)

  - id: tivid-newhall-base
    category: Maitz Battle
    fact: "Star of Carella was based in Tivid"
    details: |
      Tivid appears to be a Newhall command/staging location. Star of Carella
      was redirected from Tivid to Maitz ASAP "to support operations."
    source: Decrypted Star of Carella data slabs (Session 13)

  - id: star-carella-encrypted-traffic
    category: Maitz Battle
    fact: "Star of Carella storage crystals contain 8 hours of dense encrypted traffic"
    details: |
      Thousands of short, encrypted files starting the minute Star of Carella
      arrived in Maitz and ending abruptly 8 hours later. Higher-grade
      encryption than typical ship traffic. Believed to be battle logs and/or
      command comms. Not yet decoded.
    source: Star of Carella loot (Session 13)

  - id: bunny-is-a-person
    category: Maitz Battle
    fact: "'Bunny' is a person - extracted by Quiru from the Deepest Light"
    details: |
      Confirmed by two of Victor's hindsight viewings aboard the Revenant's
      Echo. (1) Captain's chair at the moment of retreat - the order
      explicitly referenced the boarding party extracting Bunny from the ship.
      (2) Sensor officer's station - visual record of Quiru marines extracting
      a human-appearing figure from a 100 dT scout (Deepest Light), with the
      Savage Intent in the background. Newhall and Quiru fought the entire
      engagement over Bunny.
    source: Victor's hindsight aboard the Revenant's Echo (Session 14)

  - id: savage-intent-quiru-400t
    category: Maitz Battle
    fact: "Savage Intent is a Quiru 400-ton marine vessel that extracted Bunny"
    details: |
      Mostly intact; uninhabited; orderly evacuation by a mostly-marine crew.
      Black box decoded: laid in wait behind a moon, then took an intercept
      and station-matching course onto a target on a gas-skim trajectory.
      That intercept was the Bunny extraction operation against the Deepest
      Light.
    source: Party boarding action and decoded black box (Session 14)

  - id: savage-intent-sabotage-pattern
    category: Maitz Battle
    fact: "Savage Intent was deliberately sabotaged post-evacuation"
    details: |
      Three distinct sabotage measures: bridge-door grenade booby trap (Corinne
      injured), ship's computer destroyed by an anti-personnel-grade explosive,
      jump drive expertly wired with a bomb built from high-end Cooper-Akachi
      parts (disarmed by Samir). Crew evacuation was orderly but the ship was
      left thoroughly poisoned. Surgical, professional, deniability-focused.
    source: Party investigation aboard the Savage Intent (Session 14)

  - id: coop-ak-parts-on-bomb
    category: Cooper-Akachi Movements
    fact: "High-end Cooper-Akachi parts used in the Savage Intent jump-drive bomb"
    details: |
      Direct material evidence of Cooper-Akachi presence at or after the Maitz
      engagement. Reinforces the Coop-Ak Wk 10 Thane transit
      (`coop-ak-thane-wk10`). Whether Coop-Ak placed the bomb themselves or
      sold the parts to a third party is unclear.
    source: Samir's disarm and parts inspection (Session 14)

  - id: revenant-echo-battle-roster
    category: Maitz Battle
    fact: "Full Newhall-side battle roster recovered from Revenant's Echo captain's logs"
    details: |
      Captain's combat logs partially spliced. The recovery contains the names
      of all other Newhall ships in the engagement. The Deepest Light is
      conspicuously never named in the logs. Multiple references to "Bunny."
    source: Captain's log splice on the Revenant's Echo (Session 14)

  - id: newhall-quiru-secret-fight-at-maitz
    category: Maitz Battle
    fact: "Newhall and Quiru (publicly allies) fought a covert fleet engagement over Bunny"
    details: |
      The Maitz engagement is no border skirmish: it was a fleet-scale fight
      between supposed allies over one person, in a sparse low-witness system,
      and both sides appear to want it kept quiet. Implies a covert rift in
      the Newhall–Quiru alliance.
    source: Synthesis of Revenant's Echo logs, hindsight, and Star of Carella orders (Session 14)

  - id: deepest-light-left-maitz
    category: Maitz Battle
    fact: "Deepest Light was not at Maitz on the party's arrival"
    details: |
      The S13 working assumption that one of the surveyed wrecks was the
      Deepest Light was wrong. The party has only ever "seen" the Deepest
      Light via Victor's hindsight on the Revenant's Echo. Presumed extracted
      from the battlefield by Quiru along with Bunny.
    source: Party reassessment after Session 14 hindsight (Session 14)

  - id: revenant-echo-records-quiru-ambush
    category: Maitz Battle
    fact: "Quiru AMBUSHED Newhall at Maitz (not a covert mutual fight)"
    details: |
      Partial fleet-coordination records pulled from the Revenant's Echo
      captain's chair confirm Newhall came to Maitz pursuing Bunny and was
      ambushed by Quiru - putative allies acting against Newhall. Reframes
      the engagement as a one-sided ambush rather than a co-equal covert
      fight between allies.
    source: Revenant's Echo captain's-chair records (Session 15)

  - id: coop-ak-buoy-found
    category: Cooper-Akachi Movements
    fact: "Cooper-Akachi-branded surveillance buoy intercepted at Maitz"
    details: |
      Small craft, smooth outer hull, subtle Coop-Ak branding, uninhabited.
      Spotted launching from behind the Revenant's Echo for planet Maitz.
      Pursued, disassembled, hard drives recovered and decoded.
    source: Party investigation (Session 15)

  - id: coop-ak-buoy-timeline
    category: Cooper-Akachi Movements
    fact: "Cooper-Akachi was surveilling the Maitz battlefield from Wk 18 onward"
    details: |
      Decoded buoy log: deployed Wk 18 by a Cooper-Akachi ship. Wk 22 a
      Newhall ship arrived, inspected the field for ~12 hours, and left.
      Buoy also detected and monitored the party's arrival in Session 13–14
      until they intercepted it in Session 15.
    source: Decoded buoy hard drives (Session 15)

  - id: party-ship-signature-leaked
    category: Cooper-Akachi Movements
    fact: "Party's ship signature broadcast toward planet Maitz"
    details: |
      Just before exhausting fuel, the Cooper-Akachi buoy emitted a
      directional radio burst toward planet Maitz transmitting VoL II's
      transponder code and physical description. An unknown party on
      Maitz (most likely Cooper-Akachi) now has the party's ship
      signature. Recovery is impossible - the broadcast has already
      occurred - so the operational response is to swap ships (council
      decision: sell Savage Intent at Stoyben to fund a faster
      replacement).
    source: Decoded buoy hard drives (Session 15)

  - id: revenant-echo-squids
    category: Maitz Battle
    fact: "Revenant's Echo's power core harbors vacuum-adapted squid-like organisms"
    details: |
      Encountered en route to the power core for a restart attempt.
      Attracted to heat (Corinne's hunch, confirmed when van Leeuwen killed
      one by smashing it into a plasma-liquified bulkhead). Capable of
      latching onto shuttles and breaching helmet glass. Origin and species
      unknown.
    source: Party encounter aboard the Revenant's Echo (Session 15)

  - id: savage-intent-operable
    category: Maitz Battle
    fact: "Savage Intent confirmed operable with a skeleton crew"
    details: |
      Operability check during Session 15 confirmed the party can run the
      Savage Intent with a skeleton crew and jump it out of the system.
      Council decision (S15): move it to Stoyben for sale (Jade Front
      right of first refusal). Replaces S14's "potential prize" framing.
    source: Party operability check (Session 15)

