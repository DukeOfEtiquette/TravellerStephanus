  summary: |
    Arrived in Maitz and began surveying the post-battle wrecks around the gas giant.
    Stripped Star of Carella (Newhall) of data, fuel, two shuttlecraft, and 16 tons of Rx;
    decoded its capture-or-destroy orders against the Newhall scout Deepest Light.
    Revenant's Echo is the next intended target. Encrypted battle logs / comms still
    pending decryption. Rivis Thane job (Kara Wiley message delivery) remains deferred.

  timeline:
    - day: 6.3
      status: past
      location: Stoyben Spaceport
      notes: "Weapons traded to Reed. Rivis trust gained. Two jobs offered. Passengers and trade goods aboard."

    - day: 8.2
      status: past
      location: O'Neill cylinder (Stoyben system)
      notes: |
        Cylinder operation concluded. Arvi murdered Torin; Vondel extracted.
        Isaiah Reed cut pay but issued letter of recommendation. Departed for Mowebe.

    - day: 13.2
