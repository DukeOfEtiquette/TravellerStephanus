<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traveller Stephanus — Campaign Viewer</title>
<script>
  // Apply saved palette before stylesheets evaluate, to avoid flash-of-default.
  try {
    var p = localStorage.getItem('ts-palette');
    if (p === 'phosphor' || p === 'starchart' || p === 'dossier') {
      document.documentElement.dataset.palette = p;
    }
  } catch (e) {}
</script>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* Phosphor — amber CRT on warm coal (default) */
  :root,
  html[data-palette="phosphor"] {
    --bg: #0c0a07;
    --bg-2: #15110b;
    --bg-3: #1d1810;
    --border: #322a1e;
    --border-2: #46392a;
    --text: #e8c896;
    --text-dim: #b3956a;
    --text-faint: #76624a;
    --accent: #ffb347;
    --accent-2: #ff7a1a;
    --accent-3: #f0d8a8;
    --good: #7ed957;
    --warn: #ffd86b;
    --bad: #ff7a7a;
    --orange: #ff9a4a;
    --accent-tint: rgba(255,179,71,0.16);
    --accent-tint-soft: rgba(255,179,71,0.06);
    --accent-2-tint: rgba(255,122,26,0.10);
    --accent-2-tint-soft: rgba(255,122,26,0.08);
    --code-bg: rgba(232,200,150,0.08);
    --row-stripe: rgba(232,200,150,0.03);
    --good-tint: rgba(126,217,87,0.18);
    --warn-tint: rgba(255,216,107,0.18);
    --bad-tint: rgba(255,122,122,0.18);
    --bad-bg: rgba(255,122,122,0.10);
    --bad-border: rgba(255,122,122,0.30);
    --error-pre-color: #ffb380;
    --starport-A: #7ed957;
    --starport-B: #7ec8ff;
    --starport-C: #ffd86b;
    --starport-D: #ff9a4a;
    --starport-X: #ff7a7a;
    --scrim: rgba(0,0,0,0.55);
  }

  /* Star Chart — cosmic black, atlas gold + signal cyan */
  html[data-palette="starchart"] {
    --bg: #07080d;
    --bg-2: #0e1118;
    --bg-3: #131722;
    --border: #20283a;
    --border-2: #2a334a;
    --text: #ece6d6;
    --text-dim: #a8a08c;
    --text-faint: #6b6552;
    --accent: #f0c262;
    --accent-2: #6fb8ff;
    --accent-3: #ece6d6;
    --good: #4fd6a0;
    --warn: #f0c262;
    --bad: #ff6b81;
    --orange: #f0c262;
    --accent-tint: rgba(240,194,98,0.16);
    --accent-tint-soft: rgba(240,194,98,0.06);
    --accent-2-tint: rgba(111,184,255,0.12);
    --accent-2-tint-soft: rgba(111,184,255,0.08);
    --code-bg: rgba(236,230,214,0.08);
    --row-stripe: rgba(236,230,214,0.03);
    --good-tint: rgba(79,214,160,0.16);
    --warn-tint: rgba(240,194,98,0.18);
    --bad-tint: rgba(255,107,129,0.18);
    --bad-bg: rgba(255,107,129,0.10);
    --bad-border: rgba(255,107,129,0.30);
    --error-pre-color: #ff9eaa;
    --starport-A: #4fd6a0;
    --starport-B: #6fb8ff;
    --starport-C: #f0c262;
    --starport-D: #ff9a4a;
    --starport-X: #ff6b81;
    --scrim: rgba(0,0,0,0.55);
  }

  /* Field Dossier — cream paper, oxblood ink, registry teal */
  html[data-palette="dossier"] {
    --bg: #efe6cf;
    --bg-2: #e6dab9;
    --bg-3: #ddcfa9;
    --border: #beae84;
    --border-2: #a89a72;
    --text: #2a241c;
    --text-dim: #5e5239;
    --text-faint: #8a7c5c;
    --accent: #8a2828;
    --accent-2: #1f4a5e;
    --accent-3: #3a2f24;
    --good: #4f7a35;
    --warn: #8c6512;
    --bad: #8a2828;
    --orange: #8c6512;
    --accent-tint: rgba(138,40,40,0.10);
    --accent-tint-soft: rgba(138,40,40,0.06);
    --accent-2-tint: rgba(31,74,94,0.10);
    --accent-2-tint-soft: rgba(31,74,94,0.08);
    --code-bg: rgba(42,36,28,0.06);
    --row-stripe: rgba(42,36,28,0.04);
    --good-tint: rgba(79,122,53,0.16);
    --warn-tint: rgba(140,101,18,0.16);
    --bad-tint: rgba(138,40,40,0.12);
    --bad-bg: rgba(138,40,40,0.08);
    --bad-border: rgba(138,40,40,0.35);
    --error-pre-color: #5e1818;
    --starport-A: #2d6e2d;
    --starport-B: #1f4a5e;
    --starport-C: #8c6512;
    --starport-D: #8a4e1e;
    --starport-X: #6e2b2b;
    --scrim: rgba(60,52,38,0.35);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    line-height: 1.5;
  }

  a { color: var(--accent); text-decoration: none; }
  a:hover { color: var(--accent); text-decoration: underline; }

  .layout {
    display: grid;
    grid-template-columns: 240px 1fr;
    min-height: 100vh;
  }

  /* Sidebar */
  aside.sidebar {
    background: var(--bg-3);
    border-right: 1px solid var(--border);
    padding: 16px 0;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }

  .brand {
    padding: 0 18px 14px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 12px;
  }
  .brand .home {
    display: block;
    text-decoration: none;
    color: inherit;
  }
  .brand .home:hover .title { filter: brightness(1.15); }
  .brand .title {
    color: var(--accent);
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  .brand .subtitle {
    color: var(--text-faint);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 4px;
  }

  /* Palette cycle button — three swatch dots, current one ringed */
  .palette-toggle {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    margin-top: 10px;
    padding: 5px 10px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 999px;
    cursor: pointer;
    line-height: 1;
    transition: background 120ms ease, border-color 120ms ease;
  }
  .palette-toggle:hover {
    background: var(--bg-2);
    border-color: var(--border-2);
  }
  .palette-toggle:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .palette-toggle .dot {
    display: inline-block;
    width: 9px; height: 9px;
    border-radius: 50%;
    opacity: 0.5;
    transition: opacity 120ms ease, transform 120ms ease, box-shadow 120ms ease;
  }
  .palette-toggle .dot[data-p="phosphor"]  { background: #ffb347; }
  .palette-toggle .dot[data-p="starchart"] { background: #6fb8ff; }
  .palette-toggle .dot[data-p="dossier"]   { background: #8a2828; }
  .palette-toggle[data-active="phosphor"]  .dot[data-p="phosphor"],
  .palette-toggle[data-active="starchart"] .dot[data-p="starchart"],
  .palette-toggle[data-active="dossier"]   .dot[data-p="dossier"] {
    opacity: 1;
    transform: scale(1.2);
    box-shadow: 0 0 0 1px var(--text);
  }

  nav .group {
    padding: 8px 18px 4px;
    color: var(--text-faint);
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  nav a {
    display: block;
    padding: 6px 18px;
    color: var(--text);
    font-size: 0.88rem;
    border-left: 3px solid transparent;
  }
  nav a:hover {
    background: var(--accent-tint-soft);
    color: var(--accent);
    text-decoration: none;
  }
  nav a.active {
    border-left-color: var(--accent-2);
    background: var(--accent-2-tint);
    color: var(--accent);
  }

  /* Main */
  main.content {
    padding: 28px 36px 60px;
    max-width: 1100px;
    /* Without this, a wide child (e.g. a price table) would push the grid
       track wider than the viewport and cause page-level horizontal scroll,
       defeating the .table-scroll wrappers. min-width:0 lets the grid track
       shrink so the scroll containers actually scroll. */
    min-width: 0;
  }

  .crumbs {
    color: var(--text-faint);
    font-size: 0.78rem;
    margin-bottom: 4px;
  }
  .crumbs a { color: var(--text-faint); }
  .crumbs a:hover { color: var(--accent); }

  h1.page-title {
    color: var(--accent);
    font-size: 1.5rem;
    margin-bottom: 18px;
    letter-spacing: 0.02em;
  }

  h2 {
    color: var(--accent);
    font-size: 1.15rem;
    margin: 22px 0 10px;
    letter-spacing: 0.02em;
  }

  h3 {
    color: var(--accent-3);
    font-size: 0.98rem;
    margin: 14px 0 6px;
    font-weight: 600;
  }

  p { margin-bottom: 8px; }

  ul, ol { padding-left: 22px; margin-bottom: 8px; }
  li { margin-bottom: 3px; }

  pre, code {
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    font-size: 0.85em;
  }
  pre {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px 12px;
    overflow-x: auto;
    white-space: pre-wrap;
  }
  code {
    background: var(--code-bg);
    padding: 1px 5px;
    border-radius: 3px;
  }
  pre code { background: none; padding: 0; }

  /* Cards */
  .card {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .card h3 { margin-top: 0; }

  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
  }

  /* Tags / chips */
  .tag {
    display: inline-block;
    background: var(--accent-tint);
    color: var(--accent);
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 0.72rem;
    margin: 2px 4px 2px 0;
    letter-spacing: 0.02em;
  }
  .tag.warn { background: var(--warn-tint); color: var(--warn); }
  .tag.bad  { background: var(--bad-tint);  color: var(--bad); }
  .tag.good { background: var(--good-tint); color: var(--good); }
  .tag.dim  { background: var(--code-bg);   color: var(--text-dim); }

  /* Tables */
  table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    margin: 8px 0 14px;
    font-size: 0.88rem;
    border: 1px solid var(--border);
    background: var(--bg-2);
    border-radius: 4px;
    overflow: hidden;
  }
  th, td {
    text-align: left;
    padding: 6px 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  tbody tr:last-child td { border-bottom: none; }
  th {
    color: var(--text-faint);
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
  }
  tbody tr:nth-child(even) td { background: var(--row-stripe); }
  tbody tr:hover td { background: var(--accent-2-tint-soft); }

  /* Wrapper added by setView so wide tables scroll horizontally on small screens
     instead of forcing the whole page to scroll. */
  .table-scroll {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    margin: 8px 0 14px;
    border-radius: 4px;
  }
  .table-scroll > table { margin: 0; }

  /* KV list */
  .kv {
    display: grid;
    grid-template-columns: max-content 1fr;
    column-gap: 16px;
    row-gap: 4px;
    font-size: 0.9rem;
    margin-bottom: 12px;
  }
  .kv dt { color: var(--text-faint); font-size: 0.78rem; padding-top: 1px; }
  .kv dd { color: var(--text); }

  /* Retirement (cash + material side-by-side) */
  .retirement-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 16px;
    align-items: start;
    margin-bottom: 14px;
  }
  .retirement-grid h3 { margin: 0 0 6px; }
  .retirement-grid table { margin: 0; }
  .retirement-grid td.roll { color: var(--text-faint); width: 1%; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .retirement-grid td.cash { font-variant-numeric: tabular-nums; }
  .retirement-grid td.cash .unit { color: var(--text-faint); margin-right: 4px; font-size: 0.78rem; }

  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 14px;
    align-items: center;
  }
  .filter-bar input[type="text"], .filter-bar select {
    background: var(--bg-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 10px;
    font-size: 0.85rem;
    min-width: 180px;
  }
  .filter-bar input:focus, .filter-bar select:focus {
    outline: none;
    border-color: var(--accent-2);
  }
  .filter-bar .count { color: var(--text-faint); font-size: 0.8rem; }

  .error {
    background: var(--bad-bg);
    border: 1px solid var(--bad-border);
    color: var(--bad);
    padding: 14px 16px;
    border-radius: 6px;
    font-size: 0.9rem;
  }
  .error pre { background: rgba(0,0,0,0.2); margin-top: 8px; color: var(--error-pre-color); }

  .loading { color: var(--text-faint); padding: 20px 0; font-size: 0.9rem; }

  .pill-row { margin: 4px 0 10px; }

  /* Starport color squares */
  .starport-A { color: var(--starport-A); }
  .starport-B { color: var(--starport-B); }
  .starport-C { color: var(--starport-C); }
  .starport-D { color: var(--starport-D); }
  .starport-X { color: var(--starport-X); }

  /* Prices tables — sized to content so columns stay tight */
  table.prices-table {
    width: auto;
    min-width: 0;
    max-width: 100%;
  }
  table.prices-table th,
  table.prices-table td {
    padding: 5px 14px;
    white-space: nowrap;
  }
  table.prices-table td:last-child,
  table.prices-table th:last-child { padding-right: 16px; }

  /* Collapsible sections */
  details.collapsible {
    margin: 22px 0 10px;
  }
  details.collapsible > summary {
    list-style: none;
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  details.collapsible > summary::-webkit-details-marker { display: none; }
  details.collapsible > summary::before {
    content: '▸';
    color: var(--accent);
    font-size: 0.85rem;
    transition: transform 0.15s ease;
    display: inline-block;
  }
  details.collapsible[open] > summary::before {
    transform: rotate(90deg);
  }
  details.collapsible > summary > h2 {
    display: inline;
    margin: 0;
  }
  details.collapsible > summary:hover > h2 {
    color: var(--accent);
  }

  .recap-block {
    background: var(--bg-3);
    border-left: 3px solid var(--accent-2);
    padding: 10px 14px;
    margin: 10px 0 14px;
    white-space: pre-wrap;
    font-size: 0.92rem;
  }

  /* Markdown content */
  .md h1 { color: var(--accent); font-size: 1.4rem; margin: 18px 0 10px; }
  .md h2 { color: var(--accent); font-size: 1.1rem; margin: 16px 0 8px; }
  .md h3 { color: var(--accent-3); font-size: 0.98rem; margin: 12px 0 6px; }
  .md table { font-size: 0.85rem; }
  .md hr { border: none; border-top: 1px solid var(--border); margin: 18px 0; }
  .md blockquote {
    border-left: 3px solid var(--accent-2);
    padding: 4px 12px;
    color: var(--text-dim);
    margin: 8px 0;
  }

  /* Mobile menu button — hidden on desktop */
  .menu-toggle {
    display: none;
    position: fixed;
    top: 10px;
    left: 10px;
    z-index: 30;
    background: var(--bg-3);
    color: var(--accent);
    border: 1px solid var(--border-2);
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 1.25rem;
    line-height: 1;
    cursor: pointer;
    min-width: 44px;
    min-height: 44px;
  }
  .menu-toggle:hover { background: var(--bg-2); }
  .menu-toggle:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }

  .sidebar-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--scrim);
    z-index: 18;
  }

  /* Tablet / mobile */
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; }
    .menu-toggle { display: block; }
    aside.sidebar {
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      width: min(280px, 84vw);
      z-index: 20;
      border-right: 1px solid var(--border);
      border-bottom: none;
      padding: 12px 0 24px;
      transform: translateX(-100%);
      transition: transform 0.2s ease;
      box-shadow: 2px 0 12px rgba(0,0,0,0.35);
      overscroll-behavior: contain;
    }
    body.sidebar-open aside.sidebar { transform: translateX(0); }
    body.sidebar-open .sidebar-backdrop { display: block; }

    /* Larger touch targets in the slide-out nav */
    nav a { padding: 11px 18px; font-size: 0.95rem; }
    nav .group { padding: 14px 18px 6px; }
    .brand { padding: 4px 18px 14px; }

    main.content {
      padding: 18px 16px 60px;
      padding-top: 60px;
      max-width: 100%;
    }

    /* Card grid: a single column reads better than awkward 1.x columns */
    .card-grid { grid-template-columns: 1fr; }

    /* kv list: stack key over value to avoid horizontal overflow */
    .kv {
      grid-template-columns: 1fr;
      row-gap: 2px;
    }
    .kv dt { padding-top: 8px; }
    .kv dt:first-of-type { padding-top: 0; }

    /* Filter bars: stack vertically and let inputs fill width */
    .filter-bar { flex-direction: column; align-items: stretch; gap: 8px; }
    .filter-bar input[type="text"],
    .filter-bar select { min-width: 0; width: 100%; }
    .filter-bar .count { align-self: flex-start; }

    /* Slightly tighter typography */
    h1.page-title { font-size: 1.3rem; margin-bottom: 14px; }
    h2 { font-size: 1.05rem; }
    h3 { font-size: 0.95rem; }
  }

  /* Small phones */
  @media (max-width: 480px) {
    main.content { padding: 16px 12px 60px; padding-top: 60px; }
    h1.page-title { font-size: 1.2rem; }
    .card { padding: 12px 14px; }
    .recap-block { padding: 10px 12px; font-size: 0.88rem; }
    pre { padding: 10px; font-size: 0.78rem; }
    /* Tag chips can crowd in narrow rows — give them a little breathing room. */
    .pill-row .tag { margin-bottom: 4px; }
  }

  .scroll-top {
    position: fixed;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    right: 20px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--bg-2);
    border: 1px solid var(--border-2);
    color: var(--accent);
    cursor: pointer;
    display: grid;
    place-items: center;
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
    transition: opacity 200ms ease, transform 200ms ease, background 120ms ease, border-color 120ms ease;
    z-index: 25;
  }
  .scroll-top.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .scroll-top:hover { background: var(--bg-3); border-color: var(--accent); }
  .scroll-top:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .scroll-top svg { width: 20px; height: 20px; }
</style>
</head>
<body>

<button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
<div class="sidebar-backdrop" id="sidebar-backdrop"></div>

<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <a class="home" href="./" aria-label="Return to campaign home">
        <div class="title">TRAVELLER STEPHANUS</div>
        <div class="subtitle">Campaign Viewer</div>
      </a>
      <button class="palette-toggle" id="palette-toggle" type="button"
              aria-label="Cycle color palette" title="Cycle color palette">
        <span class="dot" data-p="phosphor"></span>
        <span class="dot" data-p="starchart"></span>
        <span class="dot" data-p="dossier"></span>
      </button>
    </div>
    <nav id="nav"></nav>
  </aside>

  <main class="content">
    <div id="view"><div class="loading">Loading…</div></div>
  </main>
</div>

<button class="scroll-top" id="scroll-top" type="button" aria-label="Scroll to top" title="Back to top">
  <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M5 12l5-5 5 5"/>
  </svg>
</button>

<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
'use strict';

// =========================================================================

// =========================================================================
// Data loader (caches parsed YAML / JSON / Markdown)
// =========================================================================

const cache = new Map();

async function load(path, kind = 'yaml') {
  const key = `${kind}:${path}`;
  if (cache.has(key)) return cache.get(key);
  const res = await fetch(path);
  if (!res.ok) throw new Error(`HTTP ${res.status} loading ${path}`);
  const text = await res.text();
  let data;
  if (kind === 'yaml') data = jsyaml.load(text);
  else if (kind === 'json') data = JSON.parse(text);
  else data = text;
  cache.set(key, data);
  return data;
}

// =========================================================================
// Helpers
// =========================================================================

function el(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content;
}

function esc(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function nl2br(str) {
  return esc(str).replace(/\n/g, '<br>');
}

function md(str) {
  if (!str) return '';
  return marked.parse(str, { breaks: true, gfm: true });
}

function pad2(n) { return n < 10 ? '0' + n : '' + n; }

function slugify(s) {
  return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
}

function setView(html) {
  const view = document.getElementById('view');
  view.innerHTML = html;
  // Wrap every table in a horizontally scrollable container so wide tables
  // (prices, careers, retirement, etc.) don't blow out the viewport on phones.
  for (const table of view.querySelectorAll('table')) {
    if (table.parentElement && table.parentElement.classList.contains('table-scroll')) continue;
    const wrap = document.createElement('div');
    wrap.className = 'table-scroll';
    table.parentNode.insertBefore(wrap, table);
    wrap.appendChild(table);
  }
  // Scroll the new view to the top so route changes don't strand the user mid-page.
  view.scrollTop = 0;
  window.scrollTo(0, 0);
}

function showError(err, contextPath) {
  const isLocalFile = location.protocol === 'file:';
  const hint = isLocalFile ? `
    <p style="margin-top: 10px;">
      It looks like you opened <code>index.html</code> directly. Browsers block
      <code>fetch()</code> from <code>file://</code>, so the campaign data can't
      be loaded.
    </p>
    <p style="margin-top: 6px;">
      Run a small static server from the project root, then visit
      <code>http://localhost:8000/web/</code>:
    </p>
    <pre>python3 -m http.server 8000</pre>
  ` : '';
  setView(`
    <div class="error">
      <strong>Failed to load data</strong>
      <pre>${esc(err.message || err)}${contextPath ? '\n\nFile: ' + esc(contextPath) : ''}</pre>
      ${hint}
    </div>
  `);
}

function crumbs(parts) {
  return `<div class="crumbs">${parts.map((p, i) =>
    i === parts.length - 1
      ? esc(p.label)
      : (p.route ? `<a href="${p.route}">${esc(p.label)}</a>` : esc(p.label))
  ).join(' / ')}</div>`;
}

// =========================================================================
// Sidebar render
// =========================================================================

function renderNav() {
  const nav = document.getElementById('nav');
  const html = NAV.map(g => `
    <div class="group">${esc(g.group)}</div>
    ${g.items.map(it => it.external
      ? `<a href="${esc(it.route)}" target="_blank" rel="noopener">${esc(it.label)} ↗</a>`
      : `<a href="${esc(it.route)}" data-route="${esc(it.route)}">${esc(it.label)}</a>`
    ).join('')}
  `).join('');
  nav.innerHTML = html;
}

function highlightNav() {
  const route = location.hash || '#/';
  for (const a of document.querySelectorAll('#nav a[data-route]')) {
    const target = a.dataset.route;
    let active = false;
    if (target === '#/') {
      active = (route === '' || route === '#/' || route === '#');
    } else {
      active = route === target || route.startsWith(target + '/');
    }
    a.classList.toggle('active', active);
  }
}

    const all = await Promise.all(SESSION_NUMBERS.map(n =>
      load(`../data/sessions/session-${pad2(n)}.yaml`).then(d => ({ n, data: d.session || d }))
        .catch(() => null)

  } catch (e) { return showError(e); }

  let html = `<h1 class="page-title">GM Session Recaps</h1>`;

  for (const s of sessions) {
    const sd = s.data;
    html += `

}

function truncate(s, max) {
  if (!s) return '';
  s = s.trim();
  if (s.length <= max) return s;
  return s.slice(0, max).replace(/\s+\S*$/, '') + '…';
}

async function viewSession(num) {
  setView('<div class="loading">Loading session…</div>');
  const path = `../data/sessions/session-${pad2(num)}.yaml`;
  let raw;
  try { raw = await load(path); }
  catch (e) { return showError(e, path); }
  const s = raw.session || raw;

  let html = '';
  html += crumbs([
    { route: '#/sessions', label: 'Sessions' },
    { label: `Session ${num}` }
  ]);
  html += `<h1 class="page-title">Session ${num}${s.date ? ` <span class="tag dim" style="font-size: 0.7rem; vertical-align: middle;">${esc(s.date)}</span>` : ''}</h1>`;

  if (s.recap) {
    html += `<h2>Recap</h2><div class="recap-block">${esc(s.recap)}</div>`;
  }

  if (s.key_events?.length) {
    html += `<h2>Key Events</h2><ul>${s.key_events.map(e => `<li>${esc(e)}</li>`).join('')}</ul>`;
  }

  if (s.npcs_introduced?.length) {
    html += `<h2>NPCs Introduced</h2><ul>${s.npcs_introduced.map(n =>
      typeof n === 'string' ? `<li>${esc(n)}</li>`
                            : `<li><strong>${esc(n.name)}</strong>${n.role ? ` — ${esc(n.role)}` : ''}${n.notes ? `: ${esc(n.notes)}` : ''}</li>`
    ).join('')}</ul>`;
  }

  if (s.ship_events?.length) {
    html += `<h2>Ship Events</h2><ul>${s.ship_events.map(e =>
      typeof e === 'string' ? `<li>${esc(e)}</li>`
                            : `<li><strong>${esc(e.event || '')}</strong>${e.outcome ? ` — ${esc(e.outcome)}` : ''}</li>`
    ).join('')}</ul>`;
  }

  if (s.derelicts_surveyed?.length) {
    html += `<h2>Derelicts Surveyed</h2><div class="card-grid">`;
    for (const d of s.derelicts_surveyed) {
      html += `<div class="card">
        <h3>${esc(d.name)}</h3>
        <div class="pill-row">
          ${d.faction ? `<span class="tag">${esc(d.faction)}</span>` : ''}
          ${d.size_marker ? `<span class="tag dim">size ${esc(d.size_marker)}</span>` : ''}
        </div>
        ${d.notes ? `<div style="white-space: pre-wrap; font-size: 0.88rem;">${esc(d.notes)}</div>` : ''}
      </div>`;
    }
    html += `</div>`;
  }

  if (s.absent_pcs?.length) {
    html += `<h2>Absent PCs</h2><ul>${s.absent_pcs.map(n => `<li>${esc(n)}</li>`).join('')}</ul>`;
  }

  // Render any other fields generically
  const knownKeys = new Set(['number','date','recap','key_events','npcs_introduced','ship_events','derelicts_surveyed','absent_pcs']);
  const extras = Object.entries(s).filter(([k]) => !knownKeys.has(k));
  if (extras.length) {
    html += `<h2>Additional Notes</h2>`;
    for (const [k, v] of extras) {
      html += `<h3>${esc(k.replace(/_/g, ' '))}</h3><pre>${esc(jsyaml.dump(v))}</pre>`;
    }
  }

  setView(html);
}

async function viewInvestigation() {
  setView('<div class="loading">Loading investigation…</div>');
  let inv;
  try { inv = await load('../data/investigation.yaml'); }
  catch (e) { return showError(e, '../data/investigation.yaml'); }

  let html = `<h1 class="page-title">Investigation</h1>`;

  if (inv.primary_mission) {
    const pm = inv.primary_mission;
    html += `<div class="card">
      <h3>${esc(pm.name)}<span class="tag good" style="margin-left: 8px;">${esc(pm.status || '')}</span></h3>
      <div class="kv">
        ${pm.client ? `<dt>Client</dt><dd>${esc(pm.client)}</dd>` : ''}
        ${pm.contact ? `<dt>Contact</dt><dd>${esc(pm.contact)}</dd>` : ''}
        ${pm.assigned ? `<dt>Assigned</dt><dd>${esc(pm.assigned)}</dd>` : ''}
      </div>
      ${pm.objective ? `<div style="white-space: pre-wrap;">${esc(pm.objective)}</div>` : ''}
    </div>`;
  }

  if (inv.chain_of_custody?.length) {
    html += `<h2>Chain of Custody</h2>`;
    html += `<table><thead><tr><th>Period</th><th>Event</th><th>Source</th></tr></thead><tbody>`;
    for (const c of inv.chain_of_custody) {
      html += `<tr><td>${esc(c.period || '')}</td><td>${esc(c.event || '')}</td><td>${esc(c.source || '')}</td></tr>`;
    }
    html += `</tbody></table>`;
  }

  const renderLeads = (leads, title, opts = {}) => {
    if (!leads?.length) return '';
    let body = '';
    for (const lead of leads) {
      const statusCls = lead.status === 'resolved' ? 'good'
                      : lead.status === 'stalled'  ? 'warn'
                      : lead.status === 'in_progress' ? '' : 'dim';
      const prioCls = lead.priority === 'high' ? 'bad'
                    : lead.priority === 'medium' ? 'warn' : 'dim';
      body += `<div class="card">
        <h3>${esc(lead.name)}</h3>
        <div class="pill-row">
          ${lead.priority ? `<span class="tag ${prioCls}">${esc(lead.priority)} priority</span>` : ''}
          ${lead.status ? `<span class="tag ${statusCls}">${esc(lead.status)}</span>` : ''}
          ${lead.established ? `<span class="tag dim">established ${esc(lead.established)}</span>` : ''}
          ${lead.last_update ? `<span class="tag dim">updated ${esc(lead.last_update)}</span>` : ''}
          ${lead.resolved ? `<span class="tag dim">resolved ${esc(lead.resolved)}</span>` : ''}
        </div>
        ${lead.description ? `<div style="white-space: pre-wrap; margin-bottom: 6px;">${esc(lead.description)}</div>` : ''}
        ${lead.action_required ? `<div><strong>Action:</strong> ${esc(lead.action_required)}</div>` : ''}
        ${lead.notes ? `<div style="white-space: pre-wrap; color: var(--text-dim); font-size: 0.88rem; margin-top: 6px;">${esc(lead.notes)}</div>` : ''}
      </div>`;
    }
    if (opts.collapsible) {
      return `<details class="collapsible"><summary><h2>${esc(title)} <span class="tag dim">${leads.length}</span></h2></summary>${body}</details>`;
    }
    return `<h2>${esc(title)}</h2>${body}`;
  };

  if (inv.current_plan) {
    html += `<h2>Current Plan</h2>`;
    const cp = inv.current_plan;
    if (cp.summary) html += `<div class="recap-block">${esc(cp.summary)}</div>`;
    const planKnown = new Set(['summary','assets','timeline']);
    const planExtras = Object.entries(cp).filter(([k]) => !planKnown.has(k));
    for (const [k, v] of planExtras) {
      html += `<h3>${esc(k.replace(/_/g, ' '))}</h3>${renderYaml(v, 1)}`;
    }
  }

  html += renderLeads(inv.active_leads, 'Active Leads', { collapsible: true });
  html += renderLeads(inv.resolved_leads, 'Resolved Leads');

  if (inv.dead_ends?.length) {
    let body = '';
    for (const d of inv.dead_ends) {
      body += `<div class="card">
        <h3>${esc(d.name)}</h3>
        <div class="pill-row">
          ${d.ruled_out ? `<span class="tag dim">ruled out ${esc(d.ruled_out)}</span>` : ''}
        </div>
        ${d.description ? `<div style="margin-bottom: 4px;">${esc(d.description)}</div>` : ''}
        ${d.reason ? `<div style="white-space: pre-wrap;"><strong>Why:</strong> ${esc(d.reason)}</div>` : ''}
        ${d.notes ? `<div style="white-space: pre-wrap; color: var(--text-dim); font-size: 0.88rem; margin-top: 6px;">${esc(d.notes)}</div>` : ''}
      </div>`;
    }
    html += `<details class="collapsible"><summary><h2>Dead Ends <span class="tag dim">${inv.dead_ends.length}</span></h2></summary>${body}</details>`;
  }

  if (inv.key_intel?.length) {
    let body = '';
    for (const it of inv.key_intel) {
      body += `<div class="card">
        <h3>${esc(it.fact || it.topic || it.name || 'Intel')}</h3>
        <div class="pill-row">
          ${it.source ? `<span class="tag dim">source: ${esc(it.source)}</span>` : ''}
          ${(it.factions || []).map(f => `<span class="tag">${esc(f)}</span>`).join('')}
        </div>
        ${it.details ? `<div style="white-space: pre-wrap;">${esc(it.details)}</div>` : ''}
      </div>`;
    }
    html += `<details class="collapsible"><summary><h2>Key Intel <span class="tag dim">${inv.key_intel.length}</span></h2></summary>${body}</details>`;
  }

  if (inv.open_questions?.length) {
    const items = inv.open_questions.map(q =>
      typeof q === 'string' ? `<li>${esc(q)}</li>` : `<li><strong>${esc(q.question || q.fact || '')}</strong>${q.notes ? ` — ${esc(q.notes)}` : ''}</li>`
    ).join('');
    html += `<details class="collapsible"><summary><h2>Open Questions <span class="tag dim">${inv.open_questions.length}</span></h2></summary><ul>${items}</ul></details>`;
  }

  // Catch-all for anything else
  const known = new Set(['primary_mission','chain_of_custody','active_leads','dead_ends','resolved_leads','key_intel','open_questions','current_plan']);
  const extras = Object.entries(inv).filter(([k]) => !known.has(k));
  for (const [k, v] of extras) {
    html += `<h2>${esc(k.replace(/_/g, ' '))}</h2>${renderYaml(v, 1)}`;
  }

  setView(html);
}

async function viewTimeline() {
  setView('<div class="loading">Loading timeline…</div>');
  let inv;

  catch (e) { return showError(e, '../data/investigation.yaml'); }

  let html = crumbs([
    { route: '#/investigation', label: 'Investigation' },
    { label: 'Timeline' }

  html += `<h1 class="page-title">Timeline</h1>`;

  if (inv.current_plan?.summary) {
    html += `<div class="recap-block">${esc(inv.current_plan.summary)}</div>`;
  }

  html += `<table><thead><tr><th>Day</th><th>Location</th><th>Notes</th></tr></thead><tbody>`;
  for (const t of timeline) {
    html += `<tr><td>${esc(t.day ?? '')}</td><td>${esc(t.location || '')}</td><td style="white-space: pre-wrap;">${esc(t.notes || '')}</td></tr>`;
  }
  html += `</tbody></table>`;

  setView(html);
}

let _npcsState = { search: '', affiliation: '', status: '' };

async function viewNPCs() {
  setView('<div class="loading">Loading NPCs…</div>');
  let raw;
  try { raw = await load('../data/npcs.yaml'); }
  catch (e) { return showError(e, '../data/npcs.yaml'); }
  const npcs = raw.npcs || [];

  const affiliations = Array.from(new Set(npcs.map(n => n.affiliation).filter(Boolean))).sort();
  const statuses = Array.from(new Set(npcs.map(n => n.status).filter(Boolean))).sort();

  const renderList = () => {
    const q = _npcsState.search.toLowerCase();
    const filt = npcs.filter(n => {
      if (_npcsState.affiliation && n.affiliation !== _npcsState.affiliation) return false;
      if (_npcsState.status && n.status !== _npcsState.status) return false;
      if (q) {
        const hay = [n.name, n.role, n.location, n.description, n.notes, n.affiliation].filter(Boolean).join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    let h = `<div class="filter-bar"><span class="count">${filt.length} of ${npcs.length}</span></div>`;
    h += `<div class="card-grid">`;
    for (const n of filt) {
      const statusStr = (n.status || '').toLowerCase();
      const statusCls = statusStr.includes('deceased') || statusStr.includes('hostile') ? 'bad'
                      : statusStr.includes('missing') || statusStr.includes('captured') ? 'warn'
                      : statusStr.includes('allied') || statusStr === 'active' ? 'good'
                      : 'dim';
      h += `<div class="card">
        <h3>${esc(n.name)}</h3>
        <div class="pill-row">
          ${n.affiliation ? `<span class="tag">${esc(n.affiliation)}</span>` : ''}
          ${n.role ? `<span class="tag dim">${esc(n.role)}</span>` : ''}
          ${n.status ? `<span class="tag ${statusCls}">${esc(n.status)}</span>` : ''}
          ${n.location ? `<span class="tag dim">${esc(n.location)}</span>` : ''}
          ${n.first_appearance ? `<span class="tag dim">${esc(n.first_appearance)}</span>` : ''}
        </div>
        ${n.description ? `<div style="white-space: pre-wrap; font-size: 0.9rem;">${esc(n.description)}</div>` : ''}
        ${n.notes ? `<div style="white-space: pre-wrap; color: var(--text-dim); font-size: 0.85rem; margin-top: 6px;"><em>${esc(n.notes)}</em></div>` : ''}
      </div>`;
    }
    h += `</div>`;
    document.getElementById('npc-list').innerHTML = h;
  };

  setView(`
    <h1 class="page-title">NPCs</h1>
    <div class="filter-bar">
      <input type="text" id="npc-search" placeholder="Search…" value="${esc(_npcsState.search)}">
      <select id="npc-aff">
        <option value="">All affiliations</option>
        ${affiliations.map(a => `<option value="${esc(a)}"${a === _npcsState.affiliation ? ' selected' : ''}>${esc(a)}</option>`).join('')}
      </select>
      <select id="npc-status">
        <option value="">All statuses</option>
        ${statuses.map(a => `<option value="${esc(a)}"${a === _npcsState.status ? ' selected' : ''}>${esc(a)}</option>`).join('')}
      </select>
    </div>
    <div id="npc-list"></div>
  `);
  document.getElementById('npc-search').addEventListener('input', e => {
    _npcsState.search = e.target.value; renderList();
  });
  document.getElementById('npc-aff').addEventListener('change', e => {
    _npcsState.affiliation = e.target.value; renderList();
  });
  document.getElementById('npc-status').addEventListener('change', e => {
    _npcsState.status = e.target.value; renderList();
  });
  renderList();
}

const UWP_DESCRIPTIONS = {
  starport: { A: 'Excellent', B: 'Good', C: 'Routine', D: 'Poor', X: 'None' },
  size: {
    '0': 'Asteroid', '1': 'Tiny', '2': 'Small', '3': 'Small',
    '4': 'Mid-sized', '5': 'Mid-sized', '6': 'Mid-sized',
    '7': 'Earth-sized', '8': 'Earth-sized',
    '9': 'Large', A: 'Large', B: 'Very large'
  },
  atmosphere: {
    '0': 'None', '1': 'Trace', '2': 'Very thin, tainted', '3': 'Very thin',
    '4': 'Thin, tainted', '5': 'Thin', '6': 'Standard', '7': 'Standard, tainted',
    '8': 'Dense', '9': 'Dense, tainted', A: 'Exotic', B: 'Corrosive', C: 'Insidious'
  },
  population: {
    '0': 'Uninhabited', '1': 'Tens', '2': 'Hundreds', '3': 'Thousands',
    '4': 'Tens of thousands', '5': 'Hundreds of thousands', '6': 'Millions',
    '7': 'Tens of millions', '8': 'Hundreds of millions', '9': 'Billions',
    A: 'Tens of billions', B: 'Hundreds of billions', C: 'Trillions'
  },
  law_level: {
    '0': 'No law', '1': 'Permissive', '2': 'Permissive', '3': 'Low',
    '4': 'Moderate', '5': 'Moderate', '6': 'Moderate', '7': 'Contemporary',
    '8': 'Strict', '9': 'Strict', A: 'Very restrictive',
    B: 'Very restrictive', C: 'Extremely restrictive'
  },
  tech_level: { P: 'Primitive', I: 'Industrial', A: 'Atomic', Q: 'Quantum' }
};

function uwpDesc(field, value) {
  if (value == null) return '';
  const key = String(value).toUpperCase();
  const desc = UWP_DESCRIPTIONS[field]?.[key];
  return desc ? ` <span style="color: var(--text-dim); font-weight: normal;">(${desc})</span>` : '';
}

function hydroPct(value) {
  if (value == null) return '';
  const key = String(value).toUpperCase();
  const map = { '0': '0%', '1': '10%', '2': '20%', '3': '30%', '4': '40%',
    '5': '50%', '6': '60%', '7': '70%', '8': '80%', '9': '90%', A: '100%' };
  const pct = map[key];
  return pct ? ` <span style="color: var(--text-dim); font-weight: normal;">(${pct})</span>` : '';
}

async function viewWorld(slug) {
  setView('<div class="loading">Loading world…</div>');
  let raw, graph;
  try {
    [raw, graph] = await Promise.all([
      load('../data/worlds/systems.yaml'),
      load('../data/worlds/sector-graph.json', 'json').catch(() => null)
    ]);

  let html = '';
  html += crumbs([{ route: '#/worlds', label: 'Worlds' }, { label: sys.name }]);
  html += `<h1 class="page-title">${esc(sys.name)}</h1>`;
  html += `<div class="pill-row">
    <span class="tag starport-${esc(sys.starport)}">Starport ${esc(sys.starport)}</span>
    ${sys.uwp ? `<span class="tag dim">${esc(sys.uwp)}</span>` : ''}
    ${hex ? `<span class="tag">hex ${esc(hex.id)}</span>` : ''}
  </div>`;
  html += `<div class="kv">
    ${sys.starport != null ? `<dt>Starport</dt><dd>${esc(sys.starport)}${uwpDesc('starport', sys.starport)}</dd>` : ''}
    ${sys.size != null ? `<dt>Size</dt><dd>${esc(sys.size)}${uwpDesc('size', sys.size)}</dd>` : ''}
    ${sys.atmosphere != null ? `<dt>Atmosphere</dt><dd>${esc(sys.atmosphere)}${uwpDesc('atmosphere', sys.atmosphere)}</dd>` : ''}
    ${sys.hydrosphere != null ? `<dt>Hydrosphere</dt><dd>${esc(sys.hydrosphere)}${hydroPct(sys.hydrosphere)}</dd>` : ''}
    ${sys.population != null ? `<dt>Population</dt><dd>${esc(sys.population)}${uwpDesc('population', sys.population)}</dd>` : ''}
    ${sys.law_level != null ? `<dt>Law Level</dt><dd>${esc(sys.law_level)}${uwpDesc('law_level', sys.law_level)}</dd>` : ''}
    ${sys.tech_level != null ? `<dt>Tech Level</dt><dd>${esc(sys.tech_level)}${uwpDesc('tech_level', sys.tech_level)}</dd>` : ''}
  </div>`;
  if (sys.description) {
    html += `<h2>Overview</h2><div class="recap-block">${esc(sys.description)}</div>`;
  }
  // Render any extra fields
  const known = new Set(['name','uwp','starport','size','atmosphere','hydrosphere','population','law_level','tech_level','description']);
  const extras = Object.entries(sys).filter(([k]) => !known.has(k));
  for (const [k, v] of extras) {
    html += `<h2>${esc(k.replace(/_/g, ' '))}</h2>`;
    if (typeof v === 'string') html += `<div style="white-space: pre-wrap;">${esc(v)}</div>`;
    else html += `<pre>${esc(jsyaml.dump(v))}</pre>`;
  }
  setView(html);
}

async function viewAssets() {
  setView('<div class="loading">Loading assets…</div>');
  let raw;
  try { raw = await load('../data/assets.yaml'); }
  catch (e) { return showError(e, '../data/assets.yaml'); }

  let html = `<h1 class="page-title">Assets</h1>`;

  if (raw.party_kitty) {

    let notesBody = '';
    if (k.notes) {
      const lines = k.notes.replace(/\s+$/, '').split('\n');
      let lastSessionIdx = -1;
      for (let i = lines.length - 1; i >= 0; i--) {
        if (/^Session \d+:/.test(lines[i])) {
          lastSessionIdx = i;
          break;
        }
      }
      if (lastSessionIdx > 0) {
        const earlier = lines.slice(0, lastSessionIdx).join('\n');
        const latest = lines.slice(lastSessionIdx).join('\n');
        notesBody = `<div style="white-space: pre-wrap; font-size: 0.88rem; color: var(--text-dim);">${esc(latest)}</div>
        <details style="margin-top: 8px;">

          <div style="white-space: pre-wrap; font-size: 0.88rem; color: var(--text-dim); margin-top: 8px;">${esc(earlier)}</div>
        </details>`;
      } else {
        notesBody = `<div style="white-space: pre-wrap; font-size: 0.88rem; color: var(--text-dim);">${esc(k.notes)}</div>`;
      }
    }
    html += `<div class="card">
      <h3>Party Kitty</h3>
      <div class="pill-row">
        <span class="tag">${esc((k.balance || 0).toLocaleString())} Cr</span>
        ${k.last_updated ? `<span class="tag dim">as of ${esc(k.last_updated)}</span>` : ''}
      </div>
      ${notesBody}
    </div>`;
  }

  if (raw.shared_equipment?.length) {
    html += `<h2>Shared Equipment</h2><table><thead><tr><th>Item</th><th>Qty</th><th>Location</th><th>Notes</th></tr></thead><tbody>`;
    for (const e of raw.shared_equipment) {
      html += `<tr><td>${esc(e.name)}</td><td>${esc(e.quantity ?? '')}</td><td>${esc(e.location || '')}</td><td>${esc(e.notes || '')}</td></tr>`;
    }
    html += `</tbody></table>`;
  }

  if (raw.recovered_data?.length) {
    html += `<h2>Recovered Intelligence / Data</h2>`;
    for (const r of raw.recovered_data) {
      html += `<div class="card">
        <h3>${esc(r.source || 'Unknown source')}</h3>
        <ul>${(r.items || []).map(it => `<li><strong>${esc(it.description || '')}</strong> <span class="tag ${it.status === 'decoded' ? 'good' : it.status === 'pending' ? 'warn' : 'dim'}">${esc(it.status || '')}</span>${it.notes ? `<br><span style="color: var(--text-dim); font-size: 0.88rem;">${esc(it.notes)}</span>` : ''}</li>`).join('')}</ul>
      </div>`;
    }
  }

  setView(html);

async function viewShips() {
  setView('<div class="loading">Loading ships…</div>');
  let raw;
  try { raw = await load('../data/assets.yaml'); }
  catch (e) { return showError(e, '../data/assets.yaml'); }

  let html = `<h1 class="page-title">Ships</h1>`;

  if (raw.ships?.length) {
    for (const ship of raw.ships) {
      const cargoList = Array.isArray(ship.cargo) ? ship.cargo : (ship.cargo?.manifest || []);
      const cargoUsed = cargoList.reduce((s, c) => s + (Number(c.tons) || 0), 0);
      const cargoCap  = Number(ship.frame?.cargo_capacity) || 0;
      const cargoOver = cargoCap > 0 && cargoUsed > cargoCap;

      const hangerList = ship.hanger || [];
      const hangerUsed = hangerList.reduce((s, v) => s + (Number(v.tons) || 0), 0);
      const hangerCap  = Number(ship.frame?.hanger_capacity) || 0;
      const hangerOver = hangerCap > 0 && hangerUsed > hangerCap;

      const fmtCap = (used, cap, over) => {
        if (!cap) return '';
        const cls = over ? 'bad' : (used >= cap * 0.9 ? 'warn' : 'good');
        const usedStr = (used % 1 === 0) ? used : used.toFixed(1);
        return `<span class="tag ${cls}">${usedStr} / ${cap} t</span>`;
      };

      // A bay (cargo or hangar) renders a loose-cargo table + a vessel card grid.
      // Items keyed by `item:` are loose; items keyed by `name:` are vessels.
      const renderBay = (label, list, cap) => {
        if (!list.length && !cap) return '';
        const loose   = list.filter(c => c.item);
        const vessels = list.filter(c => c.name);
        const used = list.reduce((s, c) => s + (Number(c.tons) || 0), 0);
        const over = cap > 0 && used > cap;

        let h = `<h3>${esc(label)} ${fmtCap(used, cap, over)}</h3>`;

        h += `<table><thead><tr><th>Item</th><th>Qty</th><th>Tons</th><th>Source</th><th>Notes</th></tr></thead><tbody>`;
        if (loose.length) {
          h += loose.map(c => `<tr><td>${esc(c.item)}${c.value != null ? ` <span class="tag dim">${esc(Number(c.value).toLocaleString())} Cr</span>` : ''}</td><td>${esc(c.count ?? c.quantity ?? '')}</td><td>${esc(c.tons ?? '')}</td><td>${esc(c.source || '')}</td><td style="white-space: pre-wrap;">${esc(c.notes || '')}</td></tr>`).join('');
        } else {
          h += `<tr><td colspan="5" style="color: var(--text-dim); text-align: center; font-style: italic;">no loose cargo</td></tr>`;
        }
        h += `</tbody></table>`;

        if (vessels.length) {
          h += `<div class="card-grid" style="margin-top: 12px;">`;
          h += vessels.map(v => `
            <div class="card" style="background: var(--bg-1);">
              <h3>${esc(v.name)}</h3>
              <div class="pill-row">
                ${v.owner ? `<span class="tag">${esc(v.owner)}</span>` : ''}
                ${v.tons ? `<span class="tag dim">${esc(v.tons)} t</span>` : ''}
                ${v.cargo_capacity ? `<span class="tag dim">${esc(v.cargo_capacity)} t cargo</span>` : ''}
                ${v.source ? `<span class="tag dim">${esc(v.source)}</span>` : ''}
              </div>
              ${v.current_cargo?.length
                ? `<ul style="margin: 0;">${v.current_cargo.map(c => `<li>${esc(c.item)}${c.count ? ` ×${esc(c.count)}` : ''}${c.tons ? ` (${esc(c.tons)} t${c.count ? ` each` : ''})` : ''}${c.notes ? ` — ${esc(c.notes)}` : ''}</li>`).join('')}</ul>`
                : '<div style="color: var(--text-dim); font-size: 0.85rem;">empty</div>'}
              ${v.notes ? `<div style="margin-top: 6px; white-space: pre-wrap; font-size: 0.85rem; color: var(--text-dim);">${esc(v.notes)}</div>` : ''}
            </div>
          `).join('');
          h += `</div>`;
        }

        return h;
      };

      html += `<div class="card">
        <h3>${esc(ship.name)}</h3>
        <div class="pill-row">
          ${ship.type ? `<span class="tag">${esc(ship.type)}</span>` : ''}
          ${ship.status ? `<span class="tag ${ship.status === 'operational' ? 'good' : 'warn'}">${esc(ship.status)}</span>` : ''}
          ${ship.owner ? `<span class="tag dim">owner: ${esc(ship.owner)}</span>` : ''}
          ${ship.acquired ? `<span class="tag dim">${esc(ship.acquired)}</span>` : ''}
        </div>
        ${ship.notes ? `<div style="white-space: pre-wrap; font-size: 0.88rem; margin-bottom: 10px;">${esc(ship.notes)}</div>` : ''}

        ${ship.frame ? `<h3>Frame</h3><div class="kv">
          ${ship.frame.tonnage ? `<dt>Tonnage</dt><dd>${esc(ship.frame.tonnage)}</dd>` : ''}
          ${ship.frame.hull_hp ? `<dt>Hull HP</dt><dd>${esc(ship.frame.hull_current ?? ship.frame.hull_hp)} / ${esc(ship.frame.hull_hp)}</dd>` : ''}
          ${cargoCap ? `<dt>Cargo</dt><dd>${cargoUsed} / ${cargoCap} t</dd>` : ''}
          ${hangerCap ? `<dt>Hanger</dt><dd>${hangerUsed || '—'} / ${hangerCap} t</dd>` : ''}
        </div>` : ''}

        ${ship.systems ? `<h3>Systems</h3><pre>${esc(jsyaml.dump(ship.systems))}</pre>` : ''}
        ${ship.amenities ? `<h3>Amenities</h3><pre>${esc(jsyaml.dump(ship.amenities))}</pre>` : ''}
        ${ship.passengers?.length ? `<h3>Passengers</h3><ul>${ship.passengers.map(p => `<li><strong>${esc(p.name)}</strong>${p.role ? ` (${esc(p.role)})` : ''}${p.boarded ? ` — boarded ${esc(p.boarded)}` : ''}${p.notes ? `: ${esc(p.notes)}` : ''}</li>`).join('')}</ul>` : ''}

        ${renderBay('Cargo Bay', cargoList, cargoCap)}

        ${renderBay('Hanger', hangerList, hangerCap)}

        ${ship.damage_log?.length ? `<h3>Damage Log</h3><ul>${ship.damage_log.map(d => `<li>Session ${esc(d.session)}: ${esc(d.damage)}${d.repaired ? ` <span class="tag good">repaired</span>` : ` <span class="tag warn">unrepaired</span>`}${d.repaired_by ? ` — ${esc(d.repaired_by)}` : ''}</li>`).join('')}</ul>` : ''}
      </div>`;
    }
  }

  setView(html);
}

async function viewRule(id) {
  const r = RULES_FILES.find(x => x.id === id);
  if (!r) return setView(`<div class="error">Unknown rules file: ${esc(id)}</div>`);
  setView('<div class="loading">Loading rules…</div>');
  let raw;
  try { raw = await load(`../data/rules/${id}.yaml`); }
  catch (e) { return showError(e, `../data/rules/${id}.yaml`); }

  let html = '';
  html += crumbs([{ route: '#/rules', label: 'Rules' }, { label: r.label }]);
  html += `<h1 class="page-title">${esc(r.label)}</h1>`;

  if (id === 'skills' && raw.skills?.length) {
    // Group skills by category
    const groups = {};
    for (const s of raw.skills) {
      const cat = s.category || 'Other';
      (groups[cat] = groups[cat] || []).push(s);
    }
    for (const [cat, list] of Object.entries(groups)) {
      html += `<h2>${esc(cat)}</h2><table><thead><tr><th>Skill</th><th>Description</th><th>Bonus</th><th>Careers</th></tr></thead><tbody>`;
      for (const s of list) {
        html += `<tr>
          <td><strong>${esc(s.name)}</strong></td>
          <td>${esc(s.description || '')}</td>
          <td>${esc(s.attribute_bonus || '')}</td>
          <td>${(s.careers || []).map(c => `<span class="tag dim">${esc(c)}</span>`).join('')}</td>
        </tr>`;
      }
      html += `</tbody></table>`;
    }
  } else if (id === 'character-creation') {
    html += renderCharacterCreation(raw);
  } else if (id === 'combat') {
    html += renderCombat(raw);
  } else {
    // Generic YAML render
    html += renderYaml(raw);
  }

  setView(html);
}

function titleCase(s) {
  return String(s).replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

function rollTable(results, rollLabel = 'Roll', resultLabel = 'Result') {
  if (!results || typeof results !== 'object') return '';
  let html = `<table><thead><tr><th style="width: 110px;">${esc(rollLabel)}</th><th>${esc(resultLabel)}</th></tr></thead><tbody>`;
  for (const [k, v] of Object.entries(results)) {
    html += `<tr><td><strong>${esc(k)}</strong></td><td>${esc(String(v))}</td></tr>`;
  }
  html += `</tbody></table>`;
  return html;
}

function rollMeta(obj, extraKeys = []) {
  const parts = [];
  if (obj.roll) parts.push(`<span><span style="color: var(--text-faint);">Roll</span> <code>${esc(obj.roll)}</code></span>`);
  if (obj.target) parts.push(`<span><span style="color: var(--text-faint);">Target</span> <strong>${esc(obj.target)}+</strong></span>`);
  if (obj.modifier) parts.push(`<span><span style="color: var(--text-faint);">Modifier</span> ${esc(obj.modifier)}</span>`);
  for (const k of extraKeys) {
    if (obj[k] != null) parts.push(`<span><span style="color: var(--text-faint);">${esc(titleCase(k))}</span> ${esc(String(obj[k]))}</span>`);
  }
  if (!parts.length) return '';
  return `<div style="display: flex; flex-wrap: wrap; gap: 14px; margin: 4px 0 8px; font-size: 0.88rem;">${parts.join('')}</div>`;
}

// Collapse e.g. {2:-2, 3:-1, 4:-1, 5:-1, 6:0, 7:0, 8:0} into ranges sharing the same modifier.
function groupModifiers(modifiers) {
  const sorted = Object.entries(modifiers)
    .map(([k, v]) => [Number(k), v])
    .sort((a, b) => a[0] - b[0]);
  const groups = [];
  for (const [score, mod] of sorted) {
    const last = groups[groups.length - 1];
    if (last && last.mod === mod && last.scores[last.scores.length - 1] + 1 === score) {
      last.scores.push(score);
    } else {
      groups.push({ mod, scores: [score] });
    }
  }
  return groups.map(g => ({
    range: g.scores.length === 1 ? String(g.scores[0]) : `${g.scores[0]}–${g.scores[g.scores.length - 1]}`,
    mod: g.mod
  }));
}

// Render a generic procedure section: scalars as a kv list, nested objects as
// sub-headings with the same recursive treatment. Used for career_procedure.
function renderProcedureSection(sec, depth = 0) {
  if (sec == null) return '';
  if (Array.isArray(sec)) {
    if (sec.every(x => typeof x !== 'object' || x === null)) {
      return `<ul>${sec.map(v => `<li>${esc(String(v))}</li>`).join('')}</ul>`;
    }
    return sec.map(s => `<div class="card">${renderProcedureSection(s, depth + 1)}</div>`).join('');
  }
  if (typeof sec !== 'object') return `<p>${esc(String(sec))}</p>`;

  const scalars = [];
  const nested = [];
  for (const [k, v] of Object.entries(sec)) {
    if (v !== null && typeof v === 'object') nested.push([k, v]);
    else scalars.push([k, v]);
  }
  let html = '';
  if (scalars.length) {
    html += '<div class="kv">';
    for (const [k, v] of scalars) {
      const display = v == null ? '<span style="color: var(--text-faint);">—</span>' : esc(String(v));
      html += `<dt>${esc(titleCase(k))}</dt><dd>${display}</dd>`;
    }
    html += '</div>';
  }
  for (const [k, v] of nested) {
    const tag = depth === 0 ? 'h4' : 'h4';
    html += `<${tag} style="margin: 10px 0 4px; font-size: 0.92rem; color: var(--accent);">${esc(titleCase(k))}</${tag}>`;
    html += renderProcedureSection(v, depth + 1);
  }
  return html;
}

    }

      if (t.careers_per_character.note) html += `<p style="color: var(--text-dim); font-size: 0.9rem;"><em>${esc(t.careers_per_character.note)}</em></p>`;

      html += `<div class="kv"><dt>Starting Age</dt><dd>${esc(raw.age.calculation)}</dd></div>`;

    if (raw.age.aging) {

    for (const [k, v] of Object.entries(raw.hit_protection)) {

  if (raw.equipment) {

    html += `<details class="collapsible"><summary><h2>Step 8 · Equipment</h2></summary>`;
    if (eq.material_benefits && typeof eq.material_benefits === 'object') {
      html += `<h3>Material Benefits</h3><div class="kv">`;
      for (const [k, v] of Object.entries(eq.material_benefits)) {
        html += `<dt>${esc(titleCase(k))}</dt><dd>${esc(String(v))}</dd>`;
      }
      html += `</div>`;
    }
    if (eq.personal_vehicles && typeof eq.personal_vehicles === 'object') {
      html += `<h3>Personal Vehicles</h3>`;
      for (const [k, list] of Object.entries(eq.personal_vehicles)) {
        html += `<div style="margin: 6px 0 10px;"><div style="color: var(--text-faint); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px;">${esc(titleCase(k))}</div>`;

          html += `<ul style="margin-bottom: 0;">${list.map(v => `<li>${esc(String(v))}</li>`).join('')}</ul>`;

      }

    if (eq.sabbatical && typeof eq.sabbatical === 'object') {
      html += `<h3>Sabbatical</h3><div class="kv">`;
      for (const [k, v] of Object.entries(eq.sabbatical)) {
        const display = (k === 'cost' && typeof v === 'number') ? `${v.toLocaleString()} Cr` : String(v);
        html += `<dt>${esc(titleCase(k))}</dt><dd>${esc(display)}</dd>`;
      }
      html += `</div>`;
    }
    html += `</details>`;
  }

  // Catch-all for any unexpected top-level keys
  const known = new Set(['attributes','background','terms','career_procedure','additional_careers','age','hit_protection','equipment']);
  const extras = Object.entries(raw).filter(([k]) => !known.has(k));
  for (const [k, v] of extras) {
    html += `<h2>${esc(titleCase(k))}</h2>${renderYaml(v, 1)}`;
  }

  return html;
}

// =========================================================================
// Combat rules — bespoke renderer (the YAML is too structured for renderYaml)
// =========================================================================

function combatKey(k) {
  let s = String(k).replace(/_plus$/i, '+').replace(/_/g, ' ');
  s = s.replace(/\b[a-z]/g, c => c.toUpperCase());
  s = s.replace(/\b(Str|Dex|End|Int|Edu|Soc|Hp|Npc|Pc|Gm)\b/g, m => m.toUpperCase());
  return s;
}

function formatMod(v) {
  if (typeof v === 'number') {
    const cls = v > 0 ? 'good' : v < 0 ? 'bad' : 'dim';
    const txt = v > 0 ? `+${v}` : String(v);
    return `<span class="tag ${cls}">${esc(txt)}</span>`;
  }
  if (typeof v === 'string' && /^[+-]/.test(v)) {
    const cls = v.startsWith('+') ? 'good' : 'bad';
    return `<span class="tag ${cls}">${esc(v)}</span>`;
  }
  return esc(String(v));
}

// Render an object whose scalar leaves are modifiers; nested objects become sub-headings.
function renderModifierGroup(obj, headingLevel = 4) {
  if (obj == null || typeof obj !== 'object') return '';
  const scalars = [];
  const nested = [];
  for (const [k, v] of Object.entries(obj)) {
    if (v != null && typeof v === 'object' && !Array.isArray(v)) nested.push([k, v]);
    else scalars.push([k, v]);
  }

  let html = '';
  if (scalars.length) {
    html += `<table><thead><tr><th>Condition</th><th style="width: 220px;">Effect</th></tr></thead><tbody>`;
    for (const [k, v] of scalars) {
      const eff = Array.isArray(v) ? v.map(x => esc(String(x))).join('<br>') : formatMod(v);
      html += `<tr><td><strong>${esc(combatKey(k))}</strong></td><td>${eff}</td></tr>`;
    }
    html += `</tbody></table>`;
  }

  const tag = `h${Math.min(headingLevel, 6)}`;
  for (const [k, v] of nested) {
    html += `<${tag} style="margin: 14px 0 4px; font-size: 0.92rem; color: var(--accent);">${esc(combatKey(k))}</${tag}>`;
    html += renderModifierGroup(v, headingLevel + 1);
  }
  return html;
}

function renderCombat(raw) {
  const basics = raw.basics;
  const hp = raw.hit_protection;
  const ap = raw.attack_procedure;
  const am = raw.attack_modifiers;
  const dam = raw.damage;
  const armor = raw.armor;
  const healing = raw.healing;

  let html = '';

  // Quick-reference cards: round structure + hit protection
  if (basics || hp) {
    html += `<div class="card-grid" style="margin-bottom: 18px;">`;
    if (basics) {
      html += `<div class="card"><h3>Round Structure</h3><div class="kv">`;
      if (basics.surprise) html += `<dt>Surprise</dt><dd>${esc(basics.surprise)}</dd>`;
      if (basics.action) html += `<dt>Action</dt><dd>${esc(basics.action)}</dd>`;
      if (basics.timing) html += `<dt>Timing</dt><dd>${esc(basics.timing)}</dd>`;
      if (basics.actions_per_round != null) html += `<dt>Actions / round</dt><dd>${esc(String(basics.actions_per_round))}</dd>`;
      html += `</div>`;
      if (Array.isArray(basics.action_types) && basics.action_types.length) {
        html += `<div style="margin-top: 6px;">`;
        for (const a of basics.action_types) html += `<span class="tag">${esc(a)}</span>`;
        html += `</div>`;
      }
      html += `</div>`;
    }
    if (hp) {
      html += `<div class="card"><h3>Hit Protection</h3><div class="kv">`;
      if (hp.total) html += `<dt>Total HP</dt><dd><code>${esc(hp.total)}</code></dd>`;
      if (hp.bloodied) html += `<dt>Bloodied</dt><dd>${esc(hp.bloodied)}</dd>`;
      if (hp.dying) html += `<dt>Dying</dt><dd style="color: var(--text-dim); font-size: 0.85rem;">${esc(hp.dying)}</dd>`;
      html += `</div></div>`;
    }
    html += `</div>`;
  }

  // Attack procedure (open by default — most-used reference)
  if (ap) {
    html += `<details class="collapsible" open><summary><h2>Attack Procedure</h2></summary>`;
    html += `<div class="kv">`;
    if (ap.roll) html += `<dt>Roll</dt><dd><code>${esc(ap.roll)}</code></dd>`;
    if (ap.target != null) html += `<dt>Target</dt><dd><strong>${esc(String(ap.target))}</strong></dd>`;
    if (ap.modifiers) html += `<dt>Modifiers</dt><dd>${esc(ap.modifiers)}</dd>`;
    if (ap.on_success) html += `<dt>On Success</dt><dd>${esc(ap.on_success)}</dd>`;
    if (ap.armor) html += `<dt>Armor</dt><dd>${esc(ap.armor)}</dd>`;
    html += `</div>`;
    if (ap.bloodied_save) {
      const bs = ap.bloodied_save;
      html += `<h3>Bloodied Save</h3><div class="kv">`;
      if (bs.trigger) html += `<dt>Trigger</dt><dd>${esc(bs.trigger)}</dd>`;
      if (bs.target != null) html += `<dt>Target</dt><dd><strong>${esc(String(bs.target))}</strong></dd>`;
      html += `</div>`;
      if (Array.isArray(bs.modifiers) && bs.modifiers.length) {
        html += `<ul>${bs.modifiers.map(m => `<li>${esc(m)}</li>`).join('')}</ul>`;
      }
    }
    html += `</details>`;
  }

  // Attack modifiers (collapsed)
  if (am) {
    html += `<details class="collapsible"><summary><h2>Attack Modifiers</h2></summary>`;
    for (const [section, body] of Object.entries(am)) {
      html += `<h3>${esc(combatKey(section))}</h3>`;
      html += renderModifierGroup(body, 4);
    }
    html += `</details>`;
  }

  // Damage
  if (dam) {
    html += `<details class="collapsible"><summary><h2>Damage</h2></summary>`;

    if (dam.weapon_damage) {
      html += `<h3>Weapon Damage</h3>`;
      html += `<table><thead><tr><th style="width: 90px;">Dice</th><th>Weapons</th></tr></thead><tbody>`;
      for (const [dice, list] of Object.entries(dam.weapon_damage)) {
        if (Array.isArray(list)) {
          const tags = list.map(w => `<span class="tag dim">${esc(w)}</span>`).join('');
          html += `<tr><td><code>${esc(dice)}</code></td><td>${tags}</td></tr>`;
        } else if (list && typeof list === 'object') {
          const types = Array.isArray(list.types) ? list.types.map(t => `<span class="tag">${esc(t)}</span>`).join('') : '';
          const note = list.note ? `<div style="color: var(--text-dim); font-size: 0.85rem; margin-bottom: 4px;">${esc(list.note)}</div>` : '';
          html += `<tr><td><code>${esc(dice)}</code></td><td>${note}${types}</td></tr>`;
        } else {
          html += `<tr><td><code>${esc(dice)}</code></td><td>${esc(String(list))}</td></tr>`;
        }
      }
      html += `</tbody></table>`;
    }

    if (dam.blast_damage) {
      html += `<h3>Blast Damage</h3>`;
      html += `<table><thead><tr><th>Source</th><th style="width: 110px;">Close</th><th style="width: 110px;">Far</th></tr></thead><tbody>`;
      for (const [src, vals] of Object.entries(dam.blast_damage)) {
        const close = vals?.close ?? '';
        const far = vals?.far ?? '';
        html += `<tr><td><strong>${esc(combatKey(src))}</strong></td><td><code>${esc(String(close))}</code></td><td><code>${esc(String(far))}</code></td></tr>`;
      }
      html += `</tbody></table>`;
    }

    if (dam.damage_modifiers) {
      html += `<h3>Damage Modifiers</h3>`;
      html += renderModifierGroup(dam.damage_modifiers, 4);
    }

    html += `</details>`;
  }

  // Armor
  if (armor && armor.types) {
    html += `<details class="collapsible"><summary><h2>Armor</h2></summary>`;
    html += `<table><thead><tr><th>Type</th><th style="width: 80px;">Value</th><th>Situational</th><th>Notes</th></tr></thead><tbody>`;
    for (const [type, info] of Object.entries(armor.types)) {
      const sit = info && info.situational
        ? Object.entries(info.situational).map(([k, v]) => `<span class="tag">${esc(combatKey(k))} <strong>${esc(String(v))}</strong></span>`).join(' ')
        : '';
      html += `<tr>
        <td><strong>${esc(combatKey(type))}</strong></td>
        <td>${esc(String(info?.value ?? ''))}</td>
        <td>${sit}</td>
        <td style="color: var(--text-dim); font-size: 0.85rem;">${esc(info?.note || '')}</td>
      </tr>`;
    }
    html += `</tbody></table>`;
    html += `</details>`;
  }

  // Healing
  if (healing) {
    html += `<details class="collapsible"><summary><h2>Healing</h2></summary>`;
    html += `<table><thead><tr><th>Status</th><th>Rate</th><th>Notes</th></tr></thead><tbody>`;
    for (const [status, info] of Object.entries(healing)) {
      const notes = [info?.note, info?.requirement].filter(Boolean).join(' ');
      html += `<tr>
        <td><strong>${esc(combatKey(status))}</strong></td>
        <td>${esc(info?.rate || '')}</td>
        <td style="color: var(--text-dim); font-size: 0.85rem;">${esc(notes)}</td>
      </tr>`;
    }
    html += `</tbody></table>`;
    html += `</details>`;
  }

  // Catch-all for any unanticipated top-level keys
  const known = new Set(['basics','hit_protection','attack_procedure','attack_modifiers','damage','armor','healing']);
  for (const [k, v] of Object.entries(raw)) {
    if (known.has(k)) continue;
    html += `<details class="collapsible"><summary><h2>${esc(combatKey(k))}</h2></summary>${renderYaml(v, 1)}</details>`;
  }

  return html;
}

function renderYaml(obj, depth = 0) {
  if (obj == null) return '<em>null</em>';
  if (typeof obj === 'string') {
    return `<div style="white-space: pre-wrap;">${esc(obj)}</div>`;
  }
  if (typeof obj !== 'object') return esc(String(obj));

  if (Array.isArray(obj)) {
    if (obj.every(x => typeof x !== 'object' || x === null)) {
      return `<ul>${obj.map(x => `<li>${esc(String(x))}</li>`).join('')}</ul>`;
    }
    return obj.map(x => `<div class="card">${renderYaml(x, depth + 1)}</div>`).join('');
  }

  // Object
  const entries = Object.entries(obj);
  let html = '';
  for (const [k, v] of entries) {
    const heading = depth === 0 ? 'h2' : depth === 1 ? 'h3' : 'h3';
    if (typeof v === 'object' && v !== null) {
      html += `<${heading}>${esc(k.replace(/_/g, ' '))}</${heading}>${renderYaml(v, depth + 1)}`;
    } else {
      html += `<div class="kv"><dt>${esc(k.replace(/_/g, ' '))}</dt><dd>${esc(String(v))}</dd></div>`;
    }
  }
  return html;
}

async function viewCareer(id) {
  const c = CAREER_FILES.find(x => x.id === id);
  if (!c) return setView(`<div class="error">Unknown career: ${esc(id)}</div>`);
  setView('<div class="loading">Loading career…</div>');
  let raw;
  try { raw = await load(`../data/careers/${id}.yaml`); }
  catch (e) { return showError(e, `../data/careers/${id}.yaml`); }

  let html = '';
  html += crumbs([{ route: '#/careers', label: 'Careers' }, { label: c.label }]);
  html += `<h1 class="page-title">${esc(raw.name || c.label)}</h1>`;
  if (raw.description) html += `<p style="color: var(--text-dim);">${esc(raw.description)}</p>`;

  if (raw.qualification) html += `<h2>Qualification</h2><div class="kv"><dt>Attribute</dt><dd>${esc(raw.qualification.attribute)}</dd><dt>Target</dt><dd>${esc(raw.qualification.target)}+</dd></div>`;
  if (raw.leadership) html += `<h2>Leadership</h2><div class="kv"><dt>Attribute</dt><dd>${esc(raw.leadership.attribute)}</dd><dt>Target</dt><dd>${esc(raw.leadership.target)}+</dd></div>`;

  if (raw.skills) {
    html += `<h2>Skill Tables</h2>`;
    for (const [tableName, table] of Object.entries(raw.skills)) {
      html += `<h3>${esc(tableName.replace(/_/g, ' '))}</h3><table><thead><tr><th>Roll</th><th>Result</th></tr></thead><tbody>`;
      for (const [k, v] of Object.entries(table)) html += `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`;
      html += `</tbody></table>`;
    }
  }

  if (raw.leadership_ranks) {
    html += `<h2>Leadership Ranks</h2><table><thead><tr><th>Rank</th><th>Benefit</th></tr></thead><tbody>`;
    for (const [k, v] of Object.entries(raw.leadership_ranks)) {
      html += `<tr><td>${esc(k)}</td><td>${esc(v.benefit ?? jsyaml.dump(v))}</td></tr>`;
    }
    html += `</tbody></table>`;
  }

  if (raw.retirement) {
    html += `<h2>Retirement Benefits</h2>`;
    html += `<p style="color: var(--text-dim); margin: 0 0 10px;">Roll once on each table per term completed. Cash uses 2d6 (modifiers may push the result above 12); material uses 1d6.</p>`;
    html += `<div class="retirement-grid">`;
    if (raw.retirement.cash) {
      html += `<div><h3>Cash</h3><table><thead><tr><th>2d6</th><th>Credits</th></tr></thead><tbody>`;
      for (const [k, v] of Object.entries(raw.retirement.cash)) {
        const cell = typeof v === 'number'
          ? `<span class="unit">Cr</span>${v.toLocaleString('en-US')}`
          : esc(String(v));
        html += `<tr><td class="roll">${esc(k)}</td><td class="cash">${cell}</td></tr>`;
      }
      html += `</tbody></table></div>`;
    }
    if (raw.retirement.material) {
      html += `<div><h3>Material</h3><table><thead><tr><th>1d6</th><th>Benefit</th></tr></thead><tbody>`;
      for (const [k, v] of Object.entries(raw.retirement.material)) {
        html += `<tr><td class="roll">${esc(k)}</td><td>${esc(String(v))}</td></tr>`;
      }
      html += `</tbody></table></div>`;
    }
    html += `</div>`;
  }

  // Catch-all for additional fields
  const known = new Set(['name','description','qualification','leadership','skills','leadership_ranks','retirement']);
  const extras = Object.entries(raw).filter(([k]) => !known.has(k));
  for (const [k, v] of extras) {
    html += `<h2>${esc(k.replace(/_/g, ' '))}</h2>${renderYaml(v, 1)}`;
  }

  setView(html);
}

async function viewPrices() {
  setView('<div class="loading">Loading prices…</div>');
  let raw;
  try { raw = await load('../data/equipment/prices.yaml'); }
  catch (e) { return showError(e, '../data/equipment/prices.yaml'); }

  let html = `<h1 class="page-title">Prices &amp; Equipment</h1>`;
  html += renderPriceCategory(raw, 0);
  setView(html);
}

function renderPriceCategory(obj, depth) {
  if (obj == null) return '';
  if (Array.isArray(obj)) return renderPriceTable(obj);
  if (typeof obj !== 'object') return `<div>${esc(String(obj))}</div>`;

  let html = '';
  for (const [k, v] of Object.entries(obj)) {
    const heading = depth === 0 ? 'h2' : depth === 1 ? 'h3' : 'h4';
    const label = k.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    html += `<${heading}>${esc(label)}</${heading}>`;
    html += renderPriceCategory(v, depth + 1);
  }
  return html;
}

const PRICE_COL_ORDER = ['name','skill_level','damage','value','cost','cost_min','cost_max','cost_ratio','ammo_cost','shell_cost','annual','unit','situational','note'];
const PRICE_COL_LABELS = {
  name: 'Item',
  skill_level: 'Skill Level',
  cost: 'Cost',
  cost_min: 'Min',
  cost_max: 'Max',
  cost_ratio: 'Cost Ratio',
  ammo_cost: 'Ammo Cost',
  shell_cost: 'Shell Cost',
  annual: 'Annual',
  unit: 'Unit',
  damage: 'Damage',
  value: 'Value',
  situational: 'Situational',
  note: 'Note'
};

function renderPriceTable(rows) {
  if (!rows.length) return '';
  // Non-object rows (e.g. simple strings) — fall back to a list
  if (rows.some(r => typeof r !== 'object' || r === null)) {
    return `<ul>${rows.map(r => `<li>${esc(String(r))}</li>`).join('')}</ul>`;
  }
  // Union of keys present in any row
  const keysPresent = new Set();
  for (const r of rows) for (const k of Object.keys(r)) keysPresent.add(k);

  // Build column list: known order first, then anything else.
  // Collapse cost / cost_min / cost_max into a single virtual "Cost" column.
  const hasCost = keysPresent.has('cost') || keysPresent.has('cost_min') || keysPresent.has('cost_max');
  const skip = new Set(['cost', 'cost_min', 'cost_max']);
  const cols = [];
  for (const k of PRICE_COL_ORDER) {
    if (skip.has(k)) continue;
    if (k === 'name') {
      if (keysPresent.has('name')) cols.push('name');
      if (hasCost) cols.push('Cost');
      continue;
    }
    if (keysPresent.has(k)) cols.push(k);
  }
  // Anything not yet covered
  for (const k of keysPresent) {
    if (!skip.has(k) && !cols.includes(k)) cols.push(k);
  }
  if (hasCost && !cols.includes('Cost')) cols.unshift('Cost');

  const labelOf = k => PRICE_COL_LABELS[k] || k.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

  const cellOf = (row, k) => {
    if (k === 'Cost') {
      if (row.cost != null) return esc(row.cost);
      if (row.cost_min != null && row.cost_max != null) return `${esc(row.cost_min)}–${esc(row.cost_max)}`;
      if (row.cost_min != null) return `${esc(row.cost_min)}+`;
      if (row.cost_max != null) return `≤${esc(row.cost_max)}`;
      return '';
    }
    const v = row[k];
    if (v == null) return '';
    if (typeof v === 'object') return esc(jsyaml.dump(v).trim());
    return esc(String(v));
  };

  let html = `<table class="prices-table"><thead><tr>${cols.map(c => `<th>${esc(labelOf(c))}</th>`).join('')}</tr></thead><tbody>`;
  for (const r of rows) {
    html += `<tr>${cols.map(c => `<td>${cellOf(r, c)}</td>`).join('')}</tr>`;
  }
  html += `</tbody></table>`;
  return html;
}

async function viewRefsIndex() {
  let html = `<h1 class="page-title">Reference Documents</h1>`;
  html += `<p style="color: var(--text-dim); margin-bottom: 12px;">Original markdown source materials from the GM's Discord.</p>`;
  html += `<div class="card-grid">`;
  for (const r of REFERENCES) {
    html += `<div class="card"><h3><a href="#/refs/${r.id}">${esc(r.label)}</a></h3></div>`;
  }
  html += `</div>`;
  setView(html);
}

async function viewRef(id) {
  const r = REFERENCES.find(x => x.id === id);
  if (!r) return setView(`<div class="error">Unknown reference: ${esc(id)}</div>`);
  return viewMarkdown(`../references/${id}.md`, r.label, [
    { route: '#/refs', label: 'References' },
    { label: r.label }
  ], { preprocess: preprocessReferenceMd });
}

// References were copy-pasted from Discord and don't use markdown heading syntax.
// Promote heading-like lines to ## and tag UWP codes as inline code.
function preprocessReferenceMd(text) {
  const isUWP = s => /^[A-EX]-?[A-Za-z0-9]{2,}(-[A-Za-z0-9]+)+$/.test(s)
                  || /^\[[A-EX]+\][- ]/.test(s);
  const lines = text.split('\n');
  const out = [];
  // Skip the first non-blank line — that's the document title and we render it
  // separately as the page title.
  let titleSkipped = false;

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const trimmed = line.trim();
    const prev = i > 0 ? lines[i - 1].trim() : '';
    const next = i < lines.length - 1 ? lines[i + 1].trim() : '';

    if (!trimmed) { out.push(line); continue; }
    if (/^#{1,6}\s/.test(trimmed)) { out.push(line); continue; }

    if (!titleSkipped) {
      titleSkipped = true;
      // Drop it — page title already shows the document title
      continue;
    }

    if (isUWP(trimmed)) {
      out.push('`' + trimmed + '`');
      continue;
    }

    const isShort = trimmed.length <= 60;
    const noTrailingPunct = !/[.!?:;]$/.test(trimmed);
    const noTrailingComma = !/,$/.test(trimmed);
    const hasLetters = /[a-zA-Z]/.test(trimmed);
    const prevBlank = prev === '';
    const nextHasContent = next.length > 0;

    if (isShort && noTrailingPunct && noTrailingComma && hasLetters && prevBlank && nextHasContent) {
      out.push('## ' + trimmed);
    } else if (isShort && /,$/.test(trimmed) && prevBlank && nextHasContent) {
      // The "world-profiles-how-to.md" file uses "Heading," with a trailing comma
      out.push('## ' + trimmed.replace(/,$/, ''));
    } else {
      out.push(line);
    }
  }
  return out.join('\n');
}

async function viewDoc(path) {
  return viewMarkdown(path, path.split('/').pop(), [
    { route: '#/', label: 'Home' },
    { label: path.split('/').pop() }
  ]);
}

// =========================================================================
// Router
// =========================================================================

async function route() {
  const hash = location.hash.replace(/^#/, '') || '/';
  const parts = hash.split('/').filter(Boolean);
  highlightNav();
  window.scrollTo(0, 0);

  try {
    if (parts.length === 0) return await viewHome();

    switch (parts[0]) {
      case 'sessions':
        if (parts.length === 1) return await viewSessions();
        return await viewSession(parts[1]);
      case 'investigation':
        return await viewInvestigation();
      case 'timeline':
        return await viewTimeline();
      case 'npcs':
        return await viewNPCs();
      case 'worlds':
        if (parts.length === 1) return await viewWorlds();
        return await viewWorld(parts[1]);
      case 'party':
        return await viewParty();
      case 'ships':
        return await viewShips();
      case 'assets':
        return await viewAssets();
      case 'rules':
        if (parts.length === 1) return await viewRulesIndex();
        return await viewRule(parts[1]);
      case 'careers':
        if (parts.length === 1) return await viewCareersIndex();
        return await viewCareer(parts[1]);
      case 'prices':
        return await viewPrices();
      case 'refs':
        if (parts.length === 1) return await viewRefsIndex();
        return await viewRef(parts[1]);
      case 'doc':
        return await viewDoc(decodeURIComponent(parts.slice(1).join('/')));
      default:
        setView(`<div class="error">Unknown route: <code>${esc(hash)}</code></div>`);
    }
  } catch (e) {
    showError(e);
  }
}

// Init
// =========================================================================

renderNav();

// Palette cycle: phosphor → starchart → dossier → phosphor
(function setupPaletteToggle() {
  const PALETTES = ['phosphor', 'starchart', 'dossier'];
  const btn = document.getElementById('palette-toggle');
  if (!btn) return;
  const current = () => document.documentElement.dataset.palette || 'phosphor';
  const apply = (p) => {
    document.documentElement.dataset.palette = p;
    try { localStorage.setItem('ts-palette', p); } catch (e) {}
    btn.dataset.active = p;
  };
  apply(current());
  btn.addEventListener('click', () => {
    const next = PALETTES[(PALETTES.indexOf(current()) + 1) % PALETTES.length];
    apply(next);
  });
})();

// Mobile sidebar toggle
(function setupMobileNav() {
  const btn = document.getElementById('menu-toggle');
  const backdrop = document.getElementById('sidebar-backdrop');
  const close = () => {
    document.body.classList.remove('sidebar-open');
    btn.setAttribute('aria-expanded', 'false');
  };
  btn.addEventListener('click', () => {
    const open = document.body.classList.toggle('sidebar-open');
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  backdrop.addEventListener('click', close);
  // Close when a nav link is clicked
  document.getElementById('nav').addEventListener('click', e => {
    if (e.target.closest('a')) close();
  });
})();

window.addEventListener('hashchange', route);
route();

(function setupScrollTop() {
  const btn = document.getElementById('scroll-top');
  if (!btn) return;
  const THRESHOLD = 400;
  let ticking = false;
  function update() {
    btn.classList.toggle('visible', window.scrollY > THRESHOLD);
    ticking = false;
  }
  window.addEventListener('scroll', () => {
    if (!ticking) { requestAnimationFrame(update); ticking = true; }
  }, { passive: true });
  btn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
  update();
})();
</script>
