<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traveller Stephanus - Campaign Viewer</title>
<script>
  // Apply saved palette before stylesheets evaluate, to avoid flash-of-default.
  // This MUST stay inline and synchronous — moving it to an external file would
  // delay execution past first paint, defeating its purpose.
  try {
    var p = localStorage.getItem('ts-palette');
    if (p === 'phosphor' || p === 'starchart' || p === 'dossier') {
      document.documentElement.dataset.palette = p;
    }
    var f = localStorage.getItem('ts-font');
    if (f === 'reg' || f === 'lrg' || f === 'xlrg') {
      document.documentElement.dataset.font = f;
    }
  } catch (e) {}
</script>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="css/content.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/timeline.css">
</head>
<body>

<button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
<div class="sidebar-backdrop" id="sidebar-backdrop"></div>

<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <a class="home" href="./" aria-label="Return to campaign home">
        <div class="title">TRAVELLER STEPHANUS</div>
        <div class="subtitle">Campaign Viewer</div>
      </a>
      <button class="palette-toggle" id="palette-toggle" type="button"
              aria-label="Cycle color palette" title="Cycle color palette">
        <span class="dot" data-p="phosphor"></span>
        <span class="dot" data-p="starchart"></span>
        <span class="dot" data-p="dossier"></span>
      </button>
      <br>
      <button class="font-toggle" id="font-toggle" type="button"
              aria-label="Cycle font size" title="Cycle font size">
        Font: <span class="font-label">Default</span>
      </button>
    </div>
    <nav id="nav"></nav>
  </aside>

  <main class="content">
    <div id="view"><div class="loading">Loading…</div></div>
  </main>
</div>

<button class="scroll-top" id="scroll-top" type="button" aria-label="Scroll to top" title="Back to top">
  <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M5 12l5-5 5 5"/>
  </svg>
</button>

<!-- External libraries -->
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>

<!-- Shared chrome (nav, palette, font, mobile drawer, scroll-top) -->
<script src="site.js"></script>

<!-- Index app: manifests, helpers, then per-route view modules, then router.
     Order matters — later modules depend on earlier ones (no ES module
     boundaries; everything shares the global scope). -->
<script src="js/data.js"></script>
<script src="js/util.js"></script>
<script src="js/views/campaign.js"></script>
<script src="js/views/worlds.js"></script>
<script src="js/views/party.js"></script>
<script src="js/views/rules.js"></script>
<script src="js/views/careers.js"></script>
<script src="js/views/prices.js"></script>
<script src="js/views/refs.js"></script>
<script src="js/router.js"></script>
</body>
</html>
