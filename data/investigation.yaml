# Investigation Tracker - Traveller Stephanus Campaign
# Centralized tracking for mission objectives, leads, and intelligence

# =============================================================================
# PRIMARY MISSION
# =============================================================================
primary_mission:
  name: "Recovery of the Ithian Death Mask"
  client: Jade Front
  contact: Kyle Newhouse
  assigned: Session 2
  status: active
  objective: |
    Recover the sacred Ithian death mask and return it to Ith. Success would
    provide the Jade Front a massive propaganda coup against the Quiru-Newhall
    alliance, potentially securing a political alliance with Ith.

# =============================================================================
# CHAIN OF CUSTODY (What we know about the mask's history)
# =============================================================================
chain_of_custody:
  - period: "~71 years ago (end of 2nd Agretic War)"
    event: "Mask found at-and subsequently stolen from-Mora antiquities market"
    source: Kyle Newhouse briefing (Session 2)

  - period: "Post-theft, unknown duration"
    event: "Mask appears in collection of Keith Sevont, a soldier from Newhall"
    source: Kyle Newhouse briefing (Session 2)

  - period: "After Sevont's death"
    event: "Descendants contact Ithian Cultural Ministry to arrange repatriation"
    source: Kyle Newhouse briefing (Session 2)

  - period: "Before transfer completed"
    event: "Mask disappears again"
    source: Kyle Newhouse briefing (Session 2)

  - period: "Recent (before campaign start)"
    event: "Journalist Choophong Thanatkha breaks story about the theft"
    source: Kyle Newhouse briefing (Session 2)

  - period: "Current"
    event: "Location unknown. Multiple factions racing to recover it."
    source: Party investigation

# =============================================================================
# ACTIVE LEADS
# =============================================================================
active_leads:

  - name: "Choophong Thanatkha (Choo)"
    priority: high
    status: in_progress
    description: |
      Stoybeni investigative journalist who broke the death mask story.
      Was working on Mora. Missing for 3+ months.
    action_required: "Find Choo or determine what happened to them. Investigate Pardeep Sarsar's disappearance."
    established: Session 2
    last_update: Session 6
    notes: |
      Session 5: Editor Doné Rivis worried about disappearance. Rivis has no knowledge
      of Choo's story or current whereabouts. Dispatch mainframe hack failed.
      Session 6: Rivis revealed Pardeep Sarsar as Choo's trusted lieutenant and courier.
      Sarsar is also missing - family has no sign or recent communication.
      Two missing people connected to the same story is a pattern.

  - name: "Iron Commerce 18 / al-Thani Connection"
    priority: medium
    status: stalled
    description: |
      300-ton tramp freighter with al-Thani crew (confirmed via psychic viewing).
      Falsified cargo manifest (claimed pharmaceuticals and manufacturing drones).
      Took on 20 tons fuel at Ith, did no trade, no one disembarked.
    action_required: "Track destination; investigate al-Thani involvement"
    established: Session 3
    notes: |
      Customs inspector Angus Graham (bribed by IC18 crew) said their "friends"
      were bound for "home." Crew wore typical Thane garb: all black, faces covered.
      Possible destination: al-Thani homeworld?

  - name: "Cooper-Akachi Operatives"
    priority: medium
    status: monitoring
    description: |
      Street-level intel indicates Cooper-Akachi dispatched an elite team
      of operatives to Mora in pursuit of the mask.
    action_required: "Monitor; avoid or neutralize if encountered"
    established: Session 3 (Petra's intel)
    notes: |
      Possible connection to al-Thani? Both headed toward Mora region.

  - name: "Rivis Job - Deliver Message to Kara Wiley on Thane"
    priority: medium
    status: deferred
    description: |
      Rivis offered 40k Cr up front, 80k Cr on completion to deliver an encrypted
      message to Kara Wiley, an undercover reporter embedded in a political family
      on Thane.
    action_required: "Return to this job - party went directly to Mowebe without stopping at Thane."
    established: Session 6
    notes: |
      Party bypassed Thane en route to Mowebe (Sessions 8–9). Job not accepted or declined -
      simply not pursued. Total payout: 120k Cr. Would need to revisit Thane to complete.

  - name: "Maitz Space Battle Investigation"
    priority: high
    status: in_progress
    description: |
      Border skirmishes reported in the outer bounds of Maitz between Quiru and Newhall
      (Campaign Week 12, per Faisal al-Amin's Thane debrief). The party arrived in Session 13.
    action_required: "Wind down on-site work at Maitz; continue threads (Bunny, Deepest Light, Cooper-Akachi) from elsewhere."
    established: Session 12
    last_update: Session 15
    notes: |
      Intel from Faisal al-Amin (Wk 12 report). Ship counts from the engagement:
      QUIRU - Big: 1, Medium: 3 (2 disabled), Small: 1 (1 disabled)
      NEWHALL - Big: 2 (1 disabled), Medium: 1, Small: 6 (2 disabled)
      Session 13: Arrived in Maitz. Surveyed 6 wrecks around the sole gas giant
      (2 are debris fields). Named hulls: Revenant's Echo (largest), Star of Carella
      (Newhall, looted), Adamant, Savage Intent. (S13 also listed Deepest Light here;
      Session 14 corrected this - see below.) Star of Carella stripped: data slabs
      + 2x 10 dT shuttlecraft + 16 tons Rx, plus siphoned fuel. "Cry baby cry"
      diversion staged aboard.
      Session 14: Boarded Savage Intent (Quiru, 400 t, mostly intact) and Revenant's
      Echo (largest Newhall casualty). Savage Intent sabotage pattern: bridge-door
      grenade, computer destruction, Cooper-Akachi-parts bomb on the jump drive
      (disarmed by Samir). Black box decoded: Savage Intent laid in wait behind a
      moon, intercepted a gas-skimming target - used to launch the extraction of
      a person codenamed Bunny from the Newhall scout Deepest Light. Revenant's
      Echo captain's combat logs partially spliced: full Newhall battle roster
      recovered; Deepest Light never named; multiple references to Bunny; retreat
      ordered after Bunny was "taken" and "lost." Confirmed via two of Victor's
      hindsight viewings that Quiru marines extracted Bunny from the Deepest Light
      and that the Deepest Light itself was never at the gas-giant field on the
      party's arrival (presumed Quiru-captured along with Bunny). Newhall and
      Quiru - publicly allies - fought a covert fleet-scale engagement over Bunny.
      Session 15: Continued Revenant's Echo boarding - partial fleet-coordination
      records confirmed Newhall was AMBUSHED by Quiru while pursuing Bunny (not
      just a covert mutual fight). Vacuum-adapted squid-like organisms inhabit
      the Echo's power core; forced retreat. Intercepted a Cooper-Akachi
      surveillance buoy launching for planet Maitz - see the
      "Party's Ship Signature Compromised" lead and `coop-ak-buoy-found` /
      `coop-ak-buoy-timeline` / `party-ship-signature-leaked` key_intel.
      Savage Intent confirmed operable; party departing Maitz with both ships
      bound for Stoyben (Adamant left unboarded; investigation winds down on-site).

  - name: "Decode Star of Carella Encrypted Files"
    priority: high
    status: in_progress
    description: |
      Thousands of short, encrypted files recovered from Star of Carella storage crystals.
      Span an 8-hour window starting the minute Star of Carella arrived in Maitz, ending
      abruptly. Believed to be battle logs / comms traffic. Higher-grade encryption used.
    action_required: "Decrypt files. Identify content (battle logs? command traffic?)."
    established: Session 13
    notes: |
      Already decrypted: orders dispatching Star of Carella from Tivid to Maitz ASAP to
      "support operations" - capture or destroy the Newhall scout Deepest Light.
      Orders unsigned, Priority 1. Higher-grade security suggests command-level traffic.

  - name: "Locate the Deepest Light"
    priority: high
    status: in_progress
    description: |
      Newhall 100 dT scout ship that was the Priority 1 target of Star of Carella's
      capture-or-destroy orders. Session 14 reframed the picture: the Deepest Light
      was not at the gas-giant debris field on the party's arrival, and was never
      seen by the crew in real time (only via Victor's hindsight on the Revenant's
      Echo). Presumed extracted from the battlefield by Quiru along with Bunny.
    action_required: |
      Track the Deepest Light from Maitz. Most likely went with Quiru after the
      Bunny extraction.
    established: Session 13
    last_update: Session 14
    notes: |
      What the Deepest Light was carrying is now known to be a person codenamed
      Bunny (see lead "Recover Bunny"). The S13 entry for a wreck named "Deepest
      Light" in the gas-giant debris field was incorrect; the actual Deepest Light
      had already left the battlefield before the party arrived.

  - name: "Board Other Maitz Wrecks"
    priority: medium
    status: in_progress
    description: |
      Session 14: Savage Intent (Quiru) and Revenant's Echo boarded. Adamant
      remains the last named wreck at the gas-giant field. (Deepest Light was
      not at Maitz when the party arrived - removed from this list; see the
      "Locate the Deepest Light" lead.)
    action_required: "Board Adamant. Decide whether to seize the Savage Intent (jump-capable with skeleton crew)."
    established: Session 13
    last_update: Session 14
    notes: |
      "Cry baby cry" diversion left aboard Star of Carella - should buy time before any
      response party arrives.

  - name: "Missing Book from Star of Carella Captain's Bookshelf"
    priority: low
    status: open
    description: |
      Captain's stateroom search turned up only one anomaly: a missing book from the
      bookshelf. Nothing else out of the ordinary.
    action_required: "Note for follow-up. May indicate the captain (or someone) hid or removed something significant."
    established: Session 13
    notes: |
      Physical paper books in a captain's stateroom are unusual enough to be personally
      meaningful. The missing one could be: hidden, smuggled out, or used as a hollowed
      cache. No way to know what title without external info.

  - name: "Cooper-Akachi / Solal Connection"
    priority: medium
    status: in_progress
    description: |
      Jassem Solal's schedule contained a suspicious number of meetings with
      Cooper-Akachi Diversified Industries representatives.
    action_required: "Investigate the nature of Solal's business with Cooper-Akachi"
    established: Session 10
    notes: |
      Discovered via estate server hack (Session 10). Cooper-Akachi is already known
      to have dispatched elite operatives to Mora (Session 3 intel). The Solal connection
      may be relevant to the mask investigation - Cooper-Akachi's interest in Solal, a
      wealthy Thani noble, is unexplained.

  - name: "Rivis Job - Check on Choo's Wellbeing on Mora"
    priority: medium
    status: available
    description: |
      Rivis offered 10k Cr up front, 25k Cr on completion to check on Choophong
      Thanatkha's wellbeing on Mora.
    action_required: "Accept or decline. If accepted, travel to Mora and investigate."
    established: Session 6
    notes: |
      Aligns with party's existing Choo investigation lead. Total payout: 35k Cr.
      Mora is further afield - would require significant travel beyond current plans.

  - name: "Recover Bunny (Quiru custody)"
    priority: critical
    status: in_progress
    description: |
      Bunny is a person - codename, not a real name - extracted from the Newhall
      scout Deepest Light by Quiru marines off the Savage Intent during the Maitz
      engagement. Currently presumed in Quiru custody; location unknown. Both
      Quiru and Newhall went to fleet engagement over Bunny.
    action_required: |
      Determine where Quiru took Bunny. Identify Bunny if possible. Assess whether
      recovery is feasible.
    established: Session 14
    notes: |
      Confirmed via two of Victor's hindsight viewings on the Revenant's Echo
      bridge - captain's-chair retreat order ("Bunny taken and lost") and sensor
      record showing Quiru marines extracting a human from a 100 dT scout with
      the Savage Intent in background. Bunny is the operational reason for the
      entire Maitz engagement; whoever Bunny is, they were worth a fleet-scale
      fight between supposed allies.

  - name: "Newhall–Quiru Covert Fight at Maitz"
    priority: high
    status: in_progress
    description: |
      Newhall and Quiru are publicly allied, yet fought a covert fleet-scale
      engagement at Maitz over Bunny in a sparse, low-witness system. Session
      15 reframed this: partial fleet-coordination records on the Revenant's
      Echo show Newhall was AMBUSHED by Quiru - not a mutual covert fight,
      a one-sided ambush by putative allies.
    action_required: "Probe for the political/strategic rift between Newhall and Quiru. Watch for cover-ups of the Maitz engagement."
    established: Session 14
    last_update: Session 15
    notes: |
      Aligns with Faisal al-Amin's prior framing of the Maitz incident as a
      "border skirmish" (`maitz-skirmish-wk12`) - but Session 14 evidence
      showed the engagement was about Bunny specifically, not territorial.
      Session 15 evidence (Revenant's Echo captain's-chair records) shows
      it was a deliberate Quiru ambush of a Newhall force in pursuit of
      Bunny. See `revenant-echo-records-quiru-ambush`.

  - name: "Cooper-Akachi Involvement at Maitz"
    priority: high
    status: in_progress
    description: |
      Cooper-Akachi presence at or after Maitz is now corroborated from two
      independent pieces of physical evidence: (1) high-end Coop-Ak parts in
      the Savage Intent's jump-drive bomb (Session 14, disarmed by Samir);
      and (2) a Cooper-Akachi-branded surveillance buoy intercepted at the
      battlefield (Session 15) - deployed Wk 18 by a Coop-Ak ship, with full
      decoded logs of all subsequent battlefield activity.
    action_required: |
      Cross-reference with the Wk 10 Thane-transit Coop-Ak commandos
      (`coop-ak-thane-wk10`) and the broader Solal / Coop-Ak thread. Confirm
      whether Coop-Ak is operating with Quiru, with Newhall, or against both.
    established: Session 14
    last_update: Session 15
    notes: |
      First piece of direct material evidence for Coop-Ak activity tied to the
      Maitz operation (Session 14) - confirms William's earlier speculation.
      Session 15: A second piece of evidence - the Cooper-Akachi surveillance
      buoy intercepted at the battlefield. Buoy was deployed Wk 18 by a Coop-Ak
      ship and surveilled the battlefield through Session 15, transmitting the
      party's ship signature toward Maitz before exhausting fuel. See
      `coop-ak-buoy-found`, `coop-ak-buoy-timeline`, `party-ship-signature-leaked`.

  - name: "Party's Ship Signature Compromised"
    priority: high
    status: in_progress
    description: |
      The Cooper-Akachi surveillance buoy intercepted at Maitz emitted a
      directional radio burst toward the planet Maitz, transmitting VoL II's
      transponder code and physical description, just before exhausting fuel.
      An unknown party on Maitz (most likely Cooper-Akachi) now has the
      party's ship signature; that information will eventually spread.
    action_required: |
      Stay ahead of the spread. The crew's emerging operational answer
      (per S15 council) is to sell the Savage Intent at Stoyben and swap
      to a new ship - but that's a future action, not an investigation lead.
    established: Session 15
    notes: |
      See `party-ship-signature-leaked` for the underlying intel.

# =============================================================================
# RESOLVED LEADS
# =============================================================================
resolved_leads:

  - name: "JF Intelligence Operative (Faisal al-Amin)"
    priority: high
    status: resolved
    description: |
      Jade Front operative dispatched on intelligence-gathering circuit:
      Ith → Mowebe → Thane (2 months listening for Mora updates) → Mowebe
    action_required: null
    established: Session 4
    resolved: Session 12
    notes: |
      Traveling via middle passage tickets. Gathered intel filtering back from Mora.
      Session 12: Made contact at lunar JF depot. Identified as Faisal al-Amin.
      Full debriefing recorded under Key Intel - see "Coop-Ak commandos through Thane (Wk 10)"
      and "Quiru-Newhall border skirmish at Maitz (Wk 12)".

  - name: "Ugrik Weapons Delivery"
    priority: low
    status: resolved
    description: |
      JF station chief Isaiah Reed noted the Front needs weapons on Ugrik.
      Party currently has 16.5 tons of weapons cargo.
    action_required: null
    established: Session 5
    last_update: Session 6
    notes: |
      Weapons traded directly to Isaiah Reed on Stoyben (Session 6).

  - name: "JF Operation - O'Neill Cylinder (Torin's Hard Drive)"
    priority: high
    status: resolved_partial
    description: |
      Official Jade Front job from Isaiah Reed. JF agent "Alicia" (now burned) spent months
      grooming Civic Administrator Torin's wife Vondel to download Torin's work computer hard drive.
    action_required: null
    established: Session 7
    resolved: Session 8
    notes: |
      Session 8: Arvi murdered Torin to free Vondel from abuse. Party extracted Vondel and fled.
      Hard drive from Torin's work computer was NEVER obtained.
      Vondel's behavioral shift explained: she and Arvi had their own plan forming.
      Tevetz was genuinely helping Vondel in good faith (not scheming).
      Political fallout from Torin's murder was significant. Isaiah Reed paid more for Vondel's
      full-system exfiltration and cut the party's pay, but issued a positive letter of recommendation.

