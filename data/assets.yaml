# =============================================================================
ships:

  - name: "Voice of Liberation II"
    type: Smuggling Vessel
    owner: Jade Front (on loan to party)
    acquired: "Session 2"
    status: operational
    notes: |
      Formerly captured by pirates and held at Kath starport. Party liberated
      it through blackmail. Scrubbed of spy devices. Has a hidden smuggling
      compartment the pirates missed.

      Session 5: Refit in progress at Stoyben shipyard (fuel tanks).
      Baron Harrow used his influence to secure immediate slot.
      Session 6: Two middle passengers aboard. Trade goods available.
      Session 7: Ship retrofit (jump fuel pods) completed.
      Session 12: Fired all 4 missiles (area denial airburst) during Mowebe intercept.
      Both fighter-interceptors destroyed. Misjump on departure — Oort cloud deviation,
      powerplant damaged. Van Leeuwen and Corinne Page repaired powerplant at JF depot.
      Missiles and fuel fully restocked. Currently en route to Maitz.
      Session 13: Jumped to Maitz. Refueled by siphoning from the Star of Carella wreck
      (fuel 2/2 maintained). Two looted 10 dT shuttlecraft and 16 tons of Rx loaded into
      cargo bay (manufactured trade goods dumped to make room).

    frame:
      tonnage: 200
      hull_hp: 20
      hull_current: 20
      cargo_capacity: 25  # tons
      hanger_capacity: 20  # tons

    systems:
      impulse: 1
      jump: 1
      shields: 1
      pulse_lasers: 1
      missiles:
        rating: 1
        loaded: 4  # restocked Session 12
      anti_missiles:
        rating: 4d6
        count: 2  # acquired Session 12 from Kikonye's weapons depot

    amenities:
      staterooms:
        rating: 4
        capacity: 8  # persons
      barracks:
        rating: 1
        capacity: 5  # marines
      low_berths:
        rating: 1
        capacity: 6  # persons
      smuggling_compartment:
        rating: 1
        notes: Hidden compartment, pirates didn't find it

    crew:
      # Crew positions and assignments TBD
      captain: null
      pilot: null
      engineer: null
      gunner: null
      steward: null
      medic: null
      marines: []

    passengers:
      - name: Petra
        role: Jade Front contact
        boarded: "Session 3"
        notes: Provided intel on Cooper-Akachi operatives
      - name: Samir
        role: Jade Front contact
        boarded: "Session 3"
        notes: null
      # Middle passengers (Sessions 6–8) disembarked at Mowebe

    cargo:
      manifest:
        - item: "Looted shuttlecraft (10 dT)"
          quantity: 2
          source: "Star of Carella wreck (Session 13)"
          notes: "Stowed in VoL II cargo bay. 16 tons Rx split across them as storage."
        - item: "Pharmaceuticals (Rx)"
          tons: 16
          source: "Star of Carella wreck (Session 13)"
          notes: "Split across the two looted shuttles in cargo. Origin/value TBD."
      # Electronics components + chemicals sold at Mowebe manufactories (Session 9, broke even)
      # Manufactured trade goods (taken on at Mowebe pre-Maitz jump) dumped Session 13 to make room.

    damage_log:
