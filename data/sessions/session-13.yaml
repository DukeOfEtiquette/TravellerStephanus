session:
  number: 13
  date: 2026-05-01
  recap: |
    The crew resupplied, rearranged their stocks, and finally jumped to Maitz.

    On arrival, they decided to first investigate the debris and derelict vessels
    around the sole gas giant. They found six wrecks, but two were little more
    than debris fields.

    The crew set an intention to explore the largest derelict, the Revenant's Echo,
    but decided to first set a "cry baby cry" diversion on a smaller Newhall ship,
    the Star of Carella.

    Onboard, they looted the physical storage media from the bridge and computer
    room, carefully searched the captain's stateroom (where they discovered only a
    missing book from a bookshelf out of the ordinary), siphoned fuel to refill
    their tanks, looted two full 10 dTon shuttlecraft, and set up their "cry baby
    cry."

    On the decrypted storage crystals, they found orders for the Star from Tivid
    to Maitz to intercept a fleeing Newhall ship, a 100 dT scout ship called the
    Deepest Light. Their unsigned orders - marked Priority 1 - ordered them to
    capture or, if that was not feasible, destroy the Deepest Light.

    The crystals also contained thousands of short, encrypted files that started
    the minute that the Star of Carella arrived in Maitz, and ended abruptly
    eight hours later. (The crew hasn't yet decoded any of these transmissions.)

    Day: 24.2
    Kitty: 93,850 Cr
    Ship Fuel: 2/2

  narrative_events:
    - week: 12.0
      title: "Star of Carella issued Priority 1 orders for Deepest Light"
      description: |
        Unsigned orders from Tivid to Maitz: capture - or if not feasible,
        destroy - the Newhall scout Deepest Light. Marked Priority 1.
        (Recovered from Star of Carella storage crystals decrypted Wk 24.1.)
    - week: 12.0
      title: "Eight hours of encrypted comm traffic generated at Maitz"
      description: |
        Thousands of short, high-grade encrypted files spanning the window
        from Star of Carella's arrival at Maitz until 8 hours later -
        believed to be battle logs and/or command comms. (Storage crystals
        recovered Wk 24.1; comms not yet decoded.)
      location: "Star of Carella, Maitz"

  crew_events:
    - week: 19.5
      title: "Resupplied and jumped to Maitz"
      description: "Resupplied at Mowebe JF lunar depot; rearranged stocks; jumped."
    - week: 23.0
      title: "Surveyed the gas-giant debris field; identified six wrecks"
      description: |
        Six wrecks surveyed (two are little more than debris fields):
        Revenant's Echo (largest), Star of Carella (Newhall), Adamant,
        Savage Intent, Deepest Light (Newhall, 100 dT scout), plus an
        unidentified debris field. Settled on the Revenant's Echo as
        primary target - but staged a diversion first.
      location: "Maitz, gas giant"
    - week: 24.0
      title: "Looted the Star of Carella"
      description: |
        Took physical storage media from the bridge and computer room,
        carefully searched the captain's stateroom (the sole anomaly was
        a single book missing from the bookshelf), siphoned fuel to refill
        VoL II (2/2), and seized two 10 dTon shuttlecraft and 16 tons of
        Rx.
      location: "Star of Carella, Maitz"
    - week: 24.0
      title: "Staged 'cry baby cry' diversion on Star of Carella"
      description: |
        Set up a draw to pull attention to Star of Carella before exploring
        the Revenant's Echo.
    - week: 24.1
      title: "Decrypted Star of Carella Priority 1 orders"
      description: |
        Cracked the bridge/comp-room storage media. Revealed unsigned orders
        from Tivid: capture or destroy the Newhall scout Deepest Light.
    - week: 24.1
      title: "Recovered 8h of Maitz comm traffic on storage crystals"
      description: |
        Thousands of short, high-grade encrypted files spanning Star of
        Carella's arrival at Maitz through 8 hours later. None yet decoded.

