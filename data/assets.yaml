# SHIPS
# =============================================================================
ships:

  - name: "Voice of Liberation II"
    type: Smuggling Vessel
    owner: Jade Front (on loan to party)
    acquired: "Session 2"
    status: operational

    description: |
      Formerly captured by pirates and held at Kath starport. Party liberated
      it through blackmail. Scrubbed of spy devices. Has a hidden smuggling
      compartment the pirates missed.

    frame:
      tonnage: 200
      hull_hp: 20
      hull_current: 20
      cargo_capacity: 25   # tons
      hanger_capacity: 20  # tons

    systems:
      impulse: 1
      jump: 1
      shields: 1
      pulse_lasers: 1
      missiles:
        rating: 1
        loaded: 4
      anti_missiles:
        rating: 4d6
        count: 2

    amenities:
      staterooms:    { rating: 4, capacity: 8 }  # persons
      barracks:      { rating: 1, capacity: 5 }  # marines
      low_berths:    { rating: 1, capacity: 6 }  # persons
      smuggling_compartment:
        rating: 1
        notes: Hidden compartment, pirates didn't find it

    crew:
      captain: null
      pilot: null
      engineer: null
      gunner: null
      steward: null
      medic: null
      marines: []

    passengers:
      - name: Petra
        role: Jade Front contact
        boarded: "Session 3"
        notes: Provided intel on Cooper-Akachi operatives
      - name: Samir
        role: Jade Front contact
        boarded: "Session 3"

    cargo:
      - item: "Looted 10 dT shuttlecraft"
        count: 2
        tons: 20
        source: "Star of Carella wreck (Session 13)"
        notes: "Holding the 16 tons of Rx below as internal storage."
      - item: "Pharmaceuticals (Rx)"
        tons: 16
        source: "Star of Carella wreck (Session 13)"
        notes: "Stowed inside the two looted shuttles. Origin/value TBD."

    history:
      - session: 5
        event: "Refit at Stoyben shipyard (fuel tanks); Baron Harrow secured an immediate slot."
      - session: 6
        event: "Took on two middle passengers and trade goods."
      - session: 7
        event: "Jump fuel pod retrofit completed."
      - session: 9
        event: "Electronics + chemicals sold at Mowebe manufactories (broke even)."
      - session: 12
        event: |
          Mowebe intercept: fired all 4 missiles (area-denial airburst); both
          fighter-interceptors destroyed. Misjump on departure caused Oort cloud
          deviation and powerplant damage. Van Leeuwen and Corinne Page repaired
          at the JF lunar depot. Missiles and fuel fully restocked. Acquired 2
          anti-missile launchers from Kikonye's weapons depot.
      - session: 13
        event: |
          Jumped to Maitz; refueled by siphoning the Star of Carella wreck
          (fuel 2/2 maintained). Loaded 2× 10 dT looted shuttlecraft and 16 tons
          of Rx; manufactured trade goods dumped to make room.

    damage_log:
      - session: 12
        damage: "Powerplant damaged during misjump into Oort cloud"
        repaired: true
        repaired_by: "Van Leeuwen and Corinne Page at lunar JF depot"

# =============================================================================
# RECOVERED INTELLIGENCE / DATA
# =============================================================================
recovered_data:
  - source: "Star of Carella (Newhall) — Session 13"
    items:
      - description: "Decrypted orders: Tivid → Maitz, Priority 1, capture or destroy Newhall scout Deepest Light"
        status: decoded
        notes: "Unsigned. Higher-grade encryption used. Suggests command-level traffic with deniability."
      - description: "Thousands of short, encrypted files spanning 8 hours from Star of Carella's Maitz arrival"
        status: pending
        notes: "Suspected to be battle logs and/or comms traffic. Higher-grade encryption."
      - description: "Captain's stateroom search — only anomaly was a missing book from a bookshelf"
        status: open
        notes: "Physical paper books are unusual. Missing one may be hidden, smuggled, or a hollowed cache."

