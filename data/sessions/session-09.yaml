session:
  number: 9
  date: 2026-03-06
  recap: |
    The company arrived at Mowebe, made the customary arrangements with authorities (no false
    papers filed), and sold their electronics components and chemicals at one of the many orbital
    manufactories — basically breaking even — before landing at the major spaceport (Day 13.1).

    Being at least two weeks early for their planned rendezvous with the Jade Front's intelligence
    operative, the company met the JF's Mowebe station chief: Kikonye, a zealous, ruthless man
    whose cover is as a luxury art dealer.

    He offered two jobs on behalf of the Jade Front:
    1. A sabotage job with a higher likelihood of requiring a quick exit from the system.
    2. A kidnapping and extraction of a high-value target to Ugrik — and obviously accessory to
       murder soon after.

    He offered cash for either job, or rewards from a weapons depot in system (including Quantum
    tech). The company chose the latter (kidnapping), and negotiated away the transport to Ugrik
    (giving away a pair of stealthsuits), but retained a full set of "polygraph detector"
    cybernetic implants.

    The target: Jassem Solal, a wealthy Thani noble in his mid-sixties, set to arrive imminently
    (~Day 13.6) at his private estate, accompanied by three wives, multiple children, mistresses,
    and a large household staff.

    The party met the two JF agents who had been working the operation: "Jake" and "Iké." The
    pair had recruited an asset, Okomi, who works as a guard at the estate. They also provided
    estimated timetables and satellite reconnaissance imagery of the compound.

    Day: 13.2
    Kitty: 97,010 Cr

