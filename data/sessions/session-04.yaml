      title: "Long-term JF intel circuit dispatched"
      description: |
        JF operative tasked with the Ith → Mowebe → Thane → Mowebe circuit,
        listening on Thane for two months for updates from Mora. Rendezvous
        set for Campaign Week 20 (seventeen weeks out).
    - week: 3.5
      title: "Sint Motor Systems (JF cover) offers cargo and arms"
      description: |
        Oa Danel, an Ithian with a polished demeanor, introduces herself at
        L3 as a representative of Sint Motor Systems Tfd. - a JF cover R&D
        company. Offers pharmaceutical cover cargo and illicit arms to
        smuggle.
      location: "Ith L3 station"
    - week: 3.5
      title: "Dylan Connell surveilling JF operations"
      description: |
        Ithian intelligence agent Dylan Connell - a true-believer - and
        two deputies are watching JF activity at L3. A clean departure
        cannot be guaranteed while they're active.
      location: "Ith L3 station"

  crew_events:
