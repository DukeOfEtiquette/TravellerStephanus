<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traveller Stephanus — Travel Calculator</title>
<script>
  // Apply saved palette before stylesheets evaluate, to avoid flash-of-default.
  try {
    var p = localStorage.getItem('ts-palette');
    if (p === 'phosphor' || p === 'starchart' || p === 'dossier') {
      document.documentElement.dataset.palette = p;
    }
    var f = localStorage.getItem('ts-font');
    if (f === 'reg' || f === 'lrg' || f === 'xlrg') {
      document.documentElement.dataset.font = f;
    }
  } catch (e) {}
</script>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* === Palettes (kept in sync with index.html) === */

  /* Phosphor — amber CRT on warm coal (default) */
  :root,
  html[data-palette="phosphor"] {
    --bg: #0c0a07;
    --bg-2: #15110b;
    --bg-3: #1d1810;
    --border: #322a1e;
    --border-2: #46392a;
    --text: #e8c896;
    --text-dim: #b3956a;
    --text-faint: #76624a;
    --accent: #ffb347;
    --accent-2: #ff7a1a;
    --accent-3: #f0d8a8;
    --good: #7ed957;
    --warn: #ffd86b;
    --bad: #ff7a7a;
    --orange: #ff9a4a;
    --accent-tint: rgba(255,179,71,0.16);
    --accent-tint-soft: rgba(255,179,71,0.06);
    --accent-2-tint: rgba(255,122,26,0.10);
    --accent-2-tint-soft: rgba(255,122,26,0.08);
    --code-bg: rgba(232,200,150,0.08);
    --button-hover-bg: #ff5e00;
    --hex-glow: rgba(255,122,26,0.8);
    --hex-glow-soft: rgba(255,122,26,0.6);
    --starport-A-fill: #2d6e3a;
    --starport-B-fill: #1e5a7a;
    --starport-C-fill: #8a7a1e;
    --starport-D-fill: #8a4e1e;
    --starport-X-fill: #6e2b2b;
    --scrim: rgba(0,0,0,0.55);
  }

  /* Star Chart — cosmic black, atlas gold + signal cyan */
  html[data-palette="starchart"] {
    --bg: #07080d;
    --bg-2: #0e1118;
    --bg-3: #131722;
    --border: #20283a;
    --border-2: #2a334a;
    --text: #ece6d6;
    --text-dim: #a8a08c;
    --text-faint: #6b6552;
    --accent: #f0c262;
    --accent-2: #6fb8ff;
    --accent-3: #ece6d6;
    --good: #4fd6a0;
    --warn: #f0c262;
    --bad: #ff6b81;
    --orange: #f0c262;
    --accent-tint: rgba(240,194,98,0.16);
    --accent-tint-soft: rgba(240,194,98,0.06);
    --accent-2-tint: rgba(111,184,255,0.12);
    --accent-2-tint-soft: rgba(111,184,255,0.08);
    --code-bg: rgba(236,230,214,0.08);
    --button-hover-bg: #4d9ce8;
    --hex-glow: rgba(111,184,255,0.8);
    --hex-glow-soft: rgba(111,184,255,0.6);
    --starport-A-fill: #1e5a45;
    --starport-B-fill: #1d3e6e;
    --starport-C-fill: #6e591e;
    --starport-D-fill: #6e3a1e;
    --starport-X-fill: #5a2540;
    --scrim: rgba(0,0,0,0.55);
  }

  /* Field Dossier — cream paper, oxblood ink, registry teal */
  html[data-palette="dossier"] {
    --bg: #efe6cf;
    --bg-2: #e6dab9;
    --bg-3: #ddcfa9;
    --border: #beae84;
    --border-2: #a89a72;
    --text: #2a241c;
    --text-dim: #5e5239;
    --text-faint: #8a7c5c;
    --accent: #8a2828;
    --accent-2: #1f4a5e;
    --accent-3: #3a2f24;
    --good: #4f7a35;
    --warn: #8c6512;
    --bad: #8a2828;
    --orange: #8c6512;
    --accent-tint: rgba(138,40,40,0.10);
    --accent-tint-soft: rgba(138,40,40,0.06);
    --accent-2-tint: rgba(31,74,94,0.10);
    --accent-2-tint-soft: rgba(31,74,94,0.08);
    --code-bg: rgba(42,36,28,0.06);
    --button-hover-bg: #6e1f1f;
    --hex-glow: rgba(31,74,94,0.55);
    --hex-glow-soft: rgba(31,74,94,0.40);
    --starport-A-fill: #c8d8ba;
    --starport-B-fill: #b9c9d4;
    --starport-C-fill: #dccfa6;
    --starport-D-fill: #dcc3a6;
    --starport-X-fill: #d8b8b8;
    --scrim: rgba(60,52,38,0.35);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    line-height: 1.5;
  }

  a { color: var(--accent); text-decoration: none; }
  a:hover { color: var(--accent); text-decoration: underline; }

  /* === Chrome (kept in sync with index.html) === */

  .layout {
    display: grid;
    grid-template-columns: 240px 1fr;
    min-height: 100vh;
  }

  /* Sidebar */
  aside.sidebar {
    background: var(--bg-3);
    border-right: 1px solid var(--border);
    padding: 16px 0;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }

  .brand {
    padding: 0 18px 14px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 12px;
  }
  .brand .home {
    display: block;
    text-decoration: none;
    color: inherit;
  }
  .brand .home:hover .title { filter: brightness(1.15); }
  .brand .title {
    color: var(--accent);
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  .brand .subtitle {
    color: var(--text-faint);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 4px;
  }

  /* Palette cycle button — three swatch dots, current one ringed */
  .palette-toggle {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    margin-top: 10px;
    padding: 5px 10px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 999px;
    cursor: pointer;
    line-height: 1;
    transition: background 120ms ease, border-color 120ms ease;
  }
  .palette-toggle:hover {
    background: var(--bg-2);
    border-color: var(--border-2);
  }
  .palette-toggle:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .palette-toggle .dot {
    display: inline-block;
    width: 9px; height: 9px;
    border-radius: 50%;
    opacity: 0.5;
    transition: opacity 120ms ease, transform 120ms ease, box-shadow 120ms ease;
  }
  .palette-toggle .dot[data-p="phosphor"]  { background: #ffb347; }
  .palette-toggle .dot[data-p="starchart"] { background: #6fb8ff; }
  .palette-toggle .dot[data-p="dossier"]   { background: #8a2828; }
  .palette-toggle[data-active="phosphor"]  .dot[data-p="phosphor"],
  .palette-toggle[data-active="starchart"] .dot[data-p="starchart"],
  .palette-toggle[data-active="dossier"]   .dot[data-p="dossier"] {
    opacity: 1;
    transform: scale(1.2);
    box-shadow: 0 0 0 1px var(--text);
  }

  /* Font-size cycle: scales all rem-based sizes via root font-size. */
  html                   { font-size: 130%; }
  html[data-font="lrg"]  { font-size: 145%; }
  html[data-font="xlrg"] { font-size: 160%; }

  .font-toggle {
    display: inline-flex;
    align-items: center;
    margin-top: 8px;
    padding: 5px 10px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 999px;
    cursor: pointer;
    line-height: 1;
    color: var(--text-dim);
    font-family: inherit;
    font-size: 0.72rem;
    letter-spacing: 0.05em;
    transition: background 120ms ease, border-color 120ms ease, color 120ms ease;
  }
  .font-toggle:hover {
    background: var(--bg-2);
    border-color: var(--border-2);
    color: var(--text);
  }
  .font-toggle:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .font-toggle .font-label {
    margin-left: 6px;
    color: var(--accent);
    font-weight: 600;
  }

  nav .group {
    padding: 8px 18px 4px;
    color: var(--text-faint);
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  nav a {
    display: block;
    padding: 6px 18px;
    color: var(--text);
    font-size: 0.88rem;
    border-left: 3px solid transparent;
  }
  nav a:hover {
    background: var(--accent-tint-soft);
    color: var(--accent);
    text-decoration: none;
  }
  nav a.active {
    border-left-color: var(--accent-2);
    background: var(--accent-2-tint);
    color: var(--accent);
  }

  /* Main */
  main.content {
    padding: 28px 36px 60px;
    max-width: 1100px;
    min-width: 0;
  }

  h1.page-title {
    color: var(--accent);
    font-size: 1.5rem;
    margin-bottom: 18px;
    letter-spacing: 0.02em;
  }

  /* Mobile menu button — hidden on desktop */
  .menu-toggle {
    display: none;
    position: fixed;
    top: 10px;
    left: 10px;
    z-index: 30;
    background: var(--bg-3);
    color: var(--accent);
    border: 1px solid var(--border-2);
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 1.25rem;
    line-height: 1;
    cursor: pointer;
    min-width: 44px;
    min-height: 44px;
  }
  .menu-toggle:hover { background: var(--bg-2); }
  .menu-toggle:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }

  .sidebar-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--scrim);
    z-index: 18;
  }

  /* Scroll-to-top */
  .scroll-top {
    position: fixed;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    right: 20px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--bg-2);
    border: 1px solid var(--border-2);
    color: var(--accent);
    cursor: pointer;
    display: grid;
    place-items: center;
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
    transition: opacity 200ms ease, transform 200ms ease, background 120ms ease, border-color 120ms ease;
    z-index: 25;
  }
  .scroll-top.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .scroll-top:hover { background: var(--bg-3); border-color: var(--accent); }
  .scroll-top:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .scroll-top svg { width: 20px; height: 20px; }

  /* === Travel-specific styles === */

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 16px;
    align-items: flex-end;
  }

  .control-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .control-group label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-faint);
  }

  select, input[type="number"] {
    background: var(--bg-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 10px;
    font-size: 0.9rem;
    min-width: 160px;
  }

  input[type="number"] { min-width: 80px; width: 80px; }

  select:focus, input:focus {
    outline: none;
    border-color: var(--accent-2);
  }

  .checkbox-group {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 0;
  }

  .checkbox-group label {
    font-size: 0.9rem;
    color: var(--accent);
    cursor: pointer;
  }

  button {
    background: var(--accent-2);
    color: white;
    border: none;
    border-radius: 4px;
    padding: 7px 20px;
    font-size: 0.9rem;
    cursor: pointer;
    font-weight: 600;
  }
  button:hover { background: var(--button-hover-bg); }

  /* Results panel */
  .results {
    margin: 0 0 16px;
    padding: 16px;
    background: var(--bg-2);
    border-radius: 6px;
    border: 1px solid var(--border);
    display: none;
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    font-size: 0.85rem;
    line-height: 1.6;
  }
  .results.visible { display: block; }

  .results .route {
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 8px;
  }
  .results .step { color: var(--text-dim); }
  .results .step .fuel-refined { color: var(--good); }
  .results .step .fuel-unrefined { color: var(--orange); }
  .results .step .refuel-stop { color: var(--warn); }
  .results .summary {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
    color: var(--text-dim);
  }
  .results .error { color: var(--bad); }

  /* Hex map */
  .map-container {
    margin: 0 0 20px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  svg.hex-map {
    background: var(--bg-3);
    border-radius: 6px;
    border: 1px solid var(--border);
    display: block;
  }

  .hex-poly {
    stroke: var(--border-2);
    stroke-width: 1.5;
    cursor: default;
  }

  .hex-poly.empty { fill: var(--bg); }
  .hex-poly.starport-A { fill: var(--starport-A-fill); }
  .hex-poly.starport-B { fill: var(--starport-B-fill); }
  .hex-poly.starport-C { fill: var(--starport-C-fill); }
  .hex-poly.starport-D { fill: var(--starport-D-fill); }
  .hex-poly.starport-X { fill: var(--starport-X-fill); }

  .hex-poly.on-route {
    stroke: var(--accent-2);
    stroke-width: 3.5;
    filter: drop-shadow(0 0 6px var(--hex-glow));
  }

  .hex-id {
    font-size: 12px;
    fill: var(--text-dim);
    text-anchor: middle;
    pointer-events: none;
    font-family: 'SF Mono', 'Fira Code', monospace;
  }

  .hex-name {
    font-size: 12px;
    fill: var(--text);
    text-anchor: middle;
    pointer-events: none;
    font-weight: 600;
  }

  .hex-starport {
    font-size: 11px;
    fill: var(--text);
    text-anchor: middle;
    pointer-events: none;
    font-family: 'SF Mono', 'Fira Code', monospace;
  }

  .route-line {
    stroke: var(--accent-2);
    stroke-width: 2.5;
    stroke-dasharray: 6 4;
    fill: none;
    opacity: 0.85;
    filter: drop-shadow(0 0 4px var(--hex-glow-soft));
  }

  .hex-poly.has-system { cursor: pointer; }
  .hex-poly.has-system:hover { stroke: var(--text-dim); stroke-width: 2.5; }

  /* Tablet / mobile — matches index.html breakpoint */
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; }
    .menu-toggle { display: block; }
    aside.sidebar {
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      width: min(280px, 84vw);
      z-index: 20;
      border-right: 1px solid var(--border);
      border-bottom: none;
      padding: 12px 0 24px;
      transform: translateX(-100%);
      transition: transform 0.2s ease;
      box-shadow: 2px 0 12px rgba(0,0,0,0.35);
      overscroll-behavior: contain;
    }
    body.sidebar-open aside.sidebar { transform: translateX(0); }
    body.sidebar-open .sidebar-backdrop { display: block; }

    nav a { padding: 11px 18px; font-size: 0.95rem; }
    nav .group { padding: 14px 18px 6px; }
    .brand { padding: 4px 18px 14px; }

    main.content {
      padding: 18px 16px 60px;
      padding-top: 60px;
      max-width: 100%;
    }

    h1.page-title { font-size: 1.3rem; margin-bottom: 14px; }

    /* Stack controls vertically; full-width inputs are easier to tap. */
    .controls {
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
    }
    .control-group { width: 100%; }
    .control-group label { font-size: 0.7rem; }
    select, input[type="number"] {
      min-width: 0;
      width: 100%;
      padding: 10px 12px;
      font-size: 1rem;
    }
    .checkbox-group { padding: 10px 0; }
    .checkbox-group input[type="checkbox"] {
      width: 20px; height: 20px;
      accent-color: var(--accent-2);
    }
    .checkbox-group label { font-size: 1rem; }
    button {
      width: 100%;
      padding: 12px 20px;
      font-size: 1rem;
      min-height: 44px;
    }

    .results {
      padding: 12px;
      font-size: 0.8rem;
      overflow-x: auto;
    }

    /* Let the SVG scale to viewport width while preserving aspect ratio. */
    svg.hex-map {
      width: 100%;
      height: auto;
      max-width: 100%;
    }
  }

  @media (max-width: 480px) {
    main.content { padding: 16px 12px 60px; padding-top: 60px; }
    h1.page-title { font-size: 1.2rem; }
  }
</style>
</head>
<body>

<button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
<div class="sidebar-backdrop" id="sidebar-backdrop"></div>

<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <a class="home" href="./" aria-label="Return to campaign home">
        <div class="title">TRAVELLER STEPHANUS</div>
        <div class="subtitle">Campaign Viewer</div>
      </a>
      <button class="palette-toggle" id="palette-toggle" type="button"
              aria-label="Cycle color palette" title="Cycle color palette">
        <span class="dot" data-p="phosphor"></span>
        <span class="dot" data-p="starchart"></span>
        <span class="dot" data-p="dossier"></span>
      </button>
      <br>
      <button class="font-toggle" id="font-toggle" type="button"
              aria-label="Cycle font size" title="Cycle font size">
        Font: <span class="font-label">Default</span>
      </button>
    </div>
    <nav id="nav"></nav>
  </aside>

  <main class="content">
    <h1 class="page-title">Travel Calculator</h1>

    <div class="controls">
      <div class="control-group">
        <label for="source">From</label>
        <select id="source"></select>
      </div>
      <div class="control-group">
        <label for="dest">To</label>
        <select id="dest"></select>
      </div>
      <div class="control-group">
        <label for="jump">Jump Rating</label>
        <select id="jump">
          <option value="1" selected>Jump-1</option>
          <option value="2">Jump-2</option>
          <option value="3">Jump-3</option>
          <option value="4">Jump-4</option>
          <option value="5">Jump-5</option>
        </select>
      </div>
      <div class="control-group">
        <label for="fuel">Refined Fuel</label>
        <input type="number" id="fuel" value="0" min="0" max="20">
      </div>
      <div class="control-group">
        <label for="max-fuel">Max Fuel</label>
        <input type="number" id="max-fuel" value="2" min="1" max="20">
      </div>
      <div class="control-group">
        <div class="checkbox-group">
          <input type="checkbox" id="inhabited-only" checked>
          <label for="inhabited-only">Inhabited only</label>
        </div>
      </div>
      <div class="control-group">
        <div class="checkbox-group">
          <input type="checkbox" id="plan">
          <label for="plan">Refuel mode</label>
        </div>
      </div>
      <div class="control-group">
        <button id="calc-btn">Calculate</button>
      </div>
    </div>

    <div class="results" id="results"></div>

    <div class="map-container">
      <svg class="hex-map" id="hex-map"></svg>
    </div>
  </main>
</div>

<button class="scroll-top" id="scroll-top" type="button" aria-label="Scroll to top" title="Back to top">
  <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M5 12l5-5 5 5"/>
  </svg>
</button>

<script>
'use strict';

// =========================================================================
// Sidebar nav (mirrors index.html's NAV; cross-page routes prefix index.html)
// =========================================================================

const NAV = [
  { group: 'Campaign', items: [
    { route: 'index.html',                label: 'Overview' },
    { route: 'index.html#/investigation', label: 'Investigation' },
    { route: 'index.html#/timeline',      label: 'Timeline' },
    { route: 'index.html#/npcs',          label: 'NPCs' },
    { route: 'index.html#/sessions',      label: 'GM Session Recaps' }
  ]},
  { group: 'Party', items: [
    { route: 'index.html#/party',  label: 'Party Members' },
    { route: 'index.html#/ships',  label: 'Ships' },
    { route: 'index.html#/assets', label: 'Assets' }
  ]},
  { group: 'Setting', items: [
    { route: 'index.html#/worlds', label: 'Worlds' },
    { route: 'travel.html',        label: 'Travel Calculator' }
  ]},
  { group: 'Rules', items: [
    { route: 'index.html#/rules',   label: 'Core Rules' },
    { route: 'index.html#/careers', label: 'Careers' },
    { route: 'index.html#/prices',  label: 'Prices & Equipment' },
    { route: 'index.html#/refs',    label: 'Reference Docs' }
  ]}
];

function escAttr(str) {
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function renderNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = NAV.map(g => `
    <div class="group">${escAttr(g.group)}</div>
    ${g.items.map(it =>
      `<a href="${escAttr(it.route)}" data-route="${escAttr(it.route)}">${escAttr(it.label)}</a>`
    ).join('')}
  `).join('');
  const active = nav.querySelector('a[data-route="travel.html"]');
  if (active) {
    active.classList.add('active');
    active.setAttribute('aria-current', 'page');
  }
}

// --- Embedded hex grid data ---

  hexes: [
    { id: "A",  col: 0, row: 0 },

    { id: "C",  col: 0, row: 2, system: "Tivid",     starport: "C" },

// --- Build lookup tables ---

const hexById = {};
const hexByColRow = {};
for (const hex of gridData.hexes) {
  hexById[hex.id] = hex;
  hexByColRow[`${hex.col},${hex.row}`] = hex;
}

const systems = gridData.hexes.filter(h => h.system).sort((a, b) => a.system.localeCompare(b.system));

// --- Populate dropdowns ---

function populateDropdowns() {
  const srcEl = document.getElementById('source');
  const dstEl = document.getElementById('dest');
  for (const sys of systems) {
    const label = `${sys.id} — ${sys.system} (Starport ${sys.starport})`;
    srcEl.add(new Option(label, sys.id));
    dstEl.add(new Option(label, sys.id));
  }
  srcEl.value = 'M';
  dstEl.value = 'Y';
}

// --- Hex geometry (even-q offset) ---

function toAxial(col, row) {
  return { q: col, r: row - Math.floor(col / 2) };
}

function hexDistance(a, b) {
  const ax = toAxial(a.col, a.row);
  const bx = toAxial(b.col, b.row);
  const dq = Math.abs(ax.q - bx.q);
  const dr = Math.abs(ax.r - bx.r);
  const ds = Math.abs((ax.q + ax.r) - (bx.q + bx.r));
  return (dq + dr + ds) / 2;
}

// --- Basic pathfinding (BFS) ---

function findPath(sourceId, destId, jumpRating, inhabitedOnly) {
  const source = hexById[sourceId];
  const dest = hexById[destId];
  if (!source || !dest) return null;

  const visited = new Set([sourceId]);
  const queue = [{ id: sourceId, path: [sourceId] }];

  while (queue.length > 0) {
    const { id: currentId, path: currentPath } = queue.shift();
    const current = hexById[currentId];

    if (currentId === destId) return currentPath;

    for (const hex of gridData.hexes) {
      if (visited.has(hex.id)) continue;
      if (inhabitedOnly && !hex.system && hex.id !== destId) continue;
      if (hexDistance(current, hex) <= jumpRating) {
        visited.add(hex.id);
        queue.push({ id: hex.id, path: [...currentPath, hex.id] });
      }
    }
  }

  return null;
}

// --- Basic travel calculator ---

function calculateTravel(sourceId, destId, jumpRating, refinedFuel, inhabitedOnly) {
  const foundPath = findPath(sourceId, destId, jumpRating, inhabitedOnly);
  if (!foundPath) {
    return { error: `No path from ${hexLabel(sourceId)} to ${hexLabel(destId)} with Jump-${jumpRating}` };
  }

  const jumps = [];
  let refinedLeft = refinedFuel;

  for (let i = 0; i < foundPath.length - 1; i++) {
    const from = hexById[foundPath[i]];
    const to = hexById[foundPath[i + 1]];
    const dist = hexDistance(from, to);
    let fuelType;

    if (refinedLeft > 0) {
      fuelType = 'Refined';
      refinedLeft--;
    } else {
      fuelType = 'Unrefined';
    }

    jumps.push({ from: foundPath[i], to: foundPath[i + 1], parsecs: dist, fuelType });
  }

  const numJumps = jumps.length;
  const totalWeeks = numJumps + 2;
  const refinedUsed = refinedFuel - refinedLeft;
  const unrefinedUsed = numJumps - refinedUsed;

  return { mode: 'basic', path: foundPath, jumps, numJumps, totalWeeks, refinedUsed, unrefinedUsed };
}

// --- Smart pathfinding (plan mode) ---

const DEFAULT_MAX_FUEL = 2;

function hasRefinedFuel(hex) {
  return hex.starport && ['A', 'B', 'C'].includes(hex.starport);
}

function planTravel(sourceId, destId, jumpRating, startingFuel, maxFuel = DEFAULT_MAX_FUEL, inhabitedOnly = true) {
  const source = hexById[sourceId];
  const dest = hexById[destId];
  if (!source || !dest) return { error: 'Unknown hex' };

  const stateKey = (id, fuel) => `${id}:${fuel}`;
  const dist = {};
  const prev = {};

  const startKey = stateKey(sourceId, startingFuel);
  dist[startKey] = 0;

  const pq = [[0, sourceId, startingFuel]];

  while (pq.length > 0) {
    pq.sort((a, b) => a[0] - b[0]);
    const [cost, hexId, fuel] = pq.shift();
    const key = stateKey(hexId, fuel);

    if (cost > (dist[key] ?? Infinity)) continue;

    if (hexId === destId) {
      return buildPlanResult(prev, key, sourceId, startingFuel);
    }

    const hex = hexById[hexId];

    if (fuel > 0) {
      for (const candidate of gridData.hexes) {
        if (candidate.id === hexId) continue;
        if (inhabitedOnly && !candidate.system && candidate.id !== destId) continue;
        if (hexDistance(hex, candidate) > jumpRating) continue;

        const newFuel = fuel - 1;
        const newKey = stateKey(candidate.id, newFuel);
        const newCost = cost + 1;
        if (newCost < (dist[newKey] ?? Infinity)) {
          dist[newKey] = newCost;
          prev[newKey] = { prevKey: key, action: 'jump', from: hexId, to: candidate.id };
          pq.push([newCost, candidate.id, newFuel]);
        }
      }
    }

    if (hasRefinedFuel(hex) && fuel < maxFuel) {
      const newKey = stateKey(hexId, maxFuel);
      const refuelCost = hexId === sourceId ? 0 : 2;
      const newCost = cost + refuelCost;
      if (newCost < (dist[newKey] ?? Infinity)) {
        dist[newKey] = newCost;
        prev[newKey] = { prevKey: key, action: 'refuel', at: hexId, fuelBefore: fuel };
        pq.push([newCost, hexId, maxFuel]);
      }
    }
  }

  return { error: `No route from ${hexLabel(sourceId)} to ${hexLabel(destId)} through system hexes with Jump-${jumpRating} and refined fuel only` };
}

function buildPlanResult(prev, goalKey, sourceId, startingFuel) {
  const actions = [];
  let key = goalKey;
  while (prev[key]) {
    actions.unshift(prev[key]);
    key = prev[key].prevKey;
  }

  const steps = [];
  const hexPath = [sourceId];

  for (const action of actions) {
    if (action.action === 'jump') {
      const dist = hexDistance(hexById[action.from], hexById[action.to]);
      steps.push({ type: 'jump', from: action.from, to: action.to, parsecs: dist });
      hexPath.push(action.to);
    } else {
      steps.push({ type: 'refuel', at: action.at, fuelBefore: action.fuelBefore, atOrigin: action.at === sourceId });
    }
  }

  let fuel = startingFuel;
  let totalPurchased = 0;
  let refuelStops = 0;
  let enrouteRefuelStops = 0;
  let numJumps = 0;

  for (let i = 0; i < steps.length; i++) {
    const step = steps[i];
    if (step.type === 'jump') {
      step.fuelType = 'Refined';
      fuel -= 1;
      numJumps++;
      step.fuelAfter = fuel;
    } else {
      let jumpsAhead = 0;
      for (let j = i + 1; j < steps.length; j++) {
        if (steps[j].type === 'jump') jumpsAhead++;
        if (steps[j].type === 'refuel') break;
      }
      const buy = Math.max(0, jumpsAhead - fuel);
      step.purchased = buy;
      fuel += buy;
      totalPurchased += buy;
      refuelStops++;
      if (!step.atOrigin) enrouteRefuelStops++;
      step.fuelAfter = fuel;
    }
  }

  const refuelWeeks = enrouteRefuelStops * 2;
  const totalWeeks = numJumps + refuelWeeks + 2;

  return {
    mode: 'plan',
    path: hexPath,
    steps,
    numJumps,
    refuelStops,
    refuelWeeks,
    totalWeeks,
    startingFuel,
    totalPurchased,
    totalRefined: startingFuel + totalPurchased
  };
}

// --- Display helpers ---

function hexLabel(id) {
  const hex = hexById[id];
  return hex.system ? `${id} (${hex.system})` : id;
}

function esc(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// --- Render results ---

function renderResult(result) {
  const el = document.getElementById('results');

  if (result.error) {
    el.innerHTML = `<div class="error">${esc(result.error)}</div>`;
    el.classList.add('visible');
    highlightRoute([]);
    return;
  }

  if (result.mode === 'plan') {
    renderPlanResult(result);
    return;
  }

  let html = '';

  // Route line
  html += `<div class="route">Route: ${esc(result.path.map(hexLabel).join(' → '))}</div>`;

  // Steps
  for (let i = 0; i < result.jumps.length; i++) {
    const j = result.jumps[i];
    const fuelClass = j.fuelType === 'Refined' ? 'fuel-refined' : 'fuel-unrefined';
    html += `<div class="step">Jump ${i + 1}: ${esc(hexLabel(j.from))} → ${esc(hexLabel(j.to))} (${j.parsecs} pc) — <span class="${fuelClass}">${j.fuelType}</span></div>`;
  }

  // Summary
  html += `<div class="summary">`;
  html += `Total time: ${result.totalWeeks} weeks (1w origin + ${result.numJumps}w jump${result.numJumps !== 1 ? 's' : ''} + 1w destination)<br>`;
  const fuelParts = [];
  if (result.refinedUsed > 0) fuelParts.push(`${result.refinedUsed} refined`);
  if (result.unrefinedUsed > 0) fuelParts.push(`${result.unrefinedUsed} unrefined`);
  html += `Fuel used: ${fuelParts.join(' + ')}`;
  html += `</div>`;

  el.innerHTML = html;
  el.classList.add('visible');
  highlightRoute(result.path);
}

function renderPlanResult(result) {
  const el = document.getElementById('results');
  let html = '';

  // Route line
  const routeParts = result.path.map(id => {
    const refuelStep = result.steps.find(s => s.type === 'refuel' && s.at === id);
    let label = hexLabel(id);
    if (refuelStep) label += ` [+${refuelStep.purchased} refined]`;
    return label;
  });
  html += `<div class="route">Route: ${esc(routeParts.join(' → '))}</div>`;

  // Steps
  let jumpNum = 0;
  for (const step of result.steps) {
    if (step.type === 'jump') {
      jumpNum++;
      html += `<div class="step">Jump ${jumpNum}: ${esc(hexLabel(step.from))} → ${esc(hexLabel(step.to))} (${step.parsecs} pc) — <span class="fuel-refined">Refined</span> [${step.fuelAfter} left]</div>`;
    } else {
      const hex = hexById[step.at];
      const timeCost = step.atOrigin ? 'at origin' : '2 weeks';
      html += `<div class="step"><span class="refuel-stop">Refuel at ${esc(hexLabel(step.at))}: buy ${step.purchased} refined (Starport ${hex.starport}) — ${timeCost}</span></div>`;
    }
  }

  // Summary
  html += `<div class="summary">`;
  const timeParts = [`1w origin`, `${result.numJumps}w jump${result.numJumps !== 1 ? 's' : ''}`];
  if (result.refuelWeeks > 0) timeParts.push(`${result.refuelWeeks}w refueling`);
  timeParts.push(`1w destination`);
  html += `Total time: ${result.totalWeeks} weeks (${timeParts.join(' + ')})<br>`;
  const fuelParts = [`${result.startingFuel} carried`];
  if (result.totalPurchased > 0) fuelParts.push(`${result.totalPurchased} purchased`);
  html += `Fuel: ${fuelParts.join(' + ')} = ${result.totalRefined} refined`;
  html += `</div>`;

  el.innerHTML = html;
  el.classList.add('visible');
  highlightRoute(result.path);
}

// --- SVG Hex Map ---

const HEX_SIZE = 52;
const SQRT3 = Math.sqrt(3);
const PAD = 60;

function hexCenter(col, row) {
  const x = PAD + col * 1.5 * HEX_SIZE;
  const y = PAD + row * SQRT3 * HEX_SIZE + (col % 2 === 1 ? SQRT3 / 2 * HEX_SIZE : 0);
  return { x, y };
}

function hexPoints(cx, cy) {
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const angle = Math.PI / 180 * (60 * i);
    pts.push(`${cx + HEX_SIZE * Math.cos(angle)},${cy + HEX_SIZE * Math.sin(angle)}`);
  }
  return pts.join(' ');
}

function starportClass(hex) {
  if (!hex.system) return 'empty';
  return `starport-${hex.starport}`;
}

let hexElements = {};
let routeLineGroup = null;

function renderMap() {
  const svg = document.getElementById('hex-map');
  const maxCol = 4;
  const maxRowEven = 6;
  const maxRowOdd = 5;

  const width = PAD * 2 + maxCol * 1.5 * HEX_SIZE + HEX_SIZE;
  const height = PAD * 2 + maxRowEven * SQRT3 * HEX_SIZE + SQRT3 / 2 * HEX_SIZE;

  svg.setAttribute('width', width);
  svg.setAttribute('height', height);
  svg.setAttribute('viewBox', `0 0 ${width} ${height}`);

  // Route lines group (rendered below hexes)
  routeLineGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  svg.appendChild(routeLineGroup);

  for (const hex of gridData.hexes) {
    const { x, y } = hexCenter(hex.col, hex.row);

    // Hex polygon
    const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
    poly.setAttribute('points', hexPoints(x, y));
    poly.setAttribute('class', `hex-poly ${starportClass(hex)}${hex.system ? ' has-system' : ''}`);
    poly.dataset.id = hex.id;
    svg.appendChild(poly);

    hexElements[hex.id] = poly;

    // Click to select as source/dest
    if (hex.system) {
      poly.addEventListener('click', () => onHexClick(hex.id));
    }

    // Hex ID label (top)
    const idText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    idText.setAttribute('x', x);
    idText.setAttribute('y', y - (hex.system ? 18 : 4));
    idText.setAttribute('class', 'hex-id');
    idText.textContent = hex.id;
    svg.appendChild(idText);

    if (hex.system) {
      // System name (center)
      const nameText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      nameText.setAttribute('x', x);
      nameText.setAttribute('y', y + 2);
      nameText.setAttribute('class', 'hex-name');
      nameText.textContent = hex.system;
      svg.appendChild(nameText);

      // Starport badge (bottom)
      const portText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      portText.setAttribute('x', x);
      portText.setAttribute('y', y + 20);
      portText.setAttribute('class', 'hex-starport');
      portText.textContent = `★ ${hex.starport}`;
      svg.appendChild(portText);
    }
  }
}

// Click hex to set source or destination
let nextClickTarget = 'source';

function onHexClick(hexId) {
  const sel = document.getElementById(nextClickTarget);
  // Find the option with this value
  for (let i = 0; i < sel.options.length; i++) {
    if (sel.options[i].value === hexId) {
      sel.selectedIndex = i;
      break;
    }
  }
  nextClickTarget = nextClickTarget === 'source' ? 'dest' : 'source';
}

function highlightRoute(path) {
  // Reset all hexes
  for (const id in hexElements) {
    hexElements[id].classList.remove('on-route');
  }

  // Clear route lines
  while (routeLineGroup.firstChild) {
    routeLineGroup.removeChild(routeLineGroup.firstChild);
  }

  if (!path || path.length === 0) return;

  // Highlight hexes on route
  for (const id of path) {
    if (hexElements[id]) {
      hexElements[id].classList.add('on-route');
    }
  }

  // Draw route lines
  for (let i = 0; i < path.length - 1; i++) {
    const from = hexById[path[i]];
    const to = hexById[path[i + 1]];
    const p1 = hexCenter(from.col, from.row);
    const p2 = hexCenter(to.col, to.row);

    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', p1.x);
    line.setAttribute('y1', p1.y);
    line.setAttribute('x2', p2.x);
    line.setAttribute('y2', p2.y);
    line.setAttribute('class', 'route-line');
    routeLineGroup.appendChild(line);
  }
}

// --- Event handlers ---

document.getElementById('calc-btn').addEventListener('click', () => {
  const sourceId = document.getElementById('source').value;
  const destId = document.getElementById('dest').value;
  const jumpRating = parseInt(document.getElementById('jump').value, 10);
  const fuel = parseInt(document.getElementById('fuel').value, 10) || 0;
  const maxFuel = parseInt(document.getElementById('max-fuel').value, 10) || DEFAULT_MAX_FUEL;
  const inhabitedOnly = document.getElementById('inhabited-only').checked;
  const planMode = document.getElementById('plan').checked;

  if (sourceId === destId) {
    const el = document.getElementById('results');
    el.innerHTML = '<div class="error">Source and destination are the same.</div>';
    el.classList.add('visible');
    highlightRoute([]);
    return;
  }

  const result = planMode
    ? planTravel(sourceId, destId, jumpRating, fuel, maxFuel, inhabitedOnly)
    : calculateTravel(sourceId, destId, jumpRating, fuel, inhabitedOnly);

  renderResult(result);
});

// Allow Enter key to trigger calculation
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('calc-btn').click();
});

// --- Palette toggle: phosphor → starchart → dossier → phosphor ---
(function setupPaletteToggle() {
  const PALETTES = ['phosphor', 'starchart', 'dossier'];
  const btn = document.getElementById('palette-toggle');
  if (!btn) return;
  const current = () => document.documentElement.dataset.palette || 'phosphor';
  const apply = (p) => {
    document.documentElement.dataset.palette = p;
    try { localStorage.setItem('ts-palette', p); } catch (e) {}
    btn.dataset.active = p;
  };
  apply(current());
  btn.addEventListener('click', () => {
    const next = PALETTES[(PALETTES.indexOf(current()) + 1) % PALETTES.length];
    apply(next);
  });
})();

// --- Font-size toggle: reg → lrg → xlrg → reg ---
(function setupFontToggle() {
  const SIZES = ['reg', 'lrg', 'xlrg'];
  const LABELS = { reg: 'Default', lrg: 'Large', xlrg: 'XLarge' };
  const btn = document.getElementById('font-toggle');
  if (!btn) return;
  const label = btn.querySelector('.font-label');
  const current = () => document.documentElement.dataset.font || 'reg';
  const apply = (size) => {
    document.documentElement.dataset.font = size;
    try { localStorage.setItem('ts-font', size); } catch (e) {}
    if (label) label.textContent = LABELS[size];
  };
  apply(current());
  btn.addEventListener('click', () => {
    const next = SIZES[(SIZES.indexOf(current()) + 1) % SIZES.length];
    apply(next);
  });
})();

// --- Mobile sidebar toggle ---
(function setupMobileNav() {
  const btn = document.getElementById('menu-toggle');
  const backdrop = document.getElementById('sidebar-backdrop');
  if (!btn || !backdrop) return;
  const close = () => {
    document.body.classList.remove('sidebar-open');
    btn.setAttribute('aria-expanded', 'false');
  };
  btn.addEventListener('click', () => {
    const open = document.body.classList.toggle('sidebar-open');
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  backdrop.addEventListener('click', close);
  document.getElementById('nav').addEventListener('click', e => {
    if (e.target.closest('a')) close();
  });
})();

// --- Scroll-to-top button ---
(function setupScrollTop() {
  const btn = document.getElementById('scroll-top');
  if (!btn) return;
  const THRESHOLD = 400;
  let ticking = false;
  function update() {
    btn.classList.toggle('visible', window.scrollY > THRESHOLD);
    ticking = false;
  }
  window.addEventListener('scroll', () => {
    if (!ticking) { requestAnimationFrame(update); ticking = true; }
  }, { passive: true });
  btn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
  update();
})();

// --- Init ---
renderNav();
populateDropdowns();
renderMap();
</script>
