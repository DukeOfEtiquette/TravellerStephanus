    - "Set 'cry baby cry' diversion aboard Star of Carella before exploring the larger Revenant's Echo"
    - "Looted Star of Carella: physical storage media (bridge + computer room), captain's stateroom (only anomaly was a missing book from a bookshelf), 2 x 10 dTon shuttlecraft"
    - "Siphoned fuel from Star of Carella to refill VoL II tanks (2/2)"
    - "Decrypted Star of Carella storage crystals: orders from Tivid to Maitz to capture or destroy the Newhall scout Deepest Light (100 dT), unsigned, Priority 1"
    - "Crystals also contained thousands of short, encrypted files spanning an 8-hour window starting from Star of Carella's arrival in Maitz — none yet decoded"

