# =============================================================================
# SHIPS
# =============================================================================
ships:

  - name: "Voice of Liberation II"
    type: Smuggling Vessel
    owner: Jade Front (on loan to party)
    acquired: "Session 2"
    status: operational

    description: |
      Formerly captured by pirates and held at Kath starport. Party liberated
      it through blackmail. Scrubbed of spy devices. Has a hidden smuggling
      compartment the pirates missed.

    frame:
      tonnage: 200
      hull_hp: 20
      hull_current: 20
      cargo_capacity: 25   # tons
      hanger_capacity: 20  # tons

    systems:
      impulse: 1
      jump: 1
      shields: 1
      pulse_lasers: 1
      missiles:
        rating: 1
        loaded: 4
      anti_missiles:
        rating: 4d6
        count: 2

    amenities:
      staterooms:    { rating: 4, capacity: 8 }  # persons
      barracks:      { rating: 1, capacity: 5 }  # marines
      low_berths:    { rating: 1, capacity: 6 }  # persons
      smuggling_compartment:
        rating: 1
        notes: Hidden compartment, pirates didn't find it

    crew:
      captain: null
      pilot: null
      engineer: null
      gunner: null
      steward: null
      medic: null
      marines: []

    passengers:
      - name: Petra
        role: Jade Front contact
        boarded: "Session 3"
        notes: Provided intel on Cooper-Akachi operatives
      - name: Samir
        role: Jade Front contact
        boarded: "Session 3"
      - name: Arvi
        role: Refugee / Vondel's sister
        boarded: "Session 8"
        notes: |
          Boarded during the Stoyben cylinder exfiltration after murdering Torin
          to free Vondel from his abuse. Traveling with the party onward.

    cargo:
      - item: "Pharmaceuticals (Rx)"
        tons: 4
        value: 14000   # Cr - covers all 20 t (this 4 t + 8 t in each shuttle)
        notes: |
          Loose stowage. 16 additional tons are stored inside the two shuttles
          below - those tons don't count against bay capacity because 'tonnage'
          is volume and the shuttles enclose their own internal volume.
          Total 20 t of Rx valued at 14,000 Cr.
      - name: "Shuttlecraft (Cosmic)"
        owner: "Crew"
        tons: 10
        source: "Star of Carella wreck (Session 13)"
        cargo_capacity: 8  # tons internal
        current_cargo:
          - item: "Pharmaceuticals (Rx)"
            tons: 8
      - name: "Shuttlecraft (Dawn)"
        owner: "Crew"
        tons: 10
        source: "Star of Carella wreck (Session 13)"
        cargo_capacity: 8  # tons internal
        current_cargo:
          - item: "Pharmaceuticals (Rx)"
            tons: 8

    hanger:
      - name: "Shuttlecraft (Blackbetty)"
        owner: "William Hung"
        tons: 10               # external tonnage in VoL II hangar
        cargo_capacity: 8      # tons internal
        current_cargo:
          - item: "Ground car"
            tons: 2
          - item: "Grav car"
            tons: 2
          - item: "Speeder bike"
            tons: 1
            count: 2
        history:
          - session: 7
            event: "Loaded Hung's unarmored car (2t) and Saviolo's armored car (4t); cleared all but the grav bike for the cylinder op."
      - name: "Shuttlecraft (The Psicho)"
        owner: "Victor"
        tons: 10               # external tonnage in VoL II hangar
        cargo_capacity: 8      # tons internal
        current_cargo:
          - item: "Armored car"
            tons: 4
          - item: "Grav car"
            tons: 2
          - item: "Speeder bike"
            tons: 1
            count: 1
        history:
          - session: 7
            event: "Grav car loaded for cylinder operation."
          - session: 11
            event: "Used in Solal extraction."

    history:
      - session: 5
        event: "Refit at Stoyben shipyard (fuel tanks); Baron Harrow secured an immediate slot."
      - session: 6
        event: "Took on two middle passengers and trade goods."
      - session: 7
        event: "Jump fuel pod retrofit completed."
      - session: 9
        event: "Electronics + chemicals sold at Mowebe manufactories (broke even)."
      - session: 12
        event: |
          Mowebe intercept: fired all 4 missiles (area-denial airburst); both
          fighter-interceptors destroyed. Misjump on departure caused Oort cloud
          deviation and powerplant damage. Van Leeuwen and Corinne Page repaired
          at the JF lunar depot. Missiles and fuel fully restocked. Acquired 2
          anti-missile launchers from Kikonye's weapons depot.
      - session: 13
        event: |
          Jumped to Maitz; refueled by siphoning the Star of Carella wreck
          (fuel 2/2 maintained). Looted two 10 dT shuttlecraft from the wreck
          and dumped manufactured trade goods to make room. Reorganized the
          pre-existing 20 t of Rx - 8 t loaded into each looted shuttle as
          internal storage, 4 t left loose in the bay.
      - session: 14
        event: |
          Used as the staging vessel for boarding the Savage Intent (Quiru,
          400 t) and the Revenant's Echo. Samir remained aboard the Savage
          Intent alone to disarm a Cooper-Akachi-parts bomb wired into the
          jump drive. Crew assessed the Savage Intent as jump-capable with a
          skeleton crew - flagged as a possible future prize, not yet seized.
          No ship-to-ship combat. Fuel 2/2 (unchanged).
      - session: 15
        event: |
          Used to intercept a Cooper-Akachi surveillance buoy that launched
          from behind the Revenant's Echo for planet Maitz. Continued
          staging the Revenant's Echo boarding (captain's-chair records
          recovered; vacuum-adapted squid combat at the power core forced
          a desperate retreat). Council decided to move both VoL II and the
          Savage Intent to Stoyben, with the Savage Intent slated for sale.
          Critical: the buoy emitted a directional radio burst to Maitz
          containing VoL II's transponder code and physical description
          before fuel exhaustion - the ship's signature is leaked. No
          ship-to-ship combat. Fuel 2/2 (unchanged).

    damage_log:
      - session: 12
        damage: "Powerplant damaged during misjump into Oort cloud"
        repaired: true
        repaired_by: "Van Leeuwen and Corinne Page at lunar JF depot"

  - name: "Savage Intent"
    type: "Military vessel (Quiru, 400 t)"
    owner: "Party (de facto, post-Maitz)"
    acquired: "Session 15"
    status: operational

    description: |
      Quiru 400-ton military vessel originally crewed almost entirely by
      marines. Recovered at Maitz: boarded Session 14, operability confirmed
      Session 15. Sabotage on board was neutralized in Session 14 (bridge-
      door grenade detonated; ship's computer destroyed by an anti-personnel-
      grade explosive; high-end Cooper-Akachi bomb wired into the jump drive
      disarmed by Samir).

    frame:
      tonnage: 400

    disposition: |
      Council decision (Session 15): move to Stoyben with VoL II to sell.
      Jade Front gets right of first refusal. Intent is to fund a faster
      replacement ship and break the leaked VoL II ship signature trail
      (see investigation.yaml key_intel:party-ship-signature-leaked).

    history:
      - session: 14
        event: |
          Boarded. Sabotage neutralized: bridge-door grenade trap (Corinne
          injured), ship's computer destroyed, Cooper-Akachi-parts jump-
          drive bomb disarmed by Samir. Black box decoded. Cargo crates
          inventoried (1 empty, 2 empty with racks, rest rations). Crew
          assessed: jump-capable with a skeleton crew.
      - session: 15
        event: |
          Operability confirmed - the ship can be run with a skeleton crew
          and jumped out of the system. Council decision to move it to
          Stoyben for sale (JF right of first refusal).

# =============================================================================
# RECOVERED INTELLIGENCE / DATA
# =============================================================================
recovered_data:
  - source: "Star of Carella (Newhall) - Session 13"
    items:
      - description: "Decrypted orders: Tivid → Maitz, Priority 1, capture or destroy Newhall scout Deepest Light"
        status: decoded
        notes: "Unsigned. Higher-grade encryption used. Suggests command-level traffic with deniability."
      - description: "Thousands of short, encrypted files spanning 8 hours from Star of Carella's Maitz arrival"
        status: pending
        notes: "Suspected to be battle logs and/or comms traffic. Higher-grade encryption."
      - description: "Captain's stateroom search - only anomaly was a missing book from a bookshelf"
        status: open
        notes: "Physical paper books are unusual. Missing one may be hidden, smuggled, or a hollowed cache."

  - source: "Savage Intent (Quiru) - Session 14"
    items:
      - description: "Black box (decoded) - intercept-course log"
        status: decoded
        notes: |
          Laid in wait behind a moon, then matched course alongside an object on a
          gas-skim trajectory. Used to launch the extraction of a person codenamed
          Bunny from the Newhall scout Deepest Light.
      - description: "Cooper-Akachi bomb components from the jump drive (disarmed)"
        status: evidence
        notes: |
          High-end Cooper-Akachi parts. Material evidence of Cooper-Akachi presence
          at or after the Maitz engagement. Disarmed alone aboard by Samir.
      - description: "Cargo manifest observation"
        status: observed
        notes: "1 empty crate, 2 empty with racks, balance rations."

  - source: "Revenant's Echo (Newhall) - Session 14"
    items:
      - description: "Captain's combat logs (partial splice)"
        status: decoded_partial
        notes: |
          Full Newhall-side battle roster recovered (names of all other ships in
          the engagement). Deepest Light never named in the logs. Multiple
          references to "Bunny." Captain ordered fleet retreat after Bunny was
          "taken" and "lost."
      - description: "Hindsight viewings (Victor) - captain's chair and sensor station"
        status: recorded
        notes: |
          Captain's chair (moment of retreat): order explicitly referenced the
          boarding party extracting Bunny from the ship - confirms Bunny is a
          person. Sensor station: visual of Quiru marines extracting a human-
          appearing figure from a 100 dT scout (the Deepest Light), with the
          Savage Intent in the background.

  - source: "Cooper-Akachi surveillance buoy (Maitz battlefield) - Session 15"
    items:
      - description: "Buoy hard drives - decoded surveillance log"
        status: decoded
        notes: |
          Buoy deployed at the Maitz battlefield in Campaign Week 18 by a
          Cooper-Akachi ship. Wk 22: a Newhall ship arrived, inspected the
          field for ~12 hours, and left. The buoy also detected and
          monitored the party's arrival in Session 13–14 until they
          intercepted it in Session 15. Just before running out of fuel,
          it emitted a directional radio burst toward planet Maitz
          transmitting VoL II's transponder code and physical description.
          Party ship signature is leaked.

  - source: "Revenant's Echo (Newhall) - Session 15"
    items:
      - description: "Captain's-chair partial fleet-coordination records"
        status: decoded_partial
        notes: |
          Confirms Newhall came to Maitz pursuing Bunny and was AMBUSHED by
          Quiru - reframes the engagement as a one-sided Quiru ambush of
          putative allies, not a co-equal covert fight.
      - description: "Captain's-quarters safe (abandoned during squid attack)"
        status: open
        notes: |
          Victor was actively cracking the safe when the squid attack at
          the power core interrupted him. Safe was left untouched during
          the retreat; contents unknown.

# Note: hanger contents are now nested under each ship's `hanger:` field above.
