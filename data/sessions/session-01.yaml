      title: "Characters created; faction joined"
      description: |
        Players made at least two characters each and chose one to play.
        Selected three ship NPC slots based on faction allegiance: Marine,
        Marine, Deckhand.
    - day: 0
      title: "Ship-upgrade options received"
      description: |
        Faction-based starting ship upgrade menu presented (combat: beam
