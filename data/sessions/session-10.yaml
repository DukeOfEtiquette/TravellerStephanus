session:
  number: 10
  date: 2026-03-13
  recap: |
    The crew hatched a plan to gather more information and arrange a more suitable situation for
    the abduction. They arranged for Chief Broker Hung to be hired as catering manager at the
    estate, while Baron Harrow led a team who posed as computer technicians - and secretly hacked
    the estate's servers with a high degree of success, gaining root administrator access.

    The crew used their access to:
    1. Access and manipulate all schedules, allowing them to plan around several hunting
       expeditions, a suspicious number of meetings with Cooper-Akachi Diversified Industries
       representatives, and a "black hole" gap in the schedule.
    2. Profile Hassan, the target's majordomo and chief of staff.
    3. Plant a virus on a timer to get them back into the estate during the gap day (intermittent
       beeping alarms in the toilets and sleeping areas).
    4. Create four false profiles for household staff in the security department, using some of
       the crew's biometrics.

    Solal arrived in the system late, then burned in at 9 Gs (highly suspicious) to make
    planetfall before the gap day.

    The crew failed to intervene during the gap day itself. However, Corinne Page broke into
    Hassan's office hoping to find a personal tracker of some sort keyed to Solal. She did not
    find one, but did find tender, personal letters from Solal to his illegitimate son - Hassan
    himself. Solal cares very deeply for his bastard child.

    Finally, the crew purchased a very large amount of powerful sleeping drugs that should evade
    automated anti-poison countermeasures (thanks to Dr. van Leeuwen).

    Using these drugs, Catering Manager Hung arranged to spike the food of the entire hunting
    party - Solal, his household guard, all guests and staff - during the hunting expedition at
    the Nbangu Dikila Nature Preserve. The party applied antidote for themselves.

    We resume next session after the hunting party arrives back at the pavilion following the
    morning's hunt, feasting on the poisoned meal and beginning to fall into deep slumber…

    Day: 14.6
    Kitty: 73,750 Cr

