    - week: 24.3
      title: "Hung's helmet glass breached by a squid"
      description: "Squid wrapped around the helmet and cracked the glass; survived with squad assistance."

    - week: 24.3
      title: "Samir panicked during the escape"
      description: "Two squids attached to the shuttle; Samir froze under pressure before being talked into opening the shuttle door."

