session:
  number: 7
  date: 2026-02-20
  recap: |
    The company solicited a job from Isaiah Reed involving exfiltrating damaging political
    information about the Civic Administrator (Torin) of an O'Neill cylinder two days from Stoyben.
    Loaded vehicles into shuttlecrafts and took on 19 tons of electronics cargo.

    JF Mission Briefing (from Reed):
    - Thousands of O'Neill cylinders orbit Stoyben, each governed by a Civic Administrator
    - A JF agent ("Alicia") befriended the Administrator's wife, Vondel, and convinced her
      to leave her abusive, distant husband Torin
    - The deal: Vondel downloads Torin's work computer hard drive, and "Alicia" would use
      her connections to protect Vondel
    - Vondel initially agreed, but got cold feet during exfiltration
    - Notably: Vondel had been scared and anxious for months of grooming, but when she
      backed out she appeared confident and determined — a suspicious behavioral shift
    - Vondel doesn't know about "Alicia's" JF connection
    - "Alicia" is now burned as Vondel's handler

    The party split up to avoid drawing attention — some took shuttlecrafts, others took
    commercial transport to the cylinder.

    The company took a multi-pronged approach:
    - Successfully collecting private investigation dirt on the target
    - Engaging in philanthropic/socialite events to forge a personal relationship with Vondel
    - Meeting and evaluating the target in his estate and developing a relationship
    - Working the staff nightlife spots for actionable information about the upper classes

    Key discoveries:
    - Torin is openly sleeping with Kenna and secretly sleeping with Arvi (Vondel's sister)
    - Vondel has stopped acting afraid and pulled out from the plan to flee
    - Tevetz (hot young scion of a wealthy business family) recently seems familiar with Vondel
    - Tetzel (editor of the station's Page 6 gossip rag) wants photos of Torin with a mistress

    Ship retrofit (jump fuel pods) completed. Session ended mid-operation.

    Time: 7.3
    Location: O'Neill Cylinder two days from Stoyben
    Kitty: 26,200 cr

