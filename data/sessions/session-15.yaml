    - "Buoy's final act before fuel exhaustion: directional radio burst toward planet Maitz transmitting VoL II's transponder code and physical description (party ship signature now compromised)"
    - "Boarded the Revenant's Echo; partial fleet-coordination records confirmed Newhall was AMBUSHED by Quiru while pursuing Bunny"
    - "Confirmed the Savage Intent can be run with a skeleton crew and jumped out of the system"
    - "Attacked at the power core by vacuum-adapted squid-like organisms attracted to heat; capable of breaching helmet glass"
    - "Van Leeuwen (zero-G adept) saved an injured Corinne and killed one squid against a plasma-liquified bulkhead (Corinne's heat hunch)"
    - "Victor abandoned the captain's-quarters safe to defend Hung; safe contents unknown"
    - "Hung finished the second squid with his beam laser pistol after Victor's shot"
    - "Council decided to move both VoL II and Savage Intent to Stoyben; sell Savage Intent to fund a faster ship; Jade Front gets right of first refusal"

